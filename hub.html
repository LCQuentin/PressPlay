        const bunkerCount = 3; const bunkerW = 80; const bunkerGap = (this.canvas.width - (bunkerCount * bunkerW)) / (bunkerCount + 1);
        for(let i=0; i<bunkerCount; i++) { this.bunkers.push({ x: bunkerGap + i * (bunkerW + bunkerGap), y: this.canvas.height - 120 - bottomLift, w: bunkerW, h: 40, hp: 10 }); }

        this.state = 'WAITING';
        app.showGameMessage("WAVE " + this.wave, this.wave === 1 ? "ARROWS: MOVE // SPACE: FIRE" : "CLICK TO LAUNCH");
    }

    waveClear() {
        if (this.wave >= this.maxWaves) {
            this.state = 'VICTORY';
            const isRecord = app.saveHighScore('INVADERS', this.score);
            app.unlock('INVADERS_CLEAR');
            app.showGameMessage(isRecord ? "NEW RECORD" : "ALL WAVES CLEAR", "SCORE: " + this.score);
            audio.play('POWERUP');
            return;
        }
        this.wave++;
        this.buildWave();
        audio.play('POWERUP');
    }

    onResize(oldW, oldH, newW, newH) {
        const sx = newW / oldW;
        this.aliens.forEach(a => a.x *= sx);
        if (this.ufo) this.ufo.x *= sx;
        this.bullets.forEach(b => b.x *= sx);
        this.enemyBullets.forEach(b => b.x *= sx);
        this.bunkers.forEach(b => b.x *= sx);
        this.player.x = Math.max(0, Math.min(newW - this.player.w, this.player.x * sx));
        const bottomLift = app.touchVisible ? 140 : 0;
        this.player.y = newH - 50 - bottomLift;
        this.bunkers.forEach(b => b.y = newH - 120 - bottomLift);
        this.enemyBullets = this.enemyBullets.filter(b => b.y < newH);
    }

    handleClick() {
        if(this.state === 'WAITING') { this.state = 'PLAYING'; app.hideGameMessage(); }
        else if (this.state === 'GAMEOVER' || this.state === 'VICTORY') { this.reset(); }
    }

    update() {
        this.particles.forEach(p => p.update()); this.particles = this.particles.filter(p => p.life > 0);
        if(this.shake > 0) this.shake *= 0.9;
        const keys = app.input.keys;
        if (this.state === 'WAITING' && (keys['ArrowLeft'] || keys['ArrowRight'] || keys[' '] || app.input.consumeAny(['ArrowLeft','ArrowRight',' ']))) { this.state = 'PLAYING'; app.hideGameMessage(); }
        if(this.state !== 'PLAYING') return;

        this.ufoTimer--;
        if (!this.ufo && this.ufoTimer <= 0) {
            this.ufo = { x: -60, y: 96, w: 50, h: 20, vx: 2 + this.wave * 0.2 };
            this.ufoTimer = 900 + Math.random() * 900;
        }
        if (this.ufo) {
            this.ufo.x += this.ufo.vx;
            if (this.ufo.x > this.canvas.width + 60) this.ufo = null;
        }

        if(keys['ArrowLeft']) this.player.x -= this.player.speed;
        if(keys['ArrowRight']) this.player.x += this.player.speed;
        if(this.player.x < 0) this.player.x = 0; if(this.player.x + this.player.w > this.canvas.width) this.player.x = this.canvas.width - this.player.w;

        if(this.player.cooldown > 0) this.player.cooldown--;
        const tapSpace = app.input.consumePressed(' ');
        const tapUp = app.input.consumePressed('ArrowUp');
        if((keys[' '] || keys['ArrowUp'] || tapSpace || tapUp) && this.player.cooldown <= 0) {
            this.bullets.push({x: this.player.x + this.player.w/2 - 2, y: this.player.y, w: 4, h: 10, active: true});
            this.player.cooldown = 20; 
            audio.play('SHOOT');
        }

        for(let b of this.bullets) { b.y -= 10; if(b.y < 0) b.active = false; } this.bullets = this.bullets.filter(b => b.active);
        for(let b of this.enemyBullets) { b.y += 4; if(b.y > this.canvas.height) b.active = false; } this.enemyBullets = this.enemyBullets.filter(b => b.active);

        let hitEdge = false; let lowestY = 0; const activeAliens = this.aliens.filter(a => a.active);
        if (activeAliens.length === 0) { this.waveClear(); return; }

        if(Math.random() < 0.005 + (0.0005 * (50 - activeAliens.length))) {
            const shooter = activeAliens[Math.floor(Math.random() * activeAliens.length)];
            this.enemyBullets.push({x: shooter.x + shooter.w/2, y: shooter.y + shooter.h, w: 4, h: 10, active: true});
            // audio.play('SHOOT'); // Maybe too noisy
        }

        const speedMult = 1 + (50 - activeAliens.length) * 0.05;
        for(let a of this.aliens) { if(!a.active) continue; a.x += this.alienDir * this.alienSpeed * speedMult; if(a.x <= 10 || a.x + a.w >= this.canvas.width - 10) hitEdge = true; if(a.y > lowestY) lowestY = a.y; }
        if(hitEdge) { this.alienDir *= -1; for(let a of this.aliens) a.y += 20; }
        if(lowestY + 20 >= this.player.y) { 
            this.state = 'GAMEOVER'; 
            const isRecord = app.saveHighScore('INVADERS', this.score);
            app.showGameMessage(isRecord ? "NEW RECORD" : "INVASION SUCCESSFUL", "SCORE: " + this.score); 
            audio.play('GAMEOVER');
        }

        for(const b of this.bullets) {
            if(!b.active) continue;
            if (this.ufo && b.x < this.ufo.x + this.ufo.w && b.x + b.w > this.ufo.x && b.y < this.ufo.y + this.ufo.h && b.y + b.h > this.ufo.y) {
                b.active = false;
                this.score += 150;
                this.shake = 10;
                this.spawnParticles(this.ufo.x + this.ufo.w/2, this.ufo.y + this.ufo.h/2, CONSTANTS.COLOR_FG);
                this.ufo = null;
                audio.play('POWERUP');
                continue;
            }
            for(const a of this.aliens) {
                if(!a.active) continue;
                if(b.x < a.x + a.w && b.x + b.w > a.x && b.y < a.y + a.h && b.y + b.h > a.y) {
                    b.active = false;
                    this.score += 20;
                    this.shake = 5;
                    this.spawnParticles(a.x + a.w/2, a.y + a.h/2, CONSTANTS.COLOR_HARD);
                    if (a.boss) {
                        a.hp--;
                        audio.play('HIT');
                        if (a.hp <= 0) {
                            a.active = false;
                            this.score += 200;
                            this.shake = 20;
                            audio.playNoise(0.4, 0.25);
                        }
                    } else {
                        a.active = false;
                        audio.playNoise(0.1);
                    }
                    break;
                }
            }
        }
        
        const damageBunker = (bullet, bunker) => { if(!bullet.active) return false; if(bullet.x < bunker.x + bunker.w && bullet.x + bullet.w > bunker.x && bullet.y < bunker.y + bunker.h && bullet.y + bullet.h > bunker.y) { bullet.active = false; bunker.hp--; this.spawnParticles(bullet.x, bullet.y, CONSTANTS.COLOR_FG); audio.play('HIT'); return true; } return false; };
        this.bunkers = this.bunkers.filter(bnk => bnk.hp > 0);
        for(let bnk of this.bunkers) { for(let b of this.bullets) if(damageBunker(b, bnk)) break; for(let eb of this.enemyBullets) if(damageBunker(eb, bnk)) break; }

        for(let eb of this.enemyBullets) { if(eb.x < this.player.x + this.player.w && eb.x + eb.w > this.player.x && eb.y < this.player.y + this.player.h && eb.y + eb.h > this.player.y) { eb.active = false; this.lives--; this.shake = 20; app.vibrate(30); this.spawnParticles(this.player.x + this.player.w/2, this.player.y, CONSTANTS.COLOR_FG); audio.playNoise(0.3); if(this.lives <= 0) {
            this.state = 'GAMEOVER'; 
            const isRecord = app.saveHighScore('INVADERS', this.score);
            app.showGameMessage(isRecord ? "NEW RECORD" : "SYSTEM FAILURE", "SCORE: " + this.score); 
            audio.play('GAMEOVER');
        } } }
    }

    spawnParticles(x, y, c) { for(let i=0; i<8; i++) this.particles.push(new Particle(x, y, c)); }

    draw() {
        this.ctx.fillStyle = CONSTANTS.COLOR_BG; this.ctx.fillRect(0,0, this.canvas.width, this.canvas.height);
        this.ctx.save();
        if(this.shake > 0 && !REDUCED_MOTION) this.ctx.translate((Math.random()-0.5)*this.shake, (Math.random()-0.5)*this.shake);

        // Score
        this.ctx.font = "bold 30vh 'Courier New'"; this.ctx.textAlign = 'center'; this.ctx.textBaseline = 'middle'; this.ctx.fillStyle = '#111';
        this.ctx.fillText(this.score, this.canvas.width/2, this.canvas.height/2);

        // HUD
        this.ctx.font = "bold 24px 'Courier New'"; this.ctx.textAlign = 'left'; this.ctx.fillStyle = CONSTANTS.COLOR_FG;
        let livesStr = app.t('lives') + ": "; for(let i=0; i<this.lives; i++) livesStr += "♥ "; this.ctx.fillText(livesStr + " " + app.t('wave') + ": " + this.wave + "/" + this.maxWaves, 20, 84);
        // HI SCORE
        this.ctx.textAlign = 'right';
        this.ctx.fillText(app.t('hi') + ": " + app.getHighScore('INVADERS'), this.canvas.width - 20, 84);

        // Player
        this.ctx.fillStyle = CONSTANTS.COLOR_FG;
        this.ctx.fillRect(this.player.x, this.player.y, this.player.w, this.player.h);
        // Little cannon on top
        this.ctx.fillRect(this.player.x + this.player.w/2 - 4, this.player.y - 6, 8, 6);

        if (this.ufo) {
            this.ctx.fillStyle = CONSTANTS.COLOR_FG;
            this.ctx.fillRect(this.ufo.x, this.ufo.y + 6, this.ufo.w, 8);
            this.ctx.fillRect(this.ufo.x + 8, this.ufo.y, this.ufo.w - 16, 6);
            this.ctx.fillStyle = CONSTANTS.COLOR_HARD;
            this.ctx.fillRect(this.ufo.x + 14, this.ufo.y + 8, 6, 4);
            this.ctx.fillRect(this.ufo.x + 30, this.ufo.y + 8, 6, 4);
        }

        // Aliens
        for(let a of this.aliens) {
            if(!a.active) continue;
            if (a.boss) {
                this.ctx.fillStyle = CONSTANTS.COLOR_HARD;
                this.ctx.fillRect(a.x, a.y, a.w, a.h);
                this.ctx.fillStyle = '#111';
                this.ctx.fillRect(a.x + 10, a.y + 10, a.w - 20, 8);
                this.ctx.fillStyle = CONSTANTS.COLOR_FG;
                this.ctx.fillRect(a.x + 10, a.y + 10, (a.w - 20) * (a.hp / a.maxHp), 8);
                this.ctx.fillStyle = '#111';
                this.ctx.fillRect(a.x + 20, a.y + 28, 10, 8);
                this.ctx.fillRect(a.x + a.w - 30, a.y + 28, 10, 8);
            } else {
                this.ctx.fillStyle = CONSTANTS.COLOR_HARD;
                this.ctx.fillRect(a.x, a.y, a.w, a.h);
            }
        }

        // Bunkers
        for(let bnk of this.bunkers) {
            // Opacity based on HP
            this.ctx.fillStyle = `rgba(204, 255, 0, ${bnk.hp / 10})`;
            this.ctx.fillRect(bnk.x, bnk.y, bnk.w, bnk.h);
        }

        // Bullets
        this.ctx.fillStyle = CONSTANTS.COLOR_FG;
        for(let b of this.bullets) this.ctx.fillRect(b.x, b.y, b.w, b.h);
        
        this.ctx.fillStyle = CONSTANTS.COLOR_HARD; // Enemy bullets white
        for(let eb of this.enemyBullets) this.ctx.fillRect(eb.x, eb.y, eb.w, eb.h);

        // Particles
        this.particles.forEach(p => p.draw(this.ctx));

        // Scanlines
        this.ctx.restore();
    }
}

// ==========================================
// ENGINE 5: TETRIS
// ==========================================
class TetrisEngine {
    constructor(canvas, ctx) {
        this.canvas = canvas;
        this.ctx = ctx;
        this.rows = 20;
        this.cols = 10;
        this.gridSize = 30; // Taille de base, sera ajustée
        this.reset();
    }

    reset() {
        this.grid = Array(this.rows).fill().map(() => Array(this.cols).fill(0));
        this.score = 0;
        this.level = 1;
        this.lines = 0;
        this.shake = 0;
        this.particles = [];
        this.state = 'WAITING';
        this.dropCounter = 0;
        this.dropInterval = 40; // Vitesse de chute (frames)
        
        // Formes
        this.pieces = 'ILJOTSZ';
        this.colors = [null, CONSTANTS.COLOR_FG, CONSTANTS.COLOR_HARD, CONSTANTS.COLOR_FG, CONSTANTS.COLOR_HARD, CONSTANTS.COLOR_FG, CONSTANTS.COLOR_HARD, CONSTANTS.COLOR_FG];
        
        this.bag = [];
        this.nextType = null;
        this.heldType = null;
        this.canHold = true;
        this.player = { pos: {x: 0, y: 0}, matrix: null, score: 0 };
        this.resetPiece();
        this.calculateScale(); // Ajuster à l'écran
        
        app.showGameMessage("TETRIS", "ARROWS: MOVE // SPACE: DROP // C: HOLD");
    }

    calculateScale() {
        const topSafe = 104;
        const bottomSafe = app.touchVisible ? 170 : 0;
        this.gridSize = Math.floor(Math.min(this.canvas.width / (this.cols + 4), (this.canvas.height - topSafe - bottomSafe) / this.rows));
        this.offsetX = Math.floor((this.canvas.width - this.cols * this.gridSize) / 2);
        this.offsetY = Math.max(topSafe, Math.floor((this.canvas.height - bottomSafe - this.rows * this.gridSize) / 2));
    }

    createPiece(type) {
        if (type === 'I') return [[0, 1, 0, 0],[0, 1, 0, 0],[0, 1, 0, 0],[0, 1, 0, 0]];
        if (type === 'L') return [[0, 2, 0],[0, 2, 0],[0, 2, 2]];
        if (type === 'J') return [[0, 3, 0],[0, 3, 0],[3, 3, 0]];
        if (type === 'O') return [[4, 4],[4, 4]];
        if (type === 'Z') return [[5, 5, 0],[0, 5, 5],[0, 0, 0]];
        if (type === 'S') return [[0, 6, 6],[6, 6, 0],[0, 0, 0]];
        if (type === 'T') return [[0, 7, 0],[7, 7, 7],[0, 0, 0]];
    }

    nextFromBag() {
        if (!this.bag.length) {
            this.bag = this.pieces.split('');
            for (let i = this.bag.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [this.bag[i], this.bag[j]] = [this.bag[j], this.bag[i]];
            }
        }
        return this.bag.pop();
    }

    resetPiece() {
        const type = this.nextType || this.nextFromBag();
        this.nextType = this.nextFromBag();
        this.currentType = type;
        this.player.matrix = this.createPiece(type);
        this.player.pos.y = 0;
        this.player.pos.x = (this.grid[0].length / 2 | 0) - (this.player.matrix[0].length / 2 | 0);
        this.canHold = true;
        
        if (this.collide(this.grid, this.player)) {
            this.state = 'GAMEOVER';
            app.vibrate(40);
            const isRecord = app.saveHighScore('TETRIS', this.score);
            app.showGameMessage(isRecord ? "NEW RECORD" : "GRID LOCKED", "SCORE: " + this.score);
            audio.play('GAMEOVER');
        }
    }

    holdPiece() {
        if (!this.canHold || this.state !== 'PLAYING') return;
        const current = this.currentType;
        if (this.heldType) {
            const held = this.heldType;
            this.heldType = current;
            this.currentType = held;
            this.player.matrix = this.createPiece(held);
            this.player.pos.y = 0;
            this.player.pos.x = (this.grid[0].length / 2 | 0) - (this.player.matrix[0].length / 2 | 0);
        } else {
            this.heldType = current;
            this.resetPiece();
        }
        this.canHold = false;
        audio.play('UI_CLICK');
    }

    collide(arena, player) {
        const m = player.matrix;
        const o = player.pos;
        for (let y = 0; y < m.length; ++y) {
            for (let x = 0; x < m[y].length; ++x) {
                if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
                    return true;
                }
            }
        }
        return false;
    }

    merge(arena, player) {
        player.matrix.forEach((row, y) => {
            row.forEach((value, x) => {
                if (value !== 0) {
                    arena[y + player.pos.y][x + player.pos.x] = value;
                }
            });
        });
    }

    rotate(matrix, dir) {
        for (let y = 0; y < matrix.length; ++y) {
            for (let x = 0; x < y; ++x) {
                [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
            }
        }
        if (dir > 0) matrix.forEach(row => row.reverse());
        else matrix.reverse();
    }

    playerRotate(dir) {
        const pos = this.player.pos.x;
        let offset = 1;
        this.rotate(this.player.matrix, dir);
        while (this.collide(this.grid, this.player)) {
            this.player.pos.x += offset;
            offset = -(offset + (offset > 0 ? 1 : -1));
            if (offset > this.player.matrix[0].length) {
                this.rotate(this.player.matrix, -dir);
                this.player.pos.x = pos;
                return;
            }
        }
        audio.play('UI_CLICK'); // Rotate sound
    }

    playerDrop() {
        this.player.pos.y++;
        if (this.collide(this.grid, this.player)) {
            this.player.pos.y--;
            this.merge(this.grid, this.player);
            this.arenaSweep();
            this.resetPiece();
            this.shake = 5;
            audio.play('HIT');
        }
        this.dropCounter = 0;
    }

    playerHardDrop() {
        while (!this.collide(this.grid, this.player)) {
            this.player.pos.y++;
        }
        this.player.pos.y--;
        this.merge(this.grid, this.player);
        this.arenaSweep();
        this.resetPiece();
        this.shake = 10;
        this.dropCounter = 0;
        audio.play('HIT');
    }

    playerMove(dir) {
        this.player.pos.x += dir;
        if (this.collide(this.grid, this.player)) {
            this.player.pos.x -= dir;
        }
    }

    arenaSweep() {
        outer: for (let y = this.grid.length - 1; y > 0; --y) {
            for (let x = 0; x < this.grid[y].length; ++x) {
                if (this.grid[y][x] === 0) {
                    continue outer;
                }
            }
            const row = this.grid.splice(y, 1)[0].fill(0);
            this.grid.unshift(row);
            ++y;
            this.score += 100;
            this.lines++;
            if (this.lines % 10 === 0) {
                this.level++;
                this.dropInterval = Math.max(10, 40 - (this.level - 1) * 4);
                if (this.level >= 2) app.unlock('TETRIS_LVL2');
                app.toast(app.t('level') + ' ' + this.level);
                app.vibrate(15);
                audio.play('POWERUP');
            } else {
                audio.play('SCORE');
            }
            this.shake = 20;
            // Particles on line clear
            for(let k=0; k<10; k++) {
                this.particles.push(new Particle(this.offsetX + Math.random()*this.cols*this.gridSize, this.offsetY + y*this.gridSize, CONSTANTS.COLOR_FG));
            }
        }
    }

    handleClick() {
        if (this.state === 'GAMEOVER') this.reset();
        else if (this.state === 'WAITING') {
            this.state = 'PLAYING';
            app.hideGameMessage();
        }
    }

    update() {
        this.particles.forEach(p => p.update());
        this.particles = this.particles.filter(p => p.life > 0);
        if (this.shake > 0) this.shake *= 0.9;
        const key = app.input.consumeArrow();
        if (key) {
            if(this.state === 'WAITING') { this.state = 'PLAYING'; app.hideGameMessage(); }
            
            if(this.state === 'PLAYING') {
                if (key === 'ArrowUp') this.playerRotate(1);
                if (key === 'ArrowLeft') this.playerMove(-1);
                if (key === 'ArrowRight') this.playerMove(1);
                if (key === 'ArrowDown') this.playerDrop();
                if (key === ' ') this.playerHardDrop();
            }
        }

        const holdKey = app.input.consumePressed('c') || app.input.consumePressed('C') || app.input.consumePressed('Shift');
        if (holdKey && this.state === 'PLAYING') this.holdPiece();

        if (this.state !== 'PLAYING') return;

        this.dropCounter++;
        if (this.dropCounter > this.dropInterval) {
            this.playerDrop();
        }
    }

    draw() {
        this.calculateScale(); // Recalc if resize
        this.ctx.fillStyle = CONSTANTS.COLOR_BG;
        this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
        
        this.ctx.save();
        if(this.shake > 0 && !REDUCED_MOTION) this.ctx.translate((Math.random()-0.5)*this.shake, (Math.random()-0.5)*this.shake);

        // Draw Board Background
        this.ctx.fillStyle = '#111';
        this.ctx.fillRect(this.offsetX - 5, this.offsetY - 5, this.cols * this.gridSize + 10, this.rows * this.gridSize + 10);
        this.ctx.strokeStyle = CONSTANTS.COLOR_FG;
        this.ctx.strokeRect(this.offsetX - 5, this.offsetY - 5, this.cols * this.gridSize + 10, this.rows * this.gridSize + 10);

        // Draw Matrix Helper
        const drawMatrix = (matrix, offset) => {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        this.ctx.fillStyle = (value % 2 === 0) ? CONSTANTS.COLOR_FG : CONSTANTS.COLOR_HARD;
                        this.ctx.fillRect(this.offsetX + (x + offset.x) * this.gridSize + 1, 
                                          this.offsetY + (y + offset.y) * this.gridSize + 1, 
                                          this.gridSize - 2, this.gridSize - 2);
                    }
                });
            });
        };

        drawMatrix(this.grid, {x: 0, y: 0});
        const ghost = { pos: { x: this.player.pos.x, y: this.player.pos.y }, matrix: this.player.matrix };
        while (!this.collide(this.grid, ghost)) ghost.pos.y++;
        ghost.pos.y--;
        this.ctx.save();
        this.ctx.globalAlpha = 0.18;
        drawMatrix(ghost.matrix, ghost.pos);
        this.ctx.restore();
        drawMatrix(this.player.matrix, this.player.pos);

        // UI
        this.ctx.font = "bold 24px 'Courier New'";
        this.ctx.fillStyle = CONSTANTS.COLOR_FG;
        this.ctx.textAlign = 'left';
        this.ctx.fillText(app.t('score') + ": " + this.score + "  " + app.t('lvl') + ": " + this.level, 20, 84);
        // HI SCORE
        this.ctx.textAlign = 'right';
        this.ctx.fillText(app.t('hi') + ": " + app.getHighScore('TETRIS'), this.canvas.width - 20, 84);

        const side = Math.max(0, Math.min(this.offsetX, this.canvas.width - (this.offsetX + this.cols * this.gridSize)));
        if (side > 66) {
            const cell = Math.max(8, Math.min(Math.floor(this.gridSize * 0.5), Math.floor((side - 24) / 4)));
            this.drawPreview(this.heldType, this.offsetX - 16 - 4 * cell, this.offsetY, app.t('hold'), cell);
            this.drawPreview(this.nextType, this.offsetX + this.cols * this.gridSize + 16, this.offsetY, app.t('next'), cell);
        }

        this.particles.forEach(p => p.draw(this.ctx));
        this.ctx.restore();
    }

    drawPreview(type, x, y, label, cell) {
        this.ctx.save();
        this.ctx.font = "bold 12px 'Courier New'";
        this.ctx.textAlign = 'left';
        this.ctx.textBaseline = 'alphabetic';
        this.ctx.fillStyle = CONSTANTS.COLOR_FG;
        this.ctx.fillText(label, x, y + 12);
        if (!type) { this.ctx.restore(); return; }
        const matrix = this.createPiece(type);
        let minX = 99, maxX = -1, minY = 99, maxY = -1;
        matrix.forEach((row, ry) => row.forEach((v, rx) => {
            if (v) {
                minX = Math.min(minX, rx); maxX = Math.max(maxX, rx);
                minY = Math.min(minY, ry); maxY = Math.max(maxY, ry);
            }
        }));
        const gw = (maxX - minX + 1) * cell;
        const gh = (maxY - minY + 1) * cell;
        const ox = x + (4 * cell - gw) / 2;
        const oy = y + 20 + (4 * cell - gh) / 2;
        matrix.forEach((row, ry) => row.forEach((v, rx) => {
            if (!v) return;
            this.ctx.fillStyle = (v % 2 === 0) ? CONSTANTS.COLOR_FG : CONSTANTS.COLOR_HARD;
            this.ctx.fillRect(ox + (rx - minX) * cell + 1, oy + (ry - minY) * cell + 1, cell - 2, cell - 2);
        }));
        this.ctx.restore();
    }
}

// ==========================================
// ENGINE 6: ASTEROIDS
// ==========================================
class AsteroidsEngine {
    constructor(canvas, ctx) {
        this.canvas = canvas;
        this.ctx = ctx;
        this.reset();
    }

    reset() {
        this.score = 0;
        this.wave = 1;
        this.waveFlash = 0;
        this.state = 'WAITING';
        this.ship = { x: this.canvas.width/2, y: this.canvas.height/2, a: -Math.PI/2, xv: 0, yv: 0, r: 10 };
        this.asteroids = [];
        this.bullets = [];
        this.particles = [];
        this.pickups = [];
        this.ufo = null;
        this.ufoTimer = 600 + Math.random() * 600;
        this.shieldTimer = 0;
        this.shake = 0;
        
        // Spawn Asteroids
        this.spawnWave(5);
        
        app.showGameMessage("ASTEROIDS", "ARROWS: DRIVE // SPACE: FIRE");
    }

    spawnWave(count) {
        for (let i = 0; i < count; i++) {
            let x, y, tries = 0;
            do {
                x = Math.random() * this.canvas.width;
                y = Math.random() * this.canvas.height;
                tries++;
            } while (tries < 20 && Math.hypot(x - this.ship.x, y - this.ship.y) < 180);
            this.spawnAsteroid(x, y, 40);
        }
    }

    nextWave() {
        this.wave++;
        if (this.wave >= 5) app.unlock('ASTEROIDS_WAVE5');
        this.spawnWave(Math.min(14, 4 + this.wave));
        this.waveFlash = 90;
        this.shake = 10;
        audio.play('POWERUP');
    }

    spawnAsteroid(x, y, r) {
        let vert = [];
        let sides = 6 + Math.floor(Math.random()*4);
        for(let i=0; i<sides; i++) {
            let a = i / sides * Math.PI * 2;
            let d = r * (0.8 + Math.random()*0.4);
            vert.push({x: Math.cos(a)*d, y: Math.sin(a)*d});
        }
        this.asteroids.push({
            x: x, y: y, r: r, 
            xv: (Math.random()-0.5)*3, yv: (Math.random()-0.5)*3,
            vert: vert
        });
    }

    handleClick() {
        if(this.state === 'WAITING') { this.state = 'PLAYING'; app.hideGameMessage(); }
        else if (this.state === 'GAMEOVER') this.reset();
    }

    onResize(oldW, oldH, newW, newH) {
        const sx = newW / oldW, sy = newH / oldH;
        this.ship.x *= sx;
        this.ship.y *= sy;
        this.asteroids.forEach(a => { a.x *= sx; a.y *= sy; });
        this.bullets.forEach(b => { b.x *= sx; b.y *= sy; });
        this.particles.forEach(p => { p.x *= sx; p.y *= sy; });
        this.pickups.forEach(p => { p.x *= sx; p.y *= sy; });
        if (this.ufo) { this.ufo.x *= sx; this.ufo.y *= sy; }
    }

    update() {
        this.particles.forEach(p => p.update());
        this.particles = this.particles.filter(p => p.life > 0);
        if (this.shake > 0) this.shake *= 0.9;
        if (this.waveFlash > 0) this.waveFlash--;
        const keys = app.input.keys;
        if(this.state === 'WAITING' && (keys['ArrowUp'] || keys[' '] || app.input.consumeAny(['ArrowUp',' ']))) { this.state = 'PLAYING'; app.hideGameMessage(); }
        if(this.state !== 'PLAYING') return;

        this.shieldTimer = Math.max(0, this.shieldTimer - 1);
        this.ufoTimer--;
        if (!this.ufo && this.ufoTimer <= 0) {
            this.ufo = { x: -60, y: 110, w: 44, h: 18, vx: 2 + Math.random() * 1.5 };
            this.ufoTimer = 900 + Math.random() * 900;
        }
        if (this.ufo) {
            this.ufo.x += this.ufo.vx;
            if (this.ufo.x > this.canvas.width + 60) this.ufo = null;
        }
        for (let i = this.pickups.length - 1; i >= 0; i--) {
            const pickup = this.pickups[i];
            pickup.life--;
            if (pickup.life <= 0) { this.pickups.splice(i, 1); continue; }
            if (Math.hypot(this.ship.x - pickup.x, this.ship.y - pickup.y) < this.ship.r + pickup.r) {
                this.pickups.splice(i, 1);
                this.shieldTimer = 480;
                this.spawnParticles(pickup.x, pickup.y, CONSTANTS.COLOR_FG);
                app.vibrate(10);
                audio.play('POWERUP');
            }
        }

        // Ship Control
        if(keys['ArrowLeft']) this.ship.a -= 0.1;
        if(keys['ArrowRight']) this.ship.a += 0.1;
        if(keys['ArrowUp']) {
            this.ship.xv += Math.cos(this.ship.a) * 0.1;
            this.ship.yv += Math.sin(this.ship.a) * 0.1;
            // Particles thrust
            this.particles.push(new Particle(this.ship.x - Math.cos(this.ship.a)*10, this.ship.y - Math.sin(this.ship.a)*10, CONSTANTS.COLOR_FG));
        }
        
        // Shoot
        const fireTap = app.input.consumePressed(' ');
        if((keys[' '] || fireTap) && !this.lastShot) {
            this.bullets.push({x: this.ship.x + Math.cos(this.ship.a)*15, y: this.ship.y + Math.sin(this.ship.a)*15, xv: Math.cos(this.ship.a)*7, yv: Math.sin(this.ship.a)*7, life: 60});
            this.lastShot = true;
            audio.play('SHOOT');
        }
        if(!keys[' ']) this.lastShot = false;

        // Physics Ship
        this.ship.x += this.ship.xv; this.ship.y += this.ship.yv;
        // Friction? Nah, space is frictionless. Maybe clamp speed?
        this.ship.xv *= 0.99; this.ship.yv *= 0.99;

        // Wrap Ship
        if(this.ship.x < 0) this.ship.x = this.canvas.width; if(this.ship.x > this.canvas.width) this.ship.x = 0;
        if(this.ship.y < 0) this.ship.y = this.canvas.height; if(this.ship.y > this.canvas.height) this.ship.y = 0;

        // Update Bullets
        for(let i=this.bullets.length-1; i>=0; i--) {
            let b = this.bullets[i];
            b.x += b.xv; b.y += b.yv; b.life--;
            if(b.x < 0) b.x = this.canvas.width; if(b.x > this.canvas.width) b.x = 0;
            if(b.y < 0) b.y = this.canvas.height; if(b.y > this.canvas.height) b.y = 0;
            if(b.life <= 0) this.bullets.splice(i, 1);
        }

        for (let j = this.bullets.length - 1; j >= 0; j--) {
            const b = this.bullets[j];
            if (this.ufo && b.x > this.ufo.x && b.x < this.ufo.x + this.ufo.w && b.y > this.ufo.y && b.y < this.ufo.y + this.ufo.h) {
                this.bullets.splice(j, 1);
                this.score += 200;
                this.shake = 10;
                this.spawnParticles(this.ufo.x + this.ufo.w / 2, this.ufo.y + this.ufo.h / 2, CONSTANTS.COLOR_FG, 1.5);
                this.ufo = null;
                audio.play('POWERUP');
            }
        }

        // Update Asteroids
        for(let i=this.asteroids.length-1; i>=0; i--) {
            let a = this.asteroids[i];
            a.x += a.xv; a.y += a.yv;
            if(a.x < -a.r) a.x = this.canvas.width+a.r; if(a.x > this.canvas.width+a.r) a.x = -a.r;
            if(a.y < -a.r) a.y = this.canvas.height+a.r; if(a.y > this.canvas.height+a.r) a.y = -a.r;

            // Collision Ship
            let d = Math.sqrt((this.ship.x - a.x)**2 + (this.ship.y - a.y)**2);
            if(d < a.r + this.ship.r) {
                if (this.shieldTimer > 0) {
                    this.shieldTimer = 0;
                    this.asteroids.splice(i, 1);
                    this.score += 50;
                    this.shake = 20;
                    this.spawnParticles(a.x, a.y, CONSTANTS.COLOR_HARD, 1.5);
                    audio.play('POWERUP');
                    continue;
                }
                this.state = 'GAMEOVER';
                this.shake = 30;
                app.vibrate(50);
                this.spawnParticles(this.ship.x, this.ship.y, CONSTANTS.COLOR_FG, 3);
                const isRecord = app.saveHighScore('ASTEROIDS', this.score);
                app.showGameMessage(isRecord ? "NEW RECORD" : "HULL BREACH", "SCORE: " + this.score);
                audio.playNoise(0.4, 0.25);
            }

            // Collision Bullet
            for(let j=this.bullets.length-1; j>=0; j--) {
                let b = this.bullets[j];
                let db = Math.sqrt((b.x - a.x)**2 + (b.y - a.y)**2);
                if(db < a.r) {
                    // Hit
                    this.bullets.splice(j, 1);
                    this.asteroids.splice(i, 1);
                    this.score += 100;
                    this.shake = 10;
                    this.spawnParticles(a.x, a.y, CONSTANTS.COLOR_HARD);
                    audio.play('HIT');
                    if (Math.random() < 0.08) this.pickups.push({ x: a.x, y: a.y, r: 12, life: 600 });
                    
                    // Split
                    if(a.r > 20) {
                        this.spawnAsteroid(a.x, a.y, a.r/2);
                        this.spawnAsteroid(a.x, a.y, a.r/2);
                    }
                    break;
                }
            }
        }

        if(this.state === 'PLAYING' && this.asteroids.length === 0) this.nextWave();
    }

    spawnParticles(x, y, c, scale=1) { for(let i=0; i<10; i++) this.particles.push(new Particle(x, y, c, scale)); }

    draw() {
        this.ctx.fillStyle = CONSTANTS.COLOR_BG;
        this.ctx.fillRect(0,0, this.canvas.width, this.canvas.height);
        this.ctx.save();
        if(this.shake > 0 && !REDUCED_MOTION) this.ctx.translate((Math.random()-0.5)*this.shake, (Math.random()-0.5)*this.shake);

        // Ship
        if(this.state !== 'GAMEOVER') {
            this.ctx.save();
            this.ctx.translate(this.ship.x, this.ship.y);
            this.ctx.rotate(this.ship.a);
            this.ctx.strokeStyle = CONSTANTS.COLOR_FG;
            this.ctx.lineWidth = 2;
            this.ctx.beginPath();
            this.ctx.moveTo(15, 0);
            this.ctx.lineTo(-10, 10);
            this.ctx.lineTo(-5, 0);
            this.ctx.lineTo(-10, -10);
            this.ctx.closePath();
            this.ctx.stroke();
            this.ctx.restore();
            if (this.shieldTimer > 0) {
                this.ctx.save();
                this.ctx.globalAlpha = 0.5 + 0.35 * Math.sin(performance.now() / 100);
                this.ctx.strokeStyle = CONSTANTS.COLOR_FG;
                this.ctx.lineWidth = 3;
                this.ctx.beginPath();
                this.ctx.arc(this.ship.x, this.ship.y, 22, 0, Math.PI * 2);
                this.ctx.stroke();
                this.ctx.restore();
            }
        }

        for (const pickup of this.pickups) {
            this.ctx.save();
            this.ctx.strokeStyle = CONSTANTS.COLOR_FG;
            this.ctx.lineWidth = 2;
            this.ctx.globalAlpha = 0.6 + 0.4 * Math.sin(performance.now() / 120);
            this.ctx.beginPath();
            this.ctx.arc(pickup.x, pickup.y, pickup.r, 0, Math.PI * 2);
            this.ctx.stroke();
            this.ctx.restore();
        }

        if (this.ufo) {
            this.ctx.fillStyle = CONSTANTS.COLOR_FG;
            this.ctx.fillRect(this.ufo.x, this.ufo.y + 5, this.ufo.w, 7);
            this.ctx.fillRect(this.ufo.x + 8, this.ufo.y, this.ufo.w - 16, 5);
            this.ctx.fillStyle = CONSTANTS.COLOR_HARD;
            this.ctx.fillRect(this.ufo.x + 12, this.ufo.y + 7, 5, 4);
            this.ctx.fillRect(this.ufo.x + 27, this.ufo.y + 7, 5, 4);
        }

        // Asteroids
        this.ctx.strokeStyle = CONSTANTS.COLOR_HARD;
        this.ctx.lineWidth = 2;
        for(let a of this.asteroids) {
            this.ctx.save();
            this.ctx.translate(a.x, a.y);
            this.ctx.beginPath();
            this.ctx.moveTo(a.vert[0].x, a.vert[0].y);
            for(let i=1; i<a.vert.length; i++) this.ctx.lineTo(a.vert[i].x, a.vert[i].y);
            this.ctx.closePath();
            this.ctx.stroke();
            this.ctx.restore();
        }

        // Bullets
        this.ctx.fillStyle = CONSTANTS.COLOR_FG;
        for(let b of this.bullets) this.ctx.fillRect(b.x-2, b.y-2, 4, 4);

        if(this.waveFlash > 0) {
            this.ctx.save();
            this.ctx.globalAlpha = Math.min(1, this.waveFlash / 30);
            this.ctx.font = "bold 48px 'Courier New'";
            this.ctx.textAlign = 'center';
            this.ctx.textBaseline = 'middle';
            this.ctx.fillStyle = CONSTANTS.COLOR_FG;
            this.ctx.fillText(app.t('wave') + ' ' + this.wave, this.canvas.width/2, this.canvas.height/2 + 150);
            this.ctx.restore();
        }

        this.particles.forEach(p => p.draw(this.ctx));
        this.ctx.restore();

        this.ctx.fillStyle = 'rgba(5, 5, 5, 0.8)';
        this.ctx.fillRect(0, 58, this.canvas.width, 40);
        this.ctx.font = "bold 30px 'Courier New'";
        this.ctx.fillStyle = CONSTANTS.COLOR_FG;
        this.ctx.textAlign = 'left';
        this.ctx.fillText(app.t('score') + ": " + this.score + "  " + app.t('wave') + ": " + this.wave, 20, 84);
        this.ctx.textAlign = 'right';
        this.ctx.fillText(app.t('hi') + ": " + app.getHighScore('ASTEROIDS'), this.canvas.width - 20, 84);

        if (this.shieldTimer > 0) {
            this.ctx.textAlign = 'center';
            this.ctx.font = "bold 16px 'Courier New'";
            this.ctx.fillStyle = CONSTANTS.COLOR_FG;
            this.ctx.fillText(app.t('shield') + ' ' + Math.ceil(this.shieldTimer / 60) + 's', this.canvas.width / 2, this.canvas.height - 24);
        }
    }
}

// ==========================================
// ENGINE 7: NEON MAZE
// ==========================================
class NeonMazeEngine {
    constructor(canvas, ctx) {
        this.canvas = canvas;
        this.ctx = ctx;
        this.cols = 15;
        this.rows = 13;
        this.reset();
    }

    reset() {
        this.score = 0;
        this.lives = 3;
        this.level = 1;
        this.state = 'WAITING';
        this.particles = [];
        this.shake = 0;
        this.frightened = 0;
        this.clearTimer = 0;
        this.readyTimer = 0;
        this.buildLevel();
        app.showGameMessage("NEON MAZE", "ARROWS / D-PAD");
    }

    key(x, y) { return x + ',' + y; }

    buildLevel() {
        this.grid = [];
        for (let y = 0; y < this.rows; y++) {
            const row = [];
            for (let x = 0; x < this.cols; x++) {
                let wall = x === 0 || y === 0 || x === this.cols - 1 || y === this.rows - 1 || (x % 2 === 0 && y % 2 === 0);
                if (wall && x > 2 && x < this.cols - 3 && y > 2 && y < this.rows - 3 && (x + y) % 5 === 0) wall = false;
                row.push(wall ? 1 : 0);
            }
            this.grid.push(row);
        }
        this.dots = new Map();
        const starts = new Set([this.key(7, this.rows - 2), this.key(7, 5), this.key(5, 5), this.key(9, 5)]);
        for (let y = 1; y < this.rows - 1; y++) {
            for (let x = 1; x < this.cols - 1; x++) {
                if (this.grid[y][x]) continue;
                if (starts.has(this.key(x, y))) continue;
                this.dots.set(this.key(x, y), 'dot');
            }
        }
        for (const [x, y] of [[1, 1], [this.cols - 2, 1], [1, this.rows - 2], [this.cols - 2, this.rows - 2]]) {
            if (!this.grid[y][x]) this.dots.set(this.key(x, y), 'pellet');
        }
        this.dotCount = this.dots.size;
        this.player = this.makeEntity(7, this.rows - 2, { x: 1, y: 0 });
        this.ghosts = [
            this.makeGhost(7, 5, { x: 1, y: 0 }),
            this.makeGhost(5, 5, { x: -1, y: 0 }),
            this.makeGhost(9, 5, { x: 0, y: -1 })
        ];
        this.frightened = 0;
    }

    makeEntity(cx, cy, dir) {
        return { cx, cy, dir: { ...dir }, nextDir: { ...dir }, progress: 0 };
    }

    makeGhost(cx, cy, dir) {
        return { cx, cy, dir: { ...dir }, progress: 0, eaten: 0 };
    }

    canMove(cx, cy, dir) {
        const x = cx + dir.x;
        const y = cy + dir.y;
        return x >= 0 && y >= 0 && x < this.cols && y < this.rows && !this.grid[y][x];
    }

    resetPositions() {
        this.player = this.makeEntity(7, this.rows - 2, { x: 1, y: 0 });
        this.ghosts = [
            this.makeGhost(7, 5, { x: 1, y: 0 }),
            this.makeGhost(5, 5, { x: -1, y: 0 }),
            this.makeGhost(9, 5, { x: 0, y: -1 })
        ];
        this.frightened = 0;
    }

    handleClick() {
        if (this.state === 'WAITING') {
            this.state = 'PLAYING';
            this.readyTimer = 30;
            app.hideGameMessage();
        } else if (this.state === 'GAMEOVER') {
            this.reset();
        }
    }

    update() {
        this.particles.forEach(p => p.update());
        this.particles = this.particles.filter(p => p.life > 0);
        if (this.shake > 0) this.shake *= 0.9;

        if (this.state === 'LEVEL_CLEAR') {
            if (--this.clearTimer <= 0) {
                this.level++;
                this.buildLevel();
                this.state = 'READY';
                this.readyTimer = 45;
                app.hideGameMessage();
            }
            return;
        }
        if (this.state === 'READY') {
            if (--this.readyTimer <= 0) { this.state = 'PLAYING'; app.hideGameMessage(); }
            return;
        }
        if (this.state === 'GAMEOVER') {
            if (app.input.consumePressed(' ') || app.input.consumeArrow()) this.reset();
            return;
        }

        if (this.state === 'WAITING') {
            const key = app.input.consumeArrow();
            if (key) this.applyInput(key);
            if (app.input.consumePressed(' ')) this.handleClick();
            if (key || this.state !== 'WAITING') {
                this.state = 'PLAYING';
                this.readyTimer = 0;
                app.hideGameMessage();
            }
            return;
        }

        const key = app.input.consumeArrow();
        if (key) this.applyInput(key);
        if (this.readyTimer > 0) { this.readyTimer--; return; }
        if (this.frightened > 0) this.frightened--;

        this.movePlayer();
        this.moveGhosts();
        this.checkGhostCollision();
        this.checkLevelClear();
    }

    applyInput(key) {
        if (key === 'ArrowUp') this.player.nextDir = { x: 0, y: -1 };
        if (key === 'ArrowDown') this.player.nextDir = { x: 0, y: 1 };
        if (key === 'ArrowLeft') this.player.nextDir = { x: -1, y: 0 };
        if (key === 'ArrowRight') this.player.nextDir = { x: 1, y: 0 };
    }

    choosePlayerDir(p) {
        if (this.canMove(p.cx, p.cy, p.nextDir)) p.dir = { ...p.nextDir };
        if (!this.canMove(p.cx, p.cy, p.dir)) p.dir = { x: 0, y: 0 };
    }

    movePlayer() {
        const p = this.player;
        if (p.progress < 1e-9) {
            p.progress = 0;
            this.choosePlayerDir(p);
        }
        if (!p.dir.x && !p.dir.y) return;
        p.progress += 1 / 7;
        while (p.progress >= 1) {
            p.progress -= 1;
            p.cx += p.dir.x;
            p.cy += p.dir.y;
            this.eatAt(p.cx, p.cy);
            this.choosePlayerDir(p);
            if (!p.dir.x && !p.dir.y) p.progress = 0;
        }
    }

    moveGhosts() {
        const ghostSpeed = (1 / (9.5 - this.level * 0.4)) * (this.frightened > 0 ? 0.62 : 1);
        for (const g of this.ghosts) {
            if (g.eaten > 0) {
                g.eaten--;
                if (g.eaten === 0) { g.cx = 7; g.cy = 5; g.dir = { x: 1, y: 0 }; g.progress = 0; }
                continue;
            }
            g.progress += ghostSpeed;
            while (g.progress >= 1) {
                g.progress -= 1;
                g.cx += g.dir.x;
                g.cy += g.dir.y;
                this.chooseGhostDir(g);
            }
        }
    }

    chooseGhostDir(g) {
        const dirs = [{ x: 0, y: -1 }, { x: 0, y: 1 }, { x: -1, y: 0 }, { x: 1, y: 0 }];
        let options = dirs.filter(d => this.canMove(g.cx, g.cy, d));
        const forward = options.filter(d => !(d.x === -g.dir.x && d.y === -g.dir.y));
        if (forward.length) options = forward;
        if (!options.length) { g.dir = { x: 0, y: 0 }; return; }
        const target = { x: this.player.cx, y: this.player.cy };
        const dist = (x, y) => Math.hypot(x - target.x, y - target.y);
        options.sort((a, b) => {
            const da = dist(g.cx + a.x, g.cy + a.y);
            const db = dist(g.cx + b.x, g.cy + b.y);
            return this.frightened > 0 ? db - da : da - db;
        });
        g.dir = Math.random() < 0.12 ? options[Math.floor(Math.random() * options.length)] : options[0];
    }

    eatAt(cx, cy) {
        const k = this.key(cx, cy);
        if (!this.dots.has(k)) return;
        const type = this.dots.get(k);
        this.dots.delete(k);
        this.dotCount--;
        if (type === 'pellet') {
            this.score += 50;
            this.frightened = 480;
            audio.play('POWERUP');
            app.vibrate(12);
            spawnCellBurst(this, cx, cy, CONSTANTS.COLOR_FG);
        } else {
            this.score += 10;
        }
    }

    checkGhostCollision() {
        const px = this.player.cx + this.player.dir.x * this.player.progress;
        const py = this.player.cy + this.player.dir.y * this.player.progress;
        for (const g of this.ghosts) {
            if (g.eaten > 0) continue;
            const gx = g.cx + g.dir.x * g.progress;
            const gy = g.cy + g.dir.y * g.progress;
            if (Math.hypot(px - gx, py - gy) < 0.72) {
                if (this.frightened > 0) {
                    g.eaten = 100;
                    g.progress = 0;
                    this.score += 200;
                    spawnCellBurst(this, g.cx, g.cy, CONSTANTS.COLOR_HARD);
                    audio.play('SCORE');
                    app.vibrate(10);
                } else {
                    this.loseLife();
                    return;
                }
            }
        }
    }

    loseLife() {
        if (this.state !== 'PLAYING') return;
        this.lives--;
        this.shake = 25;
        spawnCellBurst(this, this.player.cx, this.player.cy, CONSTANTS.COLOR_FG);
        app.vibrate(40);
        audio.playNoise(0.5);
        if (this.lives <= 0) {
            this.state = 'GAMEOVER';
            const isRecord = app.saveHighScore('MAZE', this.score);
            app.showGameMessage(isRecord ? 'NEW RECORD' : 'SYSTEM FAILURE', app.t('score') + ': ' + this.score + '  //  ' + app.t('retry'));
            audio.play('GAMEOVER');
        } else {
            this.resetPositions();
            this.state = 'READY';
            this.readyTimer = 75;
            app.showGameMessage('READY', 'GO');
        }
    }

    checkLevelClear() {
        if (this.state !== 'PLAYING') return;
        if (this.dotCount > 0) return;
        this.state = 'LEVEL_CLEAR';
        this.clearTimer = 90;
        this.score += 100 * this.level;
        if (this.level >= 3) app.unlock('MAZE_CLEAR');
        app.vibrate(30);
        audio.play('POWERUP');
        app.showGameMessage('LEVEL ' + this.level + ' CLEAR', 'BONUS +' + (100 * this.level));
    }

    draw() {
        const top = 100;
        const bottomSafe = app.touchVisible ? 170 : 0;
        const cell = Math.floor(Math.min((this.canvas.width - 48) / this.cols, (this.canvas.height - top - bottomSafe) / this.rows));
        const offsetX = Math.floor((this.canvas.width - this.cols * cell) / 2);
        const offsetY = Math.max(top, Math.floor((this.canvas.height - bottomSafe - this.rows * cell) / 2));
        this.cell = cell; this.offsetX = offsetX; this.offsetY = offsetY;
        const sx = (cx) => offsetX + (cx + 0.5) * cell;
        const sy = (cy) => offsetY + (cy + 0.5) * cell;

        this.ctx.fillStyle = CONSTANTS.COLOR_BG;
        this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
        this.ctx.save();
        applyShake(this.ctx, this);

        for (let y = 0; y < this.rows; y++) {
            for (let x = 0; x < this.cols; x++) {
                const px = offsetX + x * cell;
                const py = offsetY + y * cell;
                if (this.grid[y][x]) {
                    this.ctx.fillStyle = '#0d1400';
                    this.ctx.fillRect(px, py, cell, cell);
                    this.ctx.strokeStyle = '#1e2a00';
                    this.ctx.lineWidth = 1;
                    this.ctx.strokeRect(px + 0.5, py + 0.5, cell - 1, cell - 1);
                } else {
                    this.ctx.fillStyle = '#050505';
                    this.ctx.fillRect(px, py, cell, cell);
                }
            }
        }

        for (const [k, type] of this.dots) {
            const [x, y] = k.split(',').map(Number);
            const cx = sx(x), cy = sy(y);
            if (type === 'pellet') {
                const pulse = 0.6 + 0.4 * Math.sin(performance.now() / 150 + x);
                this.ctx.globalAlpha = pulse;
                this.ctx.fillStyle = CONSTANTS.COLOR_FG;
                this.ctx.beginPath();
                this.ctx.arc(cx, cy, Math.max(4, cell * 0.22), 0, Math.PI * 2);
                this.ctx.fill();
                this.ctx.globalAlpha = 1;
            } else {
                this.ctx.fillStyle = CONSTANTS.COLOR_HARD;
                const s = Math.max(2, cell * 0.1);
                this.ctx.fillRect(cx - s / 2, cy - s / 2, s, s);
            }
        }

        const px = sx(this.player.cx + this.player.dir.x * this.player.progress);
        const py = sy(this.player.cy + this.player.dir.y * this.player.progress);
        const radius = cell * 0.38;
        let mouth = 0.25;
        if (this.player.dir.x === -1) mouth = Math.PI + 0.25;
        if (this.player.dir.x === 1) mouth = 0.25;
        if (this.player.dir.y === -1) mouth = -Math.PI / 2 + 0.25;
        if (this.player.dir.y === 1) mouth = Math.PI / 2 + 0.25;
        this.ctx.fillStyle = CONSTANTS.COLOR_FG;
        this.ctx.beginPath();
        this.ctx.moveTo(px, py);
        this.ctx.arc(px, py, radius, mouth, mouth + Math.PI * 2 - 0.5);
        this.ctx.closePath();
        this.ctx.fill();

        for (const g of this.ghosts) {
            if (g.eaten > 0) continue;
            const gx = sx(g.cx + g.dir.x * g.progress);
            const gy = sy(g.cy + g.dir.y * g.progress);
            const frightened = this.frightened > 0;
            const flashing = frightened && this.frightened < 120 && Math.floor(this.frightened / 10) % 2 === 0;
            this.ctx.fillStyle = frightened ? (flashing ? CONSTANTS.COLOR_HARD : '#00D9FF') : CONSTANTS.COLOR_HARD;
            this.ctx.beginPath();
            this.ctx.arc(gx, gy - radius * 0.2, radius * 0.9, Math.PI, 0);
            this.ctx.lineTo(gx + radius * 0.9, gy + radius * 0.7);
            for (let i = 0; i < 3; i++) {
                this.ctx.lineTo(gx + radius * 0.9 - (i + 0.5) * radius * 0.6, gy + radius * 0.45);
                this.ctx.lineTo(gx + radius * 0.9 - (i + 1) * radius * 0.6, gy + radius * 0.7);
            }
            this.ctx.closePath();
            this.ctx.fill();
            this.ctx.fillStyle = '#050505';
            this.ctx.fillRect(gx - radius * 0.45, gy - radius * 0.15, radius * 0.25, radius * 0.3);
            this.ctx.fillRect(gx + radius * 0.2, gy - radius * 0.15, radius * 0.25, radius * 0.3);
        }

        const hud = hudFont(this.canvas.width, 24);
        this.ctx.font = "bold " + hud + "px 'Courier New'";
        this.ctx.fillStyle = CONSTANTS.COLOR_FG;
        this.ctx.textAlign = 'left';
        this.ctx.fillText(app.t('score') + ': ' + this.score, 20, 84);
        this.ctx.textAlign = 'center';
        this.ctx.fillText(app.t('lives') + ': ' + '♥'.repeat(Math.max(0, this.lives)), this.canvas.width / 2, 84);
        this.ctx.textAlign = 'right';
        this.ctx.fillText(app.t('lvl') + ': ' + this.level + '  ' + app.t('hi') + ': ' + app.getHighScore('MAZE'), this.canvas.width - 20, 84);

        this.particles.forEach(p => p.draw(this.ctx));
        this.ctx.restore();
    }
}

// ==========================================
// ENGINE 8: TRON
// ==========================================
class TronEngine {
    constructor(canvas, ctx) {
        this.canvas = canvas;
        this.ctx = ctx;
        this.cols = 60;
        this.rows = 32;
        this.reset();
    }

    reset() {
        this.wins1 = 0;
        this.wins2 = 0;
        this.round = 1;
        this.score = 0;
        this.state = 'WAITING';
        this.particles = [];
        this.shake = 0;
        this.roundTimer = 0;
        this.readyTimer = 0;
        this.tickCounter = 0;
        this.buildRound();
        this.state = 'WAITING';
        app.showGameMessage('TRON', 'A/D + LEFT/RIGHT');
    }

    key(x, y) { return x + ',' + y; }
    inBounds(x, y) { return x > 0 && y > 0 && x < this.cols - 1 && y < this.rows - 1; }

    buildRound() {
        this.p1 = { x: 5, y: Math.floor(this.rows / 2), dx: 1, dy: 0, alive: true };
        this.p2 = { x: this.cols - 6, y: Math.floor(this.rows / 2), dx: -1, dy: 0, alive: true };
        this.trail1 = new Set([this.key(this.p1.x, this.p1.y)]);
        this.trail2 = new Set([this.key(this.p2.x, this.p2.y)]);
        this.tickCounter = 0;
        this.readyTimer = 90;
        this.roundTimer = 0;
    }

    startRound() {
        this.buildRound();
        this.state = 'READY';
        app.hideGameMessage();
    }

    handleClick() {
        if (this.state === 'WAITING') {
            this.startRound();
        } else if (this.state === 'GAMEOVER') {
            this.reset();
        }
    }

    turn(p, dir) {
        if (!p.alive) return;
        const dx = p.dx;
        if (dir < 0) { p.dx = p.dy; p.dy = -dx; }
        else { p.dx = -p.dy; p.dy = dx; }
    }

    update() {
        this.particles.forEach(p => p.update());
        this.particles = this.particles.filter(p => p.life > 0);
        if (this.shake > 0) this.shake *= 0.9;

        if (this.state === 'WAITING') {
            if (app.input.consumePressed(' ') || app.input.consumeArrow()) this.startRound();
            return;
        }
        if (this.state === 'GAMEOVER') {
            if (app.input.consumePressed(' ') || app.input.consumeArrow()) this.reset();
            return;
        }
        if (this.state === 'ROUND_OVER') {
            if (--this.roundTimer <= 0) this.nextRound();
            return;
        }
        if (this.state === 'READY') {
            if (app.input.consumePressed(' ') || app.input.consumeArrow()) { /* countdown stays */ }
            if (--this.readyTimer <= 0) this.state = 'PLAYING';
            return;
        }

        if (app.input.consumePressed('a') || app.input.consumePressed('A')) this.turn(this.p1, -1);
        if (app.input.consumePressed('d') || app.input.consumePressed('D')) this.turn(this.p1, 1);
        if (app.input.consumePressed('ArrowLeft')) this.turn(this.p2, -1);
        if (app.input.consumePressed('ArrowRight')) this.turn(this.p2, 1);

        this.tickCounter++;
        if (this.tickCounter % 3 !== 0) return;
        this.step();
    }

    step() {
        const p1 = this.p1;
        const p2 = this.p2;
        const n1 = { x: p1.x + p1.dx, y: p1.y + p1.dy };
        const n2 = { x: p2.x + p2.dx, y: p2.y + p2.dy };
        const k1 = this.key(n1.x, n1.y);
        const k2 = this.key(n2.x, n2.y);
        let dead1 = !this.inBounds(n1.x, n1.y) || this.trail1.has(k1) || this.trail2.has(k1);
        let dead2 = !this.inBounds(n2.x, n2.y) || this.trail2.has(k2) || this.trail1.has(k2);
        if (n1.x === n2.x && n1.y === n2.y) { dead1 = true; dead2 = true; }
        if (!dead1) {
            p1.x = n1.x; p1.y = n1.y;
            this.trail1.add(k1);
        } else {
            p1.alive = false;
            spawnCellBurst(this, p1.x, p1.y, CONSTANTS.COLOR_FG, 16);
        }
        if (!dead2) {
            p2.x = n2.x; p2.y = n2.y;
            this.trail2.add(k2);
        } else {
            p2.alive = false;
            spawnCellBurst(this, p2.x, p2.y, CONSTANTS.COLOR_HARD, 16);
        }
        if (dead1 || dead2) this.endRound();
    }

    endRound() {
        if (this.state !== 'PLAYING') return;
        this.state = 'ROUND_OVER';
        this.roundTimer = 100;
        this.shake = 22;
        audio.playNoise(0.55);
        app.vibrate(50);
        if (!this.p1.alive && !this.p2.alive) {
            app.showGameMessage('DRAW', app.t('round') + ' ' + this.round);
        } else if (this.p1.alive) {
            this.wins1++;
            app.showGameMessage('PLAYER 1 WINS', app.t('round') + ' ' + this.round);
            audio.play('SCORE');
        } else {
            this.wins2++;
            app.showGameMessage('PLAYER 2 WINS', app.t('round') + ' ' + this.round);
            audio.play('SCORE');
        }
        this.score = this.wins1;
    }

    nextRound() {
        if (this.state !== 'ROUND_OVER') return;
        app.hideGameMessage();
        if (this.wins1 >= 3 || this.wins2 >= 3) {
            this.state = 'GAMEOVER';
            if (this.wins1 >= 3) app.unlock('TRON_WIN');
            const isRecord = app.saveHighScore('TRON', this.wins1);
            const title = this.wins1 >= 3 ? 'PLAYER 1 WINS' : 'PLAYER 2 WINS';
            app.showGameMessage(title, (isRecord ? app.t('newRecord') + '  ' : '') + this.wins1 + ' - ' + this.wins2 + '  //  ' + app.t('retry'));
            audio.play(this.wins1 >= 3 ? 'POWERUP' : 'GAMEOVER');
            return;
        }
        this.round++;
        this.startRound();
    }

    draw() {
        const top = 100;
        const bottomSafe = 16;
        const cell = Math.floor(Math.min((this.canvas.width - 40) / this.cols, (this.canvas.height - top - bottomSafe) / this.rows));
        const offsetX = Math.floor((this.canvas.width - this.cols * cell) / 2);
        const offsetY = Math.max(top, Math.floor((this.canvas.height - bottomSafe - this.rows * cell) / 2));
        this.cell = cell; this.offsetX = offsetX; this.offsetY = offsetY;

        const ctx = this.ctx;
        ctx.fillStyle = CONSTANTS.COLOR_BG;
        ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
        ctx.save();
        applyShake(ctx, this);

        ctx.strokeStyle = 'rgba(204,255,0,0.07)';
        ctx.lineWidth = 1;
        for (let x = 0; x <= this.cols; x++) {
            ctx.beginPath();
            ctx.moveTo(offsetX + x * cell, offsetY);
            ctx.lineTo(offsetX + x * cell, offsetY + this.rows * cell);
            ctx.stroke();
        }
        for (let y = 0; y <= this.rows; y++) {
            ctx.beginPath();
            ctx.moveTo(offsetX, offsetY + y * cell);
            ctx.lineTo(offsetX + this.cols * cell, offsetY + y * cell);
            ctx.stroke();
        }
        ctx.strokeStyle = CONSTANTS.COLOR_FG;
        ctx.lineWidth = 2;
        ctx.strokeRect(offsetX - 1, offsetY - 1, this.cols * cell + 2, this.rows * cell + 2);

        const drawTrail = (trail, color, alpha) => {
            ctx.globalAlpha = alpha;
            ctx.fillStyle = color;
            for (const k of trail) {
                const [x, y] = k.split(',').map(Number);
                ctx.fillRect(offsetX + x * cell, offsetY + y * cell, cell, cell);
            }
            ctx.globalAlpha = 1;
        };
        drawTrail(this.trail1, CONSTANTS.COLOR_FG, 0.55);
        drawTrail(this.trail2, CONSTANTS.COLOR_HARD, 0.55);

        const drawHead = (p, color) => {
            const x = offsetX + p.x * cell;
            const y = offsetY + p.y * cell;
            ctx.fillStyle = color;
            ctx.fillRect(x + 1, y + 1, cell - 2, cell - 2);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(x + cell * 0.32, y + cell * 0.32, cell * 0.36, cell * 0.36);
        };
        drawHead(this.p1, CONSTANTS.COLOR_FG);
        drawHead(this.p2, CONSTANTS.COLOR_HARD);

        const hud = hudFont(this.canvas.width, 24);
        ctx.font = "bold " + hud + "px 'Courier New'";
        ctx.fillStyle = CONSTANTS.COLOR_FG;
        ctx.textAlign = 'left';
        ctx.fillText('P1 ' + this.wins1, 20, 84);
        ctx.textAlign = 'center';
        ctx.fillStyle = CONSTANTS.COLOR_FG;
        ctx.fillText(app.t('round') + ' ' + this.round, this.canvas.width / 2, 84);
        ctx.textAlign = 'right';
        ctx.fillStyle = CONSTANTS.COLOR_HARD;
        ctx.fillText('P2 ' + this.wins2, this.canvas.width - 20, 84);

        if (this.state === 'READY') {
            const n = Math.max(1, Math.ceil(this.readyTimer / 30));
            ctx.fillStyle = CONSTANTS.COLOR_FG;
            ctx.font = "bold 100px 'Courier New'";
            ctx.textAlign = 'center';
            ctx.fillText(String(n), this.canvas.width / 2, this.canvas.height / 2 + 20);
        }
        this.particles.forEach(p => p.draw(ctx));
        ctx.restore();
    }
}

// ==========================================
// ENGINE 9: LUNAR
// ==========================================
class LunarEngine {
    constructor(canvas, ctx) {
        this.canvas = canvas;
        this.ctx = ctx;
        this.reset();
    }

    reset() {
        this.score = 0;
        this.lives = 3;
        this.level = 1;
        this.landings = 0;
        this.state = 'WAITING';
        this.particles = [];
        this.shake = 0;
        this.landTimer = 0;
        this.crashTimer = 0;
        this.stars = [];
        for (let i = 0; i < 70; i++) {
            this.stars.push({ x: Math.random(), y: Math.random() * 0.7, s: Math.random() * 2 + 0.5, a: Math.random() * 0.5 + 0.2 });
        }
        this.buildTerrain();
        this.resetLander();
        app.showGameMessage('LUNAR', 'ARROWS + THRUST');
    }

    buildTerrain() {
        const w = this.canvas.width;
        const h = this.canvas.height;
        const base = h - (app.touchVisible ? 190 : 80);
        this.pads = [];
        const padW = 90;
        const mults = [2, 3, 5];
        const xs = [Math.floor(w * 0.22), Math.floor(w * 0.52), Math.floor(w * 0.8)];
        for (let i = 0; i < 3; i++) {
            const x = Math.max(padW, Math.min(w - padW, xs[i] + (Math.random() - 0.5) * 60));
            const y = base - 40 - Math.random() * 80;
            this.pads.push({ x, y, w: padW, mult: mults[i] });
        }
        this.pads.sort((a, b) => a.x - b.x);
        this.heights = new Float32Array(w + 1);
        for (let x = 0; x <= w; x++) {
            this.heights[x] = base - 20 - Math.sin(x * 0.031) * 16 - Math.sin(x * 0.013) * 22 - Math.random() * 3;
        }
        for (const pad of this.pads) {
            const left = Math.max(0, Math.floor(pad.x - pad.w / 2));
            const right = Math.min(w, Math.floor(pad.x + pad.w / 2));
            for (let x = left; x <= right; x++) this.heights[x] = pad.y;
        }
    }

    resetLander() {
        this.x = this.canvas.width / 2 + (Math.random() - 0.5) * 140;
        this.y = 170;
        this.vx = (Math.random() - 0.5) * 0.5;
        this.vy = 0.15;
        this.angle = 0;
        this.fuel = 100;
        this.thrusting = false;
        this.alive = true;
    }

    startLevel() {
        this.buildTerrain();
        this.resetLander();
        this.state = 'PLAYING';
        app.hideGameMessage();
    }

    handleClick() {
        if (this.state === 'WAITING') {
            this.startLevel();
        } else if (this.state === 'GAMEOVER') {
            this.reset();
        }
    }

    onResize() {
        if (this.state === 'PLAYING' || this.state === 'WAITING') {
            this.buildTerrain();
            this.resetLander();
        }
    }

    update() {
        this.particles.forEach(p => p.update());
        this.particles = this.particles.filter(p => p.life > 0);
        if (this.shake > 0) this.shake *= 0.9;

        if (this.state === 'LANDED') {
            if (--this.landTimer <= 0) {
                this.level++;
                this.startLevel();
            }
            return;
        }
        if (this.state === 'CRASHED') {
            if (--this.crashTimer <= 0) {
                if (this.lives > 0) {
                    this.resetLander();
                    this.state = 'PLAYING';
                    app.hideGameMessage();
                } else {
                    this.gameOver();
                }
            }
            return;
        }
        if (this.state === 'GAMEOVER') {
            if (app.input.consumePressed(' ') || app.input.consumeArrow()) this.reset();
            return;
        }
        if (this.state === 'WAITING') {
            if (app.input.consumePressed(' ') || app.input.consumeArrow()) this.startLevel();
            return;
        }

        const keys = app.input.keys;
        if (keys['ArrowLeft'] || keys['a'] || keys['A']) this.angle -= 0.045;
        if (keys['ArrowRight'] || keys['d'] || keys['D']) this.angle += 0.045;
        this.thrusting = false;
        if ((keys['ArrowUp'] || keys['w'] || keys['W'] || keys[' ']) && this.fuel > 0) {
            this.thrusting = true;
            this.fuel = Math.max(0, this.fuel - 0.12);
            this.vx += Math.sin(this.angle) * 0.055;
            this.vy -= Math.cos(this.angle) * 0.055;
            if (this.particles.length < 120 && Math.random() < 0.7) {
                const px = this.x - Math.sin(this.angle) * 14;
                const py = this.y + Math.cos(this.angle) * 14;
                this.particles.push(new Particle(px, py, Math.random() < 0.5 ? '#FF9E00' : CONSTANTS.COLOR_HARD, 0.5));
            }
        }
        this.vy += 0.018;
        this.vx *= 0.999;
        this.vy *= 0.999;
        this.x += this.vx;
        this.y += this.vy;

        if (this.x < 16) { this.x = 16; this.vx = Math.abs(this.vx) * 0.4; }
        if (this.x > this.canvas.width - 16) { this.x = this.canvas.width - 16; this.vx = -Math.abs(this.vx) * 0.4; }
        if (this.y < 132) { this.y = 132; if (this.vy < 0) this.vy = 0; }

        const gx = Math.max(0, Math.min(this.heights.length - 1, Math.floor(this.x)));
        const ground = this.heights[gx];
        if (this.y + 14 >= ground) this.touchdown(ground);
    }

    touchdown(ground) {
        if (this.state !== 'PLAYING') return;
        const pad = this.pads.find(p => Math.abs(this.x - p.x) <= p.w / 2);
        const angle = Math.atan2(Math.sin(this.angle), Math.cos(this.angle));
        const safe = pad && Math.abs(this.vy) < 1.7 && Math.abs(this.vx) < 1.0 && Math.abs(angle) < 0.22;
        this.y = ground - 14;
        if (safe) {
            const bonus = Math.round(pad.mult * (60 + Math.floor(this.fuel)) * (1 + (this.level - 1) * 0.15));
            this.score += bonus;
            this.landings++;
            if (this.landings >= 5) app.unlock('LUNAR_LAND');
            this.state = 'LANDED';
            this.landTimer = 100;
            app.vibrate(30);
            audio.play('POWERUP');
            this.spawnExplosion(CONSTANTS.COLOR_FG, 12);
            app.showGameMessage('LANDED', 'x' + pad.mult + '  +' + bonus);
        } else {
            this.lives--;
            this.alive = false;
            this.shake = 30;
            this.state = 'CRASHED';
            this.crashTimer = 70;
            app.vibrate(60);
            audio.playNoise(0.7);
            this.spawnExplosion(CONSTANTS.COLOR_HARD, 24);
            app.showGameMessage(this.fuel <= 0 ? 'OUT OF FUEL' : 'CRASHED', this.lives > 0 ? app.t('lives') + ': ' + this.lives : '');
        }
    }

    spawnExplosion(color, count) {
        for (let i = 0; i < count; i++) this.particles.push(new Particle(this.x, this.y, i % 3 === 0 ? CONSTANTS.COLOR_FG : color));
    }

    gameOver() {
        if (this.state === 'GAMEOVER') return;
        this.state = 'GAMEOVER';
        const isRecord = app.saveHighScore('LUNAR', this.score);
        app.showGameMessage(isRecord ? 'NEW RECORD' : 'MISSION FAILED', app.t('score') + ': ' + this.score + '  //  ' + app.t('retry'));
        audio.play('GAMEOVER');
    }

    draw() {
        const ctx = this.ctx;
        const w = this.canvas.width;
        const h = this.canvas.height;
        ctx.fillStyle = CONSTANTS.COLOR_BG;
        ctx.fillRect(0, 0, w, h);
        ctx.save();
        applyShake(ctx, this);

        for (const s of this.stars) {
            ctx.globalAlpha = s.a;
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(s.x * w, 100 + s.y * (h - 160), s.s, s.s);
        }
        ctx.globalAlpha = 1;

        ctx.beginPath();
        ctx.moveTo(0, h);
        for (let x = 0; x <= w; x++) ctx.lineTo(x, this.heights[x] || h - 80);
        ctx.lineTo(w, h);
        ctx.closePath();
        const grad = ctx.createLinearGradient(0, h - 260, 0, h);
        grad.addColorStop(0, '#101010');
        grad.addColorStop(1, '#1c2400');
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.strokeStyle = CONSTANTS.COLOR_FG;
        ctx.lineWidth = 2;
        ctx.stroke();

        for (const pad of this.pads) {
            const x0 = pad.x - pad.w / 2;
            const x1 = pad.x + pad.w / 2;
            ctx.strokeStyle = CONSTANTS.COLOR_FG;
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.moveTo(x0, pad.y);
            ctx.lineTo(x1, pad.y);
            ctx.stroke();
            ctx.fillStyle = CONSTANTS.COLOR_FG;
            ctx.font = "bold 15px 'Courier New'";
            ctx.textAlign = 'center';
            ctx.fillText('x' + pad.mult, pad.x, pad.y - 12);
        }

        if (this.alive || this.state === 'WAITING' || this.state === 'LANDED') {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.angle);
            if (this.thrusting) {
                ctx.fillStyle = '#FF9E00';
                ctx.beginPath();
                ctx.moveTo(-7, 12);
                ctx.lineTo(7, 12);
                ctx.lineTo(0, 22 + (Math.sin(performance.now() / 35) * 0.5 + 0.5) * 10);
                ctx.closePath();
                ctx.fill();
            }
            ctx.strokeStyle = CONSTANTS.COLOR_FG;
            ctx.fillStyle = '#0a0a0a';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(0, -16);
            ctx.lineTo(11, 10);
            ctx.lineTo(-11, 10);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(-8, 8); ctx.lineTo(-13, 17);
            ctx.moveTo(8, 8); ctx.lineTo(13, 17);
            ctx.stroke();
            ctx.fillStyle = CONSTANTS.COLOR_FG;
            ctx.fillRect(-3, -7, 6, 6);
            ctx.restore();
        }

        this.particles.forEach(p => p.draw(ctx));

        const hud = hudFont(w, 22);
        ctx.font = "bold " + hud + "px 'Courier New'";
        ctx.fillStyle = CONSTANTS.COLOR_FG;
        ctx.textAlign = 'left';
        ctx.fillText(app.t('score') + ': ' + this.score, 20, 84);
        ctx.textAlign = 'center';
        ctx.fillText(app.t('lvl') + ': ' + this.level + '  ' + app.t('lives') + ': ' + Math.max(0, this.lives), w / 2, 84);
        ctx.textAlign = 'right';
        ctx.fillText(app.t('hi') + ': ' + app.getHighScore('LUNAR'), w - 20, 84);

        const fuelW = Math.min(260, w * 0.3);
        const fuelX = w / 2 - fuelW / 2;
        ctx.fillStyle = '#1a1a1a';
        ctx.fillRect(fuelX, 96, fuelW, 8);
        ctx.fillStyle = this.fuel > 25 ? CONSTANTS.COLOR_FG : CONSTANTS.COLOR_HARD;
        ctx.fillRect(fuelX, 96, fuelW * (this.fuel / 100), 8);
        ctx.strokeStyle = CONSTANTS.COLOR_HARD;
        ctx.lineWidth = 1;
        ctx.strokeRect(fuelX, 96, fuelW, 8);
        ctx.font = "12px 'Courier New'";
        ctx.fillStyle = CONSTANTS.COLOR_HARD;
        ctx.textAlign = 'left';
        ctx.fillText(app.t('fuel'), fuelX, 118);

        ctx.restore();
    }
}

// ==========================================
// ENGINE 10: ECHO
// ==========================================
class EchoEngine {
    constructor(canvas, ctx) {
        this.canvas = canvas;
        this.ctx = ctx;
        this.padFreqs = [261.63, 329.63, 392.00, 523.25];
        this.padColors = [CONSTANTS.COLOR_FG, '#FFD600', CONSTANTS.COLOR_HARD, '#00D9FF'];
        this.reset();
    }

    reset() {
        this.score = 0;
        this.round = 1;
        this.sequence = [Math.floor(Math.random() * 4)];
        this.state = 'WAITING';
        this.showIndex = -1;
        this.showOn = false;
        this.showTimer = 0;
        this.inputIndex = 0;
        this.litPad = -1;
        this.flashPad = -1;
        this.flashTimer = 0;
        app.showGameMessage('ECHO', 'TAP PADS / 1-4');
    }

    startGame() {
        this.score = 0;
        this.round = 1;
        this.sequence = [Math.floor(Math.random() * 4)];
        this.state = 'SHOWING';
        this.showIndex = -1;
        this.showOn = false;
        this.showTimer = 40;
        this.inputIndex = 0;
        this.litPad = -1;
        this.flashPad = -1;
        this.flashTimer = 0;
        audio.init();
        app.hideGameMessage();
    }

    getLayout() {
        const top = 120;
        const bottom = app.touchVisible ? 160 : 40;
        const pad = Math.floor(Math.min((this.canvas.width - 120) / 2, (this.canvas.height - top - bottom - 30) / 2));
        const gap = 20;
        const startX = (this.canvas.width - (pad * 2 + gap)) / 2;
        const startY = top + ((this.canvas.height - top - bottom) - (pad * 2 + gap)) / 2;
        return { startX, startY, pad, gap };
    }

    padAt(x, y) {
        const { startX, startY, pad, gap } = this.getLayout();
        for (let i = 0; i < 4; i++) {
            const col = i % 2;
            const row = Math.floor(i / 2);
            const px = startX + col * (pad + gap);
            const py = startY + row * (pad + gap);
            if (x >= px && x <= px + pad && y >= py && y <= py + pad) return i;
        }
        return -1;
    }

    handleClick() {
        if (this.state === 'WAITING') {
            this.startGame();
        } else if (this.state === 'INPUT') {
            const point = canvasPoint(this.canvas);
            const pad = this.padAt(point.x, point.y);
            if (pad >= 0) this.selectPad(pad);
        } else if (this.state === 'GAMEOVER') {
            this.reset();
        }
    }

    selectPad(i) {
        if (this.state !== 'INPUT') return;
        this.flashPad = i;
        this.flashTimer = 16;
        audio.tone(this.padFreqs[i], 0.2, 'triangle');
        if (this.sequence[this.inputIndex] !== i) {
            app.vibrate(40);
            this.gameOver();
            return;
        }
        this.inputIndex++;
        if (this.inputIndex >= this.sequence.length) {
            this.score += this.round * 10;
            this.round++;
            if (this.round >= 10) app.unlock('ECHO_10');
            this.sequence.push(Math.floor(Math.random() * 4));
            this.state = 'SHOWING';
            this.showIndex = -1;
            this.showOn = false;
            this.showTimer = 45;
            this.inputIndex = 0;
            this.litPad = -1;
            audio.play('POWERUP');
            app.vibrate(15);
        }
    }

    gameOver() {
        if (this.state === 'GAMEOVER') return;
        this.state = 'GAMEOVER';
        this.litPad = -1;
        const isRecord = app.saveHighScore('ECHO', this.score);
        app.showGameMessage(isRecord ? 'NEW RECORD' : 'SIGNAL LOST', app.t('sequence') + ': ' + this.round + '  ' + app.t('score') + ': ' + this.score + '  //  ' + app.t('retry'));
        audio.play('GAMEOVER');
    }

    update() {
        if (this.state === 'WAITING') {
            if (app.input.consumePressed(' ') || app.input.consumeArrow() || app.input.consumeAny(['1', '2', '3', '4'])) this.startGame();
            return;
        }
        if (this.state === 'GAMEOVER') {
            if (app.input.consumePressed(' ') || app.input.consumeArrow() || app.input.consumeAny(['1', '2', '3', '4'])) this.reset();
            return;
        }
        if (this.flashTimer > 0) this.flashTimer--;
        if (this.state === 'SHOWING') {
            if (this.showTimer > 0) this.showTimer--;
            if (this.showTimer > 0) return;
            if (this.showOn) {
                this.showOn = false;
                this.litPad = -1;
                this.showTimer = 12;
                if (this.showIndex >= this.sequence.length - 1) {
                    this.state = 'INPUT';
                    this.inputIndex = 0;
                }
            } else {
                this.showIndex++;
                this.litPad = this.sequence[this.showIndex];
                this.showOn = true;
                this.showTimer = 30;
                audio.tone(this.padFreqs[this.litPad], 0.25, 'triangle');
            }
            return;
        }
        if (this.state === 'INPUT') {
            for (let i = 0; i < 4; i++) {
                if (app.input.consumePressed(String(i + 1))) this.selectPad(i);
            }
        }
    }

    draw() {
        const ctx = this.ctx;
        const w = this.canvas.width;
        const h = this.canvas.height;
        ctx.fillStyle = CONSTANTS.COLOR_BG;
        ctx.fillRect(0, 0, w, h);

        const { startX, startY, pad, gap } = this.getLayout();
        for (let i = 0; i < 4; i++) {
            const col = i % 2;
            const row = Math.floor(i / 2);
            const x = startX + col * (pad + gap);
            const y = startY + row * (pad + gap);
            const active = this.litPad === i || (this.flashPad === i && this.flashTimer > 0);
            const color = this.padColors[i];
            ctx.save();
            ctx.globalAlpha = active ? 1 : 0.16;
            ctx.fillStyle = color;
            ctx.fillRect(x, y, pad, pad);
            ctx.globalAlpha = 1;
            ctx.strokeStyle = active ? '#ffffff' : color;
            ctx.lineWidth = active ? 4 : 2;
            ctx.strokeRect(x + 1, y + 1, pad - 2, pad - 2);
            ctx.fillStyle = active ? '#050505' : color;
            ctx.font = "bold " + Math.floor(pad * 0.24) + "px 'Courier New'";
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(String(i + 1), x + pad / 2, y + pad / 2);
            ctx.restore();
        }
        ctx.textBaseline = 'alphabetic';

        const hud = hudFont(w, 24);
        ctx.font = "bold " + hud + "px 'Courier New'";
        ctx.fillStyle = CONSTANTS.COLOR_FG;
        ctx.textAlign = 'left';
        ctx.fillText(app.t('score') + ': ' + this.score, 20, 84);
        ctx.textAlign = 'center';
        ctx.fillText(app.t('sequence') + ': ' + this.round, w / 2, 84);
        ctx.textAlign = 'right';
        ctx.fillText(app.t('hi') + ': ' + app.getHighScore('ECHO'), w - 20, 84);

        if (this.state === 'SHOWING') {
            ctx.font = "bold 18px 'Courier New'";
            ctx.fillStyle = CONSTANTS.COLOR_HARD;
            ctx.textAlign = 'center';
            ctx.fillText('...', w / 2, 108);
        }
    }
}

// ==========================================
// ENGINE 11: DEFCON
// ==========================================
class DefconEngine {
    constructor(canvas, ctx) {
        this.canvas = canvas;
        this.ctx = ctx;
        this.reset();
    }

    reset() {
        this.score = 0;
        this.wave = 1;
        this.ammo = 20;
        this.state = 'WAITING';
        this.incoming = [];
        this.interceptors = [];
        this.explosions = [];
        this.particles = [];
        this.shake = 0;
        this.toSpawn = 0;
        this.spawnTimer = 0;
        this.waveTimer = 0;
        this.cities = [
            { fx: 0.25, alive: true },
            { fx: 0.5, alive: true },
            { fx: 0.75, alive: true }
        ];
        app.showGameMessage('DEFCON', 'CLICK TO INTERCEPT');
    }

    groundY() { return this.canvas.height - 74; }
    baseX() { return [this.canvas.width * 0.1, this.canvas.width * 0.5, this.canvas.width * 0.9]; }

    startWave(n) {
        this.wave = n;
        this.ammo = 20;
        this.toSpawn = 6 + n * 2;
        this.spawnTimer = 45;
        this.incoming = [];
        this.interceptors = [];
        this.explosions = [];
        this.state = 'PLAYING';
        app.hideGameMessage();
    }

    handleClick() {
        if (this.state === 'WAITING') {
            this.startWave(1);
        } else if (this.state === 'PLAYING') {
            this.fire();
        } else if (this.state === 'GAMEOVER') {
            this.reset();
        }
    }

    fire() {
        if (this.state !== 'PLAYING' || this.ammo <= 0) return;
        const point = canvasPoint(this.canvas);
        let x = Math.max(10, Math.min(this.canvas.width - 10, point.x));
        let y = Math.max(110, Math.min(this.groundY() - 20, point.y));
