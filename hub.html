        const bases = this.baseX();
        let bx = bases[0];
        for (const b of bases) if (Math.abs(b - x) < Math.abs(bx - x)) bx = b;
        const dist = Math.hypot(x - bx, y - (this.canvas.height - 54)) || 1;
        const speed = 8;
        this.interceptors.push({
            x: bx,
            y: this.canvas.height - 54,
            tx: x,
            ty: y,
            vx: (x - bx) / dist * speed,
            vy: (y - (this.canvas.height - 54)) / dist * speed
        });
        this.ammo--;
        audio.play('SHOOT');
    }

    spawn() {
        const alive = this.cities.map((c, i) => ({ c, i })).filter(o => o.c.alive);
        if (!alive.length) return;
        const pick = alive[Math.floor(Math.random() * alive.length)];
        const x = 40 + Math.random() * (this.canvas.width - 80);
        const targetX = pick.c.fx * this.canvas.width;
        const targetY = this.groundY();
        const dist = Math.hypot(targetX - x, targetY - 108) || 1;
        const speed = 0.8 + this.wave * 0.09 + Math.random() * 0.35;
        this.incoming.push({
            x,
            y: 108,
            tx: targetX,
            ty: targetY,
            target: pick.i,
            vx: (targetX - x) / dist * speed,
            vy: (targetY - 108) / dist * speed
        });
    }

    explode(x, y) {
        this.explosions.push({ x, y, r: 5, life: 32 });
        audio.playNoise(0.2);
        app.vibrate(12);
    }

    destroyCity(index) {
        const city = this.cities[index];
        if (!city || !city.alive) return;
        city.alive = false;
        this.shake = 26;
        this.spawnParticles(city.fx * this.canvas.width, this.groundY() - 25, CONSTANTS.COLOR_HARD, 18);
        audio.playNoise(0.8);
        app.vibrate(50);
        if (this.cities.every(c => !c.alive)) this.gameOver();
    }

    spawnParticles(x, y, color, count) {
        for (let i = 0; i < count; i++) this.particles.push(new Particle(x, y, color));
    }

    gameOver() {
        if (this.state === 'GAMEOVER') return;
        this.state = 'GAMEOVER';
        const isRecord = app.saveHighScore('DEFCON', this.score);
        app.showGameMessage(isRecord ? 'NEW RECORD' : 'ALL CITIES LOST', app.t('wave') + ': ' + this.wave + '  ' + app.t('score') + ': ' + this.score + '  //  ' + app.t('retry'));
        audio.play('GAMEOVER');
    }

    update() {
        this.particles.forEach(p => p.update());
        this.particles = this.particles.filter(p => p.life > 0);
        if (this.shake > 0) this.shake *= 0.9;

        if (this.state === 'WAITING') {
            if (app.input.consumePressed(' ') || app.input.consumeArrow()) this.startWave(1);
            return;
        }
        if (this.state === 'WAVE_CLEAR') {
            if (--this.waveTimer <= 0) this.startWave(this.wave + 1);
            return;
        }
        if (this.state === 'GAMEOVER') {
            if (app.input.consumePressed(' ') || app.input.consumeArrow()) this.reset();
            return;
        }

        if (app.input.consumePressed(' ')) this.fire();
        if (this.toSpawn > 0) {
            if (--this.spawnTimer <= 0) {
                this.spawn();
                this.toSpawn--;
                this.spawnTimer = Math.max(24, 58 - this.wave * 3);
            }
        }

        for (let i = this.incoming.length - 1; i >= 0; i--) {
            const m = this.incoming[i];
            m.x += m.vx;
            m.y += m.vy;
            if (m.y >= this.groundY()) {
                this.incoming.splice(i, 1);
                this.explode(m.tx, this.groundY());
                this.destroyCity(m.target);
            }
        }

        for (let i = this.interceptors.length - 1; i >= 0; i--) {
            const m = this.interceptors[i];
            m.x += m.vx;
            m.y += m.vy;
            if (Math.hypot(m.x - m.tx, m.y - m.ty) < 9) {
                this.interceptors.splice(i, 1);
                this.explode(m.tx, m.ty);
            }
        }

        for (let i = this.explosions.length - 1; i >= 0; i--) {
            const e = this.explosions[i];
            e.r += 2.2;
            e.life--;
            for (let j = this.incoming.length - 1; j >= 0; j--) {
                const m = this.incoming[j];
                if (Math.hypot(m.x - e.x, m.y - e.y) <= e.r) {
                    this.incoming.splice(j, 1);
                    this.score += 100;
                    this.spawnParticles(m.x, m.y, CONSTANTS.COLOR_FG, 4);
                }
            }
            if (e.life <= 0) this.explosions.splice(i, 1);
        }

        if (this.state !== 'GAMEOVER' && this.toSpawn === 0 && this.incoming.length === 0 && this.interceptors.length === 0 && this.explosions.length === 0) {
            this.state = 'WAVE_CLEAR';
            this.waveTimer = 120;
            this.score += this.wave * 100;
            if (this.wave >= 5) app.unlock('DEFCON_5');
            app.showGameMessage('WAVE CLEAR', '+' + (this.wave * 100));
            audio.play('POWERUP');
        }
    }

    draw() {
        const ctx = this.ctx;
        const w = this.canvas.width;
        const h = this.canvas.height;
        const ground = this.groundY();
        ctx.fillStyle = CONSTANTS.COLOR_BG;
        ctx.fillRect(0, 0, w, h);
        ctx.save();
        applyShake(ctx, this);

        ctx.strokeStyle = 'rgba(204,255,0,0.09)';
        ctx.lineWidth = 1;
        for (let y = 120; y < ground; y += 35) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(w, y);
            ctx.stroke();
        }

        ctx.fillStyle = '#121a00';
        ctx.fillRect(0, ground, w, h - ground);
        ctx.strokeStyle = CONSTANTS.COLOR_FG;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, ground);
        ctx.lineTo(w, ground);
        ctx.stroke();

        for (const city of this.cities) {
            const x = city.fx * w;
            if (city.alive) {
                ctx.fillStyle = CONSTANTS.COLOR_FG;
                for (let i = 0; i < 4; i++) {
                    const bw = 13;
                    const bh = 18 + (i % 2) * 15;
                    ctx.fillRect(x - 26 + i * 14, ground - bh, bw, bh);
                }
                ctx.fillStyle = CONSTANTS.COLOR_HARD;
                for (let i = 0; i < 4; i++) ctx.fillRect(x - 22 + i * 14, ground - 12 - (i % 2) * 8, 3, 4);
            } else {
                ctx.fillStyle = '#2a0a0a';
                ctx.fillRect(x - 26, ground - 8, 56, 8);
                ctx.strokeStyle = CONSTANTS.COLOR_HARD;
                ctx.strokeRect(x - 26, ground - 8, 56, 8);
            }
        }

        const bases = this.baseX();
        for (const bx of bases) {
            ctx.fillStyle = CONSTANTS.COLOR_FG;
            ctx.beginPath();
            ctx.moveTo(bx, ground - 18);
            ctx.lineTo(bx + 15, ground);
            ctx.lineTo(bx - 15, ground);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = '#050505';
            ctx.fillRect(bx - 4, ground - 10, 8, 8);
        }

        for (const m of this.incoming) {
            ctx.strokeStyle = CONSTANTS.COLOR_HARD;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(m.x - m.vx * 16, m.y - m.vy * 16);
            ctx.lineTo(m.x, m.y);
            ctx.stroke();
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(m.x - 3, m.y - 3, 6, 6);
            ctx.fillStyle = CONSTANTS.COLOR_HARD;
            ctx.fillRect(m.x - 1, m.y - 1, 2, 2);
        }

        for (const m of this.interceptors) {
            ctx.strokeStyle = CONSTANTS.COLOR_FG;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(m.x - m.vx * 4, m.y - m.vy * 4);
            ctx.lineTo(m.x, m.y);
            ctx.stroke();
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(m.x - 2, m.y - 2, 4, 4);
        }

        for (const e of this.explosions) {
            ctx.globalAlpha = Math.max(0, e.life / 32);
            ctx.strokeStyle = CONSTANTS.COLOR_FG;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
            ctx.stroke();
            ctx.globalAlpha = 1;
        }

        this.particles.forEach(p => p.draw(ctx));

        const hud = hudFont(w, 22);
        ctx.font = "bold " + hud + "px 'Courier New'";
        ctx.fillStyle = CONSTANTS.COLOR_FG;
        ctx.textAlign = 'left';
        ctx.fillText(app.t('score') + ': ' + this.score, 20, 84);
        ctx.textAlign = 'center';
        ctx.fillText(app.t('wave') + ': ' + this.wave + '  ' + app.t('ammo') + ': ' + this.ammo, w / 2, 84);
        ctx.textAlign = 'right';
        ctx.fillText(app.t('hi') + ': ' + app.getHighScore('DEFCON'), w - 20, 84);

        ctx.restore();
    }
}

// ==========================================
// ENGINE 12: HOPPER
// ==========================================
class HopperEngine {
    constructor(canvas, ctx) {
        this.canvas = canvas;
        this.ctx = ctx;
        this.cols = 13;
        this.rows = 13;
        this.homeCols = [0, 3, 6, 9, 12];
        this.reset();
    }

    reset() {
        this.score = 0;
        this.lives = 3;
        this.level = 1;
        this.homesReached = 0;
        this.state = 'WAITING';
        this.particles = [];
        this.shake = 0;
        this.deathTimer = 0;
        this.levelTimer = 0;
        this.filled = 0;
        this.homeFilled = [false, false, false, false, false];
        this.buildLanes();
        this.resetFrog();
        this.time = 1800;
        app.showGameMessage('HOPPER', 'ARROWS TO HOP');
    }

    buildLanes() {
        this.logs = [];
        for (let r = 1; r <= 4; r++) {
            const dir = r % 2 === 1 ? 1 : -1;
            const speed = 0.014 + this.level * 0.0025 + Math.random() * 0.006;
            const laneLogs = [];
            let x = Math.random() * 4;
            while (x < this.cols + 2) {
                const w = 2 + Math.floor(Math.random() * 2);
                laneLogs.push({ x, w });
                x += w + 2 + Math.random() * 2;
            }
            this.logs.push({ row: r, dir, speed, items: laneLogs });
        }
        this.cars = [];
        for (let r = 6; r <= 9; r++) {
            const dir = r % 2 === 0 ? -1 : 1;
            const speed = 0.025 + this.level * 0.004 + Math.random() * 0.008;
            const laneCars = [];
            let x = Math.random() * 3;
            while (x < this.cols + 2) {
                const w = 1 + Math.floor(Math.random() * 2);
                laneCars.push({ x, w });
                x += w + 2 + Math.random() * 2.5;
            }
            this.cars.push({ row: r, dir, speed, items: laneCars });
        }
    }

    resetFrog() {
        this.frogX = 6;
        this.frogY = 11;
        this.rideLane = null;
    }

    startGame() {
        this.score = 0;
        this.lives = 3;
        this.level = 1;
        this.homesReached = 0;
        this.filled = 0;
        this.homeFilled = [false, false, false, false, false];
        this.buildLanes();
        this.resetFrog();
        this.time = 1800;
        this.state = 'PLAYING';
        app.hideGameMessage();
    }

    handleClick() {
        if (this.state === 'WAITING') this.startGame();
        else if (this.state === 'GAMEOVER') this.reset();
    }

    hop(key) {
        if (key === 'ArrowUp') { this.frogY = Math.max(0, this.frogY - 1); this.score += 10; }
        if (key === 'ArrowDown') this.frogY = Math.min(11, this.frogY + 1);
        if (key === 'ArrowLeft') this.frogX = Math.max(0, Math.round(this.frogX) - 1);
        if (key === 'ArrowRight') this.frogX = Math.min(12, Math.round(this.frogX) + 1);
        this.rideLane = null;
        if (this.frogY === 0) {
            this.tryHome();
            return;
        }
        this.checkWater();
    }

    tryHome() {
        if (this.state !== 'PLAYING') return;
        let slot = -1;
        for (let i = 0; i < this.homeCols.length; i++) {
            if (Math.abs(this.frogX - this.homeCols[i]) <= 0.55 && !this.homeFilled[i]) { slot = i; break; }
        }
        if (slot < 0) { this.die('water'); return; }
        this.homeFilled[slot] = true;
        this.filled++;
        this.homesReached++;
        this.score += 50 + Math.ceil(this.time / 60) * 2;
        if (this.homesReached >= 3) app.unlock('HOPPER_HOME');
        audio.play('POWERUP');
        app.vibrate(20);
        spawnCellBurst(this, this.homeCols[slot], 0, CONSTANTS.COLOR_FG, 10);
        if (this.filled >= 5) {
            this.state = 'LEVEL_CLEAR';
            this.levelTimer = 120;
            this.score += 200;
            app.showGameMessage('LEVEL CLEAR', '+' + (200 + Math.ceil(this.time / 60) * 2));
            audio.play('SCORE');
        } else {
            this.resetFrog();
            this.time = 1800;
        }
    }

    die(type) {
        if (this.state !== 'PLAYING') return;
        this.lives--;
        this.state = 'DEAD';
        this.deathTimer = 60;
        this.shake = 24;
        spawnCellBurst(this, this.frogX, this.frogY, CONSTANTS.COLOR_HARD, 14);
        app.vibrate(50);
        audio.playNoise(0.7);
        app.showGameMessage(type === 'water' ? 'SPLASH' : type === 'time' ? 'TIME UP' : 'SPLAT', this.lives > 0 ? app.t('lives') + ': ' + this.lives : '');
    }

    gameOver() {
        if (this.state === 'GAMEOVER') return;
        this.state = 'GAMEOVER';
        const isRecord = app.saveHighScore('HOPPER', this.score);
        app.showGameMessage(isRecord ? 'NEW RECORD' : 'GAME OVER', app.t('homes') + ': ' + this.homesReached + '  ' + app.t('score') + ': ' + this.score + '  //  ' + app.t('retry'));
        audio.play('GAMEOVER');
    }

    checkWater() {
        if (this.frogY < 1 || this.frogY > 4) { this.rideLane = null; return; }
        const lane = this.logs.find(l => l.row === this.frogY);
        if (!lane) { this.die('water'); return; }
        const log = lane.items.find(i => this.frogX >= i.x - 0.15 && this.frogX <= i.x + i.w + 0.15);
        if (!log) { this.die('water'); return; }
        this.rideLane = lane;
    }

    checkCars() {
        if (this.frogY < 6 || this.frogY > 9) return;
        const lane = this.cars.find(l => l.row === this.frogY);
        if (!lane) return;
        for (const car of lane.items) {
            if (car.x < this.frogX + 0.42 && car.x + car.w > this.frogX - 0.42) {
                this.die('car');
                return;
            }
        }
    }

    update() {
        this.particles.forEach(p => p.update());
        this.particles = this.particles.filter(p => p.life > 0);
        if (this.shake > 0) this.shake *= 0.9;

        if (this.state === 'WAITING') {
            if (app.input.consumePressed(' ') || app.input.consumeArrow()) this.startGame();
            return;
        }
        if (this.state === 'GAMEOVER') {
            if (app.input.consumePressed(' ') || app.input.consumeArrow()) this.reset();
            return;
        }
        if (this.state === 'DEAD') {
            if (--this.deathTimer <= 0) {
                if (this.lives > 0) {
                    this.resetFrog();
                    this.time = 1800;
                    this.state = 'PLAYING';
                    app.hideGameMessage();
                } else {
                    this.gameOver();
                }
            }
            return;
        }
        if (this.state === 'LEVEL_CLEAR') {
            if (--this.levelTimer <= 0) {
                this.level++;
                this.filled = 0;
                this.homeFilled = [false, false, false, false, false];
                this.buildLanes();
                this.resetFrog();
                this.time = 1800;
                this.state = 'PLAYING';
                app.hideGameMessage();
            }
            return;
        }

        this.time--;
        if (this.time <= 0) { this.die('time'); return; }
        const key = app.input.consumeArrow();
        if (key) this.hop(key);
        if (this.state !== 'PLAYING') return;

        for (const lane of this.logs) {
            for (const log of lane.items) {
                log.x += lane.dir * lane.speed;
                if (lane.dir > 0 && log.x > this.cols + 2) log.x = -log.w - 2;
                if (lane.dir < 0 && log.x + log.w < -2) log.x = this.cols + 2;
            }
        }
        if (this.rideLane) {
            this.frogX += this.rideLane.dir * this.rideLane.speed;
            if (this.frogX < -0.2 || this.frogX > this.cols - 0.8) { this.die('water'); return; }
        }
        this.checkWater();
        if (this.state !== 'PLAYING') return;

        for (const lane of this.cars) {
            for (const car of lane.items) {
                car.x += lane.dir * lane.speed;
                if (lane.dir > 0 && car.x > this.cols + 2) car.x = -car.w - 2;
                if (lane.dir < 0 && car.x + car.w < -2) car.x = this.cols + 2;
            }
        }
        this.checkCars();
    }

    draw() {
        const ctx = this.ctx;
        const w = this.canvas.width;
        const h = this.canvas.height;
        const top = 130;
        const bottomSafe = app.touchVisible ? 170 : 10;
        const cell = Math.floor(Math.min((w - 32) / this.cols, (h - top - bottomSafe) / this.rows));
        const offsetX = Math.floor((w - this.cols * cell) / 2);
        const offsetY = top + Math.floor((h - top - bottomSafe - this.rows * cell) / 2);
        this.cell = cell; this.offsetX = offsetX; this.offsetY = offsetY;
        const bx = (x) => offsetX + x * cell;
        const by = (y) => offsetY + y * cell;

        ctx.fillStyle = CONSTANTS.COLOR_BG;
        ctx.fillRect(0, 0, w, h);
        ctx.save();
        applyShake(ctx, this);

        ctx.fillStyle = '#07110f';
        ctx.fillRect(bx(0), by(0), this.cols * cell, 5 * cell);
        ctx.fillStyle = '#0c0c0c';
        ctx.fillRect(bx(0), by(6), this.cols * cell, 4 * cell);
        ctx.fillStyle = '#0b1400';
        ctx.fillRect(bx(0), by(5), this.cols * cell, cell);
        ctx.fillRect(bx(0), by(10), this.cols * cell, 3 * cell);

        ctx.setLineDash([cell * 0.4, cell * 0.4]);
        ctx.strokeStyle = '#2a2a2a';
        ctx.lineWidth = 1;
        for (let r = 7; r <= 9; r++) {
            ctx.beginPath();
            ctx.moveTo(bx(0), by(r));
            ctx.lineTo(bx(this.cols), by(r));
            ctx.stroke();
        }
        ctx.setLineDash([]);

        const drawLog = (log) => {
            ctx.fillStyle = '#6b3d1e';
            ctx.fillRect(bx(log.x), by(0) + cell * 0.22, log.w * cell, cell * 0.52);
            ctx.strokeStyle = '#9b6234';
            ctx.lineWidth = 2;
            ctx.strokeRect(bx(log.x) + 1, by(0) + cell * 0.22 + 1, log.w * cell - 2, cell * 0.52 - 2);
        };
        for (const lane of this.logs) {
            for (const log of lane.items) {
                if (log.x + log.w < 0 || log.x > this.cols) continue;
                ctx.save();
                ctx.translate(0, by(lane.row) - by(0));
                drawLog({ x: log.x, w: log.w });
                ctx.restore();
            }
        }

        for (const lane of this.cars) {
            const colors = [CONSTANTS.COLOR_HARD, '#FFD600', '#00D9FF', '#ffffff'];
            for (const car of lane.items) {
                if (car.x + car.w < 0 || car.x > this.cols) continue;
                const y = by(lane.row) + cell * 0.18;
                const ci = (lane.row + Math.abs(Math.floor(car.x))) % colors.length;
                ctx.fillStyle = colors[ci];
                ctx.fillRect(bx(car.x), y, car.w * cell, cell * 0.64);
                ctx.fillStyle = '#050505';
                ctx.fillRect(bx(car.x) + cell * 0.15, y + cell * 0.15, car.w * cell * 0.3, cell * 0.22);
            }
        }

        for (let i = 0; i < 5; i++) {
            const col = this.homeCols[i];
            const filled = this.homeFilled[i];
            ctx.fillStyle = filled ? CONSTANTS.COLOR_FG : '#0a1a0c';
            ctx.fillRect(bx(col + 0.12), by(0) + cell * 0.12, cell * 0.76, cell * 0.76);
            ctx.strokeStyle = filled ? '#ffffff' : '#1e3a1e';
            ctx.lineWidth = 2;
            ctx.strokeRect(bx(col + 0.12), by(0) + cell * 0.12, cell * 0.76, cell * 0.76);
            if (filled) {
                ctx.fillStyle = '#050505';
                ctx.font = "bold " + Math.floor(cell * 0.4) + "px 'Courier New'";
                ctx.textAlign = 'center';
                ctx.fillText('✓', bx(col + 0.5), by(0) + cell * 0.65);
            }
        }

        if (this.state !== 'DEAD' || this.deathTimer > 40) {
            const fx = bx(this.frogX + 0.5);
            const fy = by(this.frogY + 0.5);
            ctx.fillStyle = CONSTANTS.COLOR_FG;
            ctx.beginPath();
            ctx.ellipse(fx, fy, cell * 0.32, cell * 0.27, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#050505';
            ctx.fillRect(fx - cell * 0.18, fy - cell * 0.15, cell * 0.1, cell * 0.1);
            ctx.fillRect(fx + cell * 0.08, fy - cell * 0.15, cell * 0.1, cell * 0.1);
        }

        this.particles.forEach(p => p.draw(ctx));

        const hud = hudFont(w, 22);
        ctx.font = "bold " + hud + "px 'Courier New'";
        ctx.fillStyle = CONSTANTS.COLOR_FG;
        ctx.textAlign = 'left';
        ctx.fillText(app.t('score') + ': ' + this.score, 20, 84);
        ctx.textAlign = 'center';
        ctx.fillStyle = this.time < 600 ? CONSTANTS.COLOR_HARD : CONSTANTS.COLOR_FG;
        ctx.fillText(app.t('time') + ': ' + Math.ceil(Math.max(0, this.time) / 60), w / 2, 84);
        ctx.fillStyle = CONSTANTS.COLOR_FG;
        ctx.textAlign = 'right';
        ctx.fillText(app.t('hi') + ': ' + app.getHighScore('HOPPER'), w - 20, 84);

        ctx.font = "bold " + hudFont(w, 18) + "px 'Courier New'";
        ctx.textAlign = 'left';
        ctx.fillText(app.t('lives') + ': ' + Math.max(0, this.lives), 20, 112);
        ctx.textAlign = 'center';
        ctx.fillText(app.t('homes') + ': ' + this.filled + '/5', w / 2, 112);
        ctx.textAlign = 'right';
        ctx.fillText(app.t('lvl') + ': ' + this.level, w - 20, 112);

        ctx.restore();
    }
}

// ==========================================
// MAIN HUB SYSTEM
// ==========================================
class App {
    constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.input = new InputSystem();
        this.currentGame = null;
        this.animationId = null;
        this.highScores = {};
        this.currentGameKey = null;

        this.uiMenu = document.getElementById('main-menu');
        this.uiMessage = document.getElementById('game-message');
        this.uiBack = document.getElementById('back-btn');
        this.uiPause = document.getElementById('pause-btn');
        this.uiPauseOverlay = document.getElementById('pause-overlay');
        this.uiTouch = document.getElementById('touch-controls');
        this.uiRecords = document.getElementById('records-overlay');
        this.uiSettings = document.getElementById('settings-overlay');
        this.uiInitials = document.getElementById('initials-overlay');
        this.uiPong = document.getElementById('pong-overlay');
        this.uiRecordsContent = document.getElementById('records-content');
        this.uiToast = document.getElementById('toast');
        this.uiDailyBadge = document.getElementById('daily-badge');
        this.paused = false;

        this.modalOpen = false;
        this.daily = null;
        this.realRandom = Math.random;
        this.pendingRecord = null;
        this.currentGameSavedScore = null;
        this.leaderboards = {};
        this.pongMode = 1;
        this.pongDifficulty = 'normal';
        this.settings = this.loadSettings();
        this.stats = this.loadStats();
        this.achievements = this.loadAchievements();
        this.applySettings();
        this.bindSettings();
        this.isTouch = (navigator.maxTouchPoints || 0) > 0 || window.matchMedia('(pointer: coarse)').matches;
        this.touchVisible = false;
        this.debugMode = new URLSearchParams(location.search).has('debug');
        this.uiDebug = document.getElementById('debug-overlay');
        this.fpsFrames = 0;
        this.fpsLast = performance.now();
        this.fps = 0;
        this.gamepadPrev = {};
        if (this.debugMode && this.uiDebug) this.uiDebug.style.display = 'block';

        document.querySelectorAll('#touch-controls .touch-btn').forEach(btn => {
            const key = btn.dataset.key;
            const down = (e) => {
                e.preventDefault();
                this.input.press(key);
                btn.classList.add('pressed');
            };
            const up = (e) => {
                e.preventDefault();
                this.input.release(key);
                btn.classList.remove('pressed');
            };
            btn.addEventListener('pointerdown', down);
            btn.addEventListener('pointerup', up);
            btn.addEventListener('pointercancel', up);
            btn.addEventListener('pointerleave', up);
        });

        document.querySelectorAll('.modal-overlay').forEach(overlay => {
            overlay.addEventListener('keydown', (e) => {
                if (e.key !== 'Tab') return;
                const focusables = Array.from(overlay.querySelectorAll('button, input, select')).filter(el => el.offsetParent !== null);
                if (!focusables.length) return;
                const first = focusables[0];
                const last = focusables[focusables.length - 1];
                if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
                else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
            });
        });

        // Évite que Space (tir / hard drop) réactive le bouton AUDIO après un clic souris.
        const muteBtn = document.getElementById('mute-btn');
        muteBtn.addEventListener('click', (e) => { if (e.detail > 0) muteBtn.blur(); });

        this.resize();
        window.addEventListener('resize', () => this.resize());
        window.addEventListener('blur', () => {
            if (this.currentGame && !this.paused) this.togglePause(true);
        });
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && this.currentGame && !this.paused) this.togglePause(true);
        });

        // Fond animé du menu + démo Pong
        this.menuParticles = [];
        this.attract = {
            p1: this.canvas.height / 2,
            p2: this.canvas.height / 2,
            ball: { x: this.canvas.width / 2, y: this.canvas.height / 2, vx: 5, vy: 3 }
        };
        this.renderMenuHighScores();

        // Pas de temps fixe : le jeu tourne à 60 updates/s quel que soit l'écran.
        this.step = 1000 / 60;
        this.accumulator = 0;
        this.lastTime = performance.now();
        this.loop = this.loop.bind(this);
        this.animationId = requestAnimationFrame(this.loop);
    }

    // --- SETTINGS ---
    loadSettings() {
        const settings = {
            volume: 0.3,
            scanlines: true,
            reducedMotion: window.matchMedia('(prefers-reduced-motion: reduce)').matches,
            touchSize: 'md',
            lang: (navigator.language || 'en').toLowerCase().startsWith('fr') ? 'fr' : 'en',
            music: true,
            haptics: true
        };
        try { Object.assign(settings, JSON.parse(localStorage.getItem('PLAY_SETTINGS') || '{}')); } catch (e) {}
        return settings;
    }

    saveSettings() { try { localStorage.setItem('PLAY_SETTINGS', JSON.stringify(this.settings)); } catch (e) {} }

    applySettings() {
        REDUCED_MOTION = !!this.settings.reducedMotion || window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        document.body.classList.toggle('no-scanlines', !this.settings.scanlines);
        document.body.classList.toggle('touch-small', this.settings.touchSize === 'sm');
        document.body.classList.toggle('touch-large', this.settings.touchSize === 'lg');
        document.body.classList.toggle('reduced-motion', !!this.settings.reducedMotion);
        audio.setVolume(this.settings.volume);
        audio.setMusic(this.settings.music !== false);
        this.applyLanguage(this.settings.lang);
    }

    bindSettings() {
        const volume = document.getElementById('set-volume');
        volume.addEventListener('input', () => {
            this.settings.volume = Number(volume.value) / 100;
            audio.setVolume(this.settings.volume);
            this.saveSettings();
        });
        const scanlines = document.getElementById('set-scanlines');
        scanlines.addEventListener('change', () => {
            this.settings.scanlines = scanlines.checked;
            this.applySettings();
            this.saveSettings();
        });
        const reduced = document.getElementById('set-reduced');
        reduced.addEventListener('change', () => {
            this.settings.reducedMotion = reduced.checked;
            this.applySettings();
            this.saveSettings();
        });
        const touch = document.getElementById('set-touch');
        touch.addEventListener('change', () => {
            this.settings.touchSize = touch.value;
            this.applySettings();
            this.saveSettings();
        });
        const music = document.getElementById('set-music');
        music.addEventListener('change', () => {
            this.settings.music = music.checked;
            this.applySettings();
            this.saveSettings();
        });
        const haptics = document.getElementById('set-haptics');
        haptics.addEventListener('change', () => {
            this.settings.haptics = haptics.checked;
            this.saveSettings();
        });
        const lang = document.getElementById('set-lang');
        lang.addEventListener('change', () => {
            this.settings.lang = lang.value;
            this.applySettings();
            this.saveSettings();
        });
        document.getElementById('initials-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                this.saveInitials();
            }
        });
    }

    t(key) {
        const lang = this.settings?.lang === 'fr' ? 'fr' : 'en';
        return (UI_TEXT[lang] && UI_TEXT[lang][key]) || (UI_TEXT.en[key] !== undefined ? UI_TEXT.en[key] : key);
    }

    translateGameText(text) {
        if (this.settings.lang !== 'fr' || !text) return text;
        const exact = {
            'CLICK TO START': 'CLIQUE POUR JOUER',
            'CLICK TO LAUNCH': 'CLIQUE POUR LANCER',
            'CLICK TO RESET': 'CLIQUE POUR REJOUER',
            'CLICK TO RESUME': 'CLIQUE POUR REPRENDRE',
            'CLICK TO CONTINUE': 'CLIQUE POUR CONTINUER',
            'PRESS ARROWS TO START': 'FLÈCHES POUR JOUER',
            'PRESS P OR CLICK RESUME': 'P OU CLIQUE REPRENDRE',
            'NEW RECORD': 'NOUVEAU RECORD',
            'SYSTEM FAILURE': 'ÉCHEC SYSTÈME',
            'SIGNAL LOST': 'SIGNAL PERDU',
            'SYSTEM CLEARED': 'SYSTÈME NETTOYÉ',
            'ALL LEVELS CLEAR': 'TOUS LES NIVEAUX TERMINÉS',
            'ALL WAVES CLEAR': 'TOUTES LES VAGUES TERMINÉES',
            'INVASION SUCCESSFUL': 'INVASION RÉUSSIE',
            'HULL BREACH': 'COQUE PERCÉE',
            'GRID LOCKED': 'GRILLE BLOQUÉE',
            'PLAYER WINS': 'JOUEUR GAGNE',
            'CPU WINS': 'CPU GAGNE',
            'P1 WINS': 'P1 GAGNE',
            'P2 WINS': 'P2 GAGNE',
            'P1: W/S // P2: ARROWS': 'P1: W/S // P2: FLÈCHES',
            'ARROWS: MOVE // SPACE: FIRE': 'FLÈCHES: BOUGER // ESPACE: TIRER',
            'ARROWS: MOVE // SPACE: DROP': 'FLÈCHES: BOUGER // ESPACE: POSER',
            'ARROWS: MOVE // SPACE: DROP // C: HOLD': 'FLÈCHES: BOUGER // ESPACE: POSER // C: RÉSERVE',
            'ARROWS: DRIVE // SPACE: FIRE': 'FLÈCHES: PILOTER // ESPACE: TIRER',
            'WHITE = 2 HITS': 'BLANC = 2 COUPS',
            'ARROWS / D-PAD': 'FLÈCHES / D-PAD',
            'READY': 'PRÊT',
            'GO': 'PARTEZ',
            'A/D + LEFT/RIGHT': 'A/D + GAUCHE/DROITE',
            'PLAYER 1 WINS': 'JOUEUR 1 GAGNE',
            'PLAYER 2 WINS': 'JOUEUR 2 GAGNE',
            'DRAW': 'ÉGALITÉ',
            'ARROWS + THRUST': 'FLÈCHES + POUSSÉE',
            'LANDED': 'POSÉ',
            'CRASHED': 'CRASH',
            'OUT OF FUEL': 'PANNE SÈCHE',
            'MISSION FAILED': 'MISSION ÉCHOUÉE',
            'TAP PADS / 1-4': 'PADS / 1-4',
            'SIGNAL LOST': 'SIGNAL PERDU',
            'CLICK TO INTERCEPT': 'CLIC POUR INTERCEPTER',
            'WAVE CLEAR': 'VAGUE REPOUSSÉE',
            'ALL CITIES LOST': 'TOUTES LES VILLES DÉTRUITES',
            'ARROWS TO HOP': 'FLÈCHES POUR SAUTER',
            'SPLASH': 'SPLASH',
            'SPLAT': 'SPLAT',
            'TIME UP': 'TEMPS ÉCOULÉ',
            'LEVEL CLEAR': 'NIVEAU TERMINÉ'
        };
        if (exact[text]) return exact[text];
        return text
            .replace('CLICK TO LAUNCH', 'CLIQUE POUR LANCER')
            .replace('CLICK TO RESUME', 'CLIQUE POUR REPRENDRE')
            .replace('CLICK TO CONTINUE', 'CLIQUE POUR CONTINUER')
            .replace('CLICK TO RESET', 'CLIQUE POUR REJOUER')
            .replace('CLICK TO START', 'CLIQUE POUR JOUER')
            .replace('WHITE = 2 HITS', 'BLANC = 2 COUPS')
            .replace(/^ENDLESS (\d+)$/, 'SANS FIN $1')
            .replace(/LEVEL (\d+)/g, 'NIVEAU $1')
            .replace(/WAVE (\d+)/g, 'VAGUE $1')
            .replace(/LVL:/g, 'NIV:')
            .replace(/LIVES:/g, 'VIES:')
            .replace(/\bHI:/g, 'REC:')
            .replace(/ CLEAR$/, ' TERMINÉ');
    }

    applyLanguage(lang) {
        this.settings.lang = lang === 'fr' ? 'fr' : 'en';
        document.documentElement.lang = this.settings.lang;
        document.querySelectorAll('[data-i18n]').forEach(el => {
            el.textContent = this.t(el.dataset.i18n);
        });
        const pauseBig = this.uiPauseOverlay.querySelector('.big-msg');
        const pauseSub = this.uiPauseOverlay.querySelector('.sub-msg');
        if (pauseBig) pauseBig.textContent = this.t('paused');
        if (pauseSub) pauseSub.textContent = this.t('pressResume');
        this.updateMuteLabel();
        this.updatePauseLabel();
        this.updateTouchAction();
        this.renderMenuHighScores();
        this.renderDailyButton();
        this.updateDailyBadge();
        if (this.uiRecords && this.uiRecords.classList.contains('open')) this.renderRecords();
        if (this.uiInitials && this.uiInitials.classList.contains('open')) this.updateInitialsText();
    }

    updateMuteLabel() {
        const btn = document.getElementById('mute-btn');
        if (!btn) return;
        btn.innerText = audio.muted ? this.t('audioOff') : this.t('audioOn');
        btn.setAttribute('aria-pressed', String(audio.muted));
    }

    updatePauseLabel() {
        this.uiPause.innerText = this.paused ? this.t('resume') : this.t('pause');
    }

    updateTouchAction() {
        const el = document.getElementById('touch-action');
        if (!el) return;
        el.textContent = this.currentGameKey === 'TETRIS' ? this.t('drop') : (this.currentGameKey === 'LUNAR' ? this.t('thrust') : this.t('fire'));
        const hold = document.getElementById('touch-hold');
        if (hold) hold.textContent = this.t('hold');
    }

    // --- STATS / ACHIEVEMENTS ---
    loadStats() {
        const plays = {};
        ['PONG','BREAKOUT','SNAKE','INVADERS','TETRIS','ASTEROIDS','MAZE','TRON','LUNAR','ECHO','DEFCON','HOPPER'].forEach(g => plays[g] = 0);
        const stats = { plays, pongWins: 0 };
        try { Object.assign(stats, JSON.parse(localStorage.getItem('PLAY_STATS') || '{}')); } catch (e) {}
        if (!stats.plays) stats.plays = plays;
        return stats;
    }

    saveStats() { try { localStorage.setItem('PLAY_STATS', JSON.stringify(this.stats)); } catch (e) {} }

    recordPlay(game) {
        this.stats.plays[game] = (this.stats.plays[game] || 0) + 1;
        this.saveStats();
        this.unlock('FIRST_RUN');
    }

    recordPongWin() {
        this.stats.pongWins = (this.stats.pongWins || 0) + 1;
        this.saveStats();
        this.unlock('PONG_WIN');
    }

    loadAchievements() {
        try { return JSON.parse(localStorage.getItem('PLAY_ACH') || '{}') || {}; } catch (e) { return {}; }
    }

    saveAchievements() { try { localStorage.setItem('PLAY_ACH', JSON.stringify(this.achievements)); } catch (e) {} }

    unlock(id) {
        if (this.achievements[id]) return;
        const achievement = ACHIEVEMENTS.find(a => a.id === id);
        if (!achievement) return;
        this.achievements[id] = true;
        this.saveAchievements();
        this.toast(this.t('achievementUnlocked') + ': ' + (this.settings.lang === 'fr' ? achievement.fr : achievement.en));
    }

    toast(text) {
        if (!this.uiToast) return;
        this.uiToast.textContent = text;
        this.uiToast.classList.add('show');
        clearTimeout(this._toastTimer);
        this._toastTimer = setTimeout(() => this.uiToast.classList.remove('show'), 2600);
    }

    vibrate(pattern) {
        if (this.settings.haptics === false) return;
        if (navigator.vibrate) {
            try { navigator.vibrate(pattern); } catch (e) {}
        }
    }

    // --- LEADERBOARDS ---
    getLeaderboard(key) {
        if (this.leaderboards[key]) return this.leaderboards[key];
        let list = [];
        try { list = JSON.parse(localStorage.getItem('PLAY_TOP_' + key) || '[]'); } catch (e) {}
        if (!Array.isArray(list)) list = [];
        list = list.filter(e => e && typeof e.score === 'number').slice(0, 5);
        this.leaderboards[key] = list;
        return list;
    }

    saveLeaderboard(key) {
        try { localStorage.setItem('PLAY_TOP_' + key, JSON.stringify(this.leaderboards[key] || [])); } catch (e) {}
    }

    qualifies(key, score) {
        if (score <= 0) return false;
        const list = this.getLeaderboard(key);
        return list.length < 5 || score > list[list.length - 1].score;
    }

    addLeaderboard(key, score, initials = 'P1') {
        const list = this.getLeaderboard(key);
        const entry = {
            score: Math.round(score),
            initials: String(initials || 'P1').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 3) || 'P1',
            date: this.todayKey()
        };
        list.push(entry);
        list.sort((a, b) => b.score - a.score);
        list.splice(5);
        this.saveLeaderboard(key);
        return entry;
    }

    // --- HIGH SCORE SYSTEM ---
    getHighScore(game) {
        if (!(game in this.highScores)) {
            let value = 0;
            try { value = parseInt(localStorage.getItem('PLAY_HI_' + game), 10) || 0; } catch (e) {}
            this.highScores[game] = value;
        }
        return this.highScores[game];
    }

    saveHighScore(game, score, opts = {}) {
        const daily = !!(this.daily && this.daily.game === game);
        const key = daily ? 'DAILY:' + this.daily.date : game;
        const best = daily ? (this.getLeaderboard(key)[0]?.score || 0) : this.getHighScore(game);
        const isRecord = score > best;
        if (!daily && isRecord) {
            this.highScores[game] = score;
            try { localStorage.setItem('PLAY_HI_' + game, String(score)); } catch (e) {}
            this.renderMenuHighScores();
        }
        let entry = null;
        if (this.qualifies(key, score)) {
            entry = this.addLeaderboard(key, score, 'P1');
        }
        if (opts.prompt !== false && entry) {
            this.openInitials(key, entry, isRecord, game);
        }
        this.currentGameSavedScore = score;
        return isRecord;
    }

    renderMenuHighScores() {
        const hi = this.t('hi');
        document.querySelectorAll('.menu-hi[data-hi]').forEach(el => {
            el.textContent = hi + ' ' + this.getHighScore(el.dataset.hi);
        });
    }

    // --- RECORDS / SETTINGS / INITIALS ---
    openRecords() {
        this.modalOpen = true;
        this.uiRecords.classList.add('open');
        this.renderRecords();
        setTimeout(() => this.uiRecords.querySelector('.modal-head button')?.focus(), 30);
    }

    renderRecords() {
        const lang = this.settings.lang === 'fr' ? 'fr' : 'en';
        const games = ['BREAKOUT','SNAKE','INVADERS','TETRIS','ASTEROIDS','MAZE','TRON','LUNAR','ECHO','DEFCON','HOPPER'];
        const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
        const totalPlays = Object.values(this.stats.plays || {}).reduce((a, b) => a + b, 0);
        let html = `<div class="stats-line">${this.t('plays')}: ${totalPlays} &nbsp; // &nbsp; ${this.t('pongWins')}: ${this.stats.pongWins || 0}</div>`;
        for (const game of games) {
            const list = this.getLeaderboard(game);
            html += `<div class="record-game"><h3>${game}</h3>`;
            if (!list.length) html += `<div class="record-row"><span class="date">${this.t('noScores')}</span></div>`;
            list.forEach((row, i) => {
                html += `<div class="record-row"><span class="pos">${i + 1}.</span><span class="initials">${esc(row.initials || 'P1')}</span><span class="score">${row.score}</span><span class="date">${esc(row.date || '')}</span></div>`;
            });
            html += '</div>';
        }
        const dailyKey = 'DAILY:' + this.todayKey();
        const dailyList = this.getLeaderboard(dailyKey);
        html += `<div class="record-game"><h3>${this.t('dailyChallenge')} // ${this.dailyGame()} // ${this.todayKey()}</h3>`;
        if (!dailyList.length) html += `<div class="record-row"><span class="date">${this.t('noScores')}</span></div>`;
        dailyList.forEach((row, i) => {
            html += `<div class="record-row"><span class="pos">${i + 1}.</span><span class="initials">${esc(row.initials || 'P1')}</span><span class="score">${row.score}</span><span class="date">${esc(row.date || '')}</span></div>`;
        });
        html += '</div>';
        html += `<h3>${this.t('achievements')}</h3><div class="ach-list">`;
        for (const a of ACHIEVEMENTS) {
            const unlocked = !!this.achievements[a.id];
            html += `<div class="ach ${unlocked ? 'unlocked' : ''}"><strong>${unlocked ? '✓ ' : ''}${esc(lang === 'fr' ? a.fr : a.en)}</strong><small>${esc(lang === 'fr' ? a.frDesc : a.enDesc)}</small></div>`;
        }
        html += '</div>';
        this.uiRecordsContent.innerHTML = html;
    }

    openSettings() {
        this.modalOpen = true;
        this.uiSettings.classList.add('open');
        setTimeout(() => document.getElementById('set-volume').focus(), 30);
        document.getElementById('set-volume').value = Math.round(this.settings.volume * 100);
        document.getElementById('set-scanlines').checked = !!this.settings.scanlines;
        document.getElementById('set-reduced').checked = !!this.settings.reducedMotion;
        document.getElementById('set-touch').value = this.settings.touchSize;
        document.getElementById('set-lang').value = this.settings.lang;
        document.getElementById('set-music').checked = this.settings.music !== false;
        document.getElementById('set-haptics').checked = this.settings.haptics !== false;
    }

    openPongOptions() {
        this.modalOpen = true;
        this.uiPong.classList.add('open');
        this.uiPong.classList.toggle('hide-difficulty', this.pongMode === 2);
        this.uiPong.querySelectorAll('[data-pong-mode]').forEach(btn => btn.classList.toggle('selected', Number(btn.dataset.pongMode) === this.pongMode));
        this.uiPong.querySelectorAll('[data-pong-diff]').forEach(btn => btn.classList.toggle('selected', btn.dataset.pongDiff === this.pongDifficulty));
    }

    setPongMode(mode) {
        this.pongMode = Number(mode) === 2 ? 2 : 1;
        this.uiPong.classList.toggle('hide-difficulty', this.pongMode === 2);
        this.uiPong.querySelectorAll('[data-pong-mode]').forEach(btn => btn.classList.toggle('selected', Number(btn.dataset.pongMode) === this.pongMode));
    }

    setPongDifficulty(difficulty) {
        this.pongDifficulty = ['easy', 'normal', 'hard'].includes(difficulty) ? difficulty : 'normal';
        this.uiPong.querySelectorAll('[data-pong-diff]').forEach(btn => btn.classList.toggle('selected', btn.dataset.pongDiff === this.pongDifficulty));
    }

    startPong() {
        const twoPlayer = this.pongMode === 2;
        const difficulty = this.pongDifficulty;
        this.closeModal();
        this.launch('PONG', { twoPlayer, difficulty });
    }

    closeModal() {
        this.modalOpen = false;
        this.pendingRecord = null;
        this.uiRecords.classList.remove('open');
        this.uiSettings.classList.remove('open');
        this.uiInitials.classList.remove('open');
        this.uiPong.classList.remove('open');
    }

    openInitials(key, entry, isRecord, game) {
        this.pendingRecord = { key, entry };
        this.modalOpen = true;
        this.pendingInitials = { isRecord, game, entry };
        this.updateInitialsText();
        this.uiInitials.classList.add('open');
        audio.play('POWERUP');
        this.vibrate([10, 40, 10]);
        const input = document.getElementById('initials-input');
        input.value = entry.initials || 'P1';
        setTimeout(() => { input.focus(); input.select(); }, 30);
    }

    updateInitialsText() {
        if (!this.pendingInitials) return;
        const { isRecord, game, entry } = this.pendingInitials;
        document.getElementById('initials-title').textContent = isRecord ? this.t('newRecord') : this.t('top5');
        document.getElementById('initials-score').textContent = `${game} // ${entry.score}`;
    }

    saveInitials() {
        if (!this.pendingRecord) return this.closeModal();
        const input = document.getElementById('initials-input');
        const initials = (input.value || 'P1').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 3) || 'P1';
        this.pendingRecord.entry.initials = initials;
        this.saveLeaderboard(this.pendingRecord.key);
        this.closeModal();
        this.toast((this.settings.lang === 'fr' ? 'SCORE ENREGISTRÉ' : 'SCORE SAVED') + ': ' + this.pendingInitials?.game + ' ' + initials);
        this.pendingInitials = null;
    }

    // --- DAILY ---
    todayKey() {
        const d = new Date();
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    dailyGame(date = this.todayKey()) {
        const pool = ['BREAKOUT','SNAKE','INVADERS','TETRIS','ASTEROIDS','MAZE','LUNAR','ECHO','DEFCON','HOPPER'];
        let h = 2166136261;
        for (const c of date) h = Math.imul(h ^ c.charCodeAt(0), 16777619) >>> 0;
        return pool[h % pool.length];
    }

    dailySeed(str) {
        let h = 2166136261;
        for (const c of str) h = Math.imul(h ^ c.charCodeAt(0), 16777619) >>> 0;
        return h;
    }

    renderDailyButton() {
        const el = document.getElementById('daily-btn');
        if (el) el.textContent = this.t('daily') + ': ' + this.dailyGame();
    }

    updateDailyBadge() {
        if (!this.uiDailyBadge) return;
        if (!this.daily) {
            this.uiDailyBadge.style.display = 'none';
            return;
        }
        this.uiDailyBadge.textContent = this.t('daily') + ' // ' + this.daily.game + ' // ' + this.daily.date;
        this.uiDailyBadge.style.display = 'block';
    }

    launchDaily() {
        const date = this.todayKey();
        const game = this.dailyGame(date);
        this.launch(game, { daily: { date, game } });
        this.unlock('DAILY');
    }

    resize() {
        const oldW = this.canvas.width || window.innerWidth;
        const oldH = this.canvas.height || window.innerHeight;
        const newW = window.innerWidth, newH = window.innerHeight;
        this.canvas.width = newW;
        this.canvas.height = newH;
        if (this.currentGame && this.currentGame.onResize) this.currentGame.onResize(oldW, oldH, newW, newH);
    }

    togglePause(silent = false) {
        if (!this.currentGame) return;
        this.paused = !this.paused;
        this.updatePauseLabel();
        this.uiPause.setAttribute('aria-pressed', String(this.paused));
        this.uiPauseOverlay.style.display = this.paused ? 'flex' : 'none';
        this.input.reset();
        this.clearTouchButtons();
        this.uiTouch.style.display = (this.paused || !this.touchVisible) ? 'none' : 'flex';
        this.accumulator = 0;
        this.lastTime = performance.now();
        if (!silent) {
            audio.init();
            audio.play('UI_CLICK');
        }
    }

    clearTouchButtons() {
        document.querySelectorAll('#touch-controls .touch-btn.pressed').forEach(btn => btn.classList.remove('pressed'));
    }

    launch(gameType, options = {}) {
        if (options.daily) {
            this.daily = options.daily;
            Math.random = mulberry32(this.dailySeed(options.daily.date + ':' + options.daily.game));
        } else {
            this.daily = null;
            Math.random = this.realRandom;
        }
        this.updateDailyBadge();
        this.currentGameSavedScore = null;
        this.recordPlay(gameType);

        // Cacher Menu, Montrer Retour
        this.uiMenu.style.display = 'none';
        this.uiBack.style.display = 'block';
        this.uiPause.style.display = 'block';
        this.updatePauseLabel();
        this.uiPause.setAttribute('aria-pressed', 'false');
        this.uiPauseOverlay.style.display = 'none';
        this.paused = false;
        this.input.reset();
        this.accumulator = 0;
        this.currentGameKey = gameType;
        
        // Initialiser l'audio au lancement d'un jeu si pas déjà fait
        audio.init();
        audio.play('UI_CLICK');

        this.touchVisible = this.isTouch && ['SNAKE','TETRIS','INVADERS','ASTEROIDS','MAZE','LUNAR','HOPPER'].includes(gameType);
        this.uiTouch.style.display = this.touchVisible ? 'flex' : 'none';
        this.clearTouchButtons();
        document.getElementById('touch-action').textContent = gameType === 'TETRIS' ? this.t('drop') : (gameType === 'LUNAR' ? this.t('thrust') : this.t('fire'));
        document.getElementById('touch-hold').style.display = gameType === 'TETRIS' ? 'block' : 'none';
        document.getElementById('touch-action-wrap').style.visibility = ['SNAKE','MAZE','HOPPER'].includes(gameType) ? 'hidden' : 'visible';

        if (gameType === 'PONG') {
            this.currentGame = new PongEngine(this.canvas, this.ctx, options);
        } else if (gameType === 'BREAKOUT') {
            this.currentGame = new BreakoutEngine(this.canvas, this.ctx);
        } else if (gameType === 'SNAKE') {
            this.currentGame = new SnakeEngine(this.canvas, this.ctx);
        } else if (gameType === 'INVADERS') {
            this.currentGame = new SpaceInvadersEngine(this.canvas, this.ctx);
        } else if (gameType === 'TETRIS') {
            this.currentGame = new TetrisEngine(this.canvas, this.ctx);
        } else if (gameType === 'ASTEROIDS') {
            this.currentGame = new AsteroidsEngine(this.canvas, this.ctx);
        } else if (gameType === 'MAZE') {
            this.currentGame = new NeonMazeEngine(this.canvas, this.ctx);
        } else if (gameType === 'TRON') {
            this.currentGame = new TronEngine(this.canvas, this.ctx);
        } else if (gameType === 'LUNAR') {
            this.currentGame = new LunarEngine(this.canvas, this.ctx);
        } else if (gameType === 'ECHO') {
            this.currentGame = new EchoEngine(this.canvas, this.ctx);
        } else if (gameType === 'DEFCON') {
            this.currentGame = new DefconEngine(this.canvas, this.ctx);
        } else if (gameType === 'HOPPER') {
            this.currentGame = new HopperEngine(this.canvas, this.ctx);
        }
    }

    loadMenu() {
        if (this.currentGame && this.currentGameKey && this.currentGameKey !== 'PONG' && typeof this.currentGame.score === 'number' && this.currentGame.score !== this.currentGameSavedScore) {
            this.saveHighScore(this.currentGameKey, this.currentGame.score, { prompt: false });
        }
        this.closeModal();
        this.currentGame = null;
        this.currentGameKey = null;
        this.daily = null;
        Math.random = this.realRandom;
        this.uiDailyBadge.style.display = 'none';
        this.currentGameSavedScore = null;
        this.paused = false;
        this.input.reset();
        this.accumulator = 0;
        this.uiMenu.style.display = 'block';
        this.uiBack.style.display = 'none';
        this.uiPause.style.display = 'none';
        this.updatePauseLabel();
        this.uiPause.setAttribute('aria-pressed', 'false');
        this.uiPauseOverlay.style.display = 'none';
        this.touchVisible = false;
        this.uiTouch.style.display = 'none';
        this.clearTouchButtons();
        this.hideGameMessage();
        this.renderMenuHighScores();
        // Reset canvas
        this.ctx.fillStyle = CONSTANTS.COLOR_BG;
        this.ctx.fillRect(0,0, this.canvas.width, this.canvas.height);
        audio.play('UI_CLICK');
    }

    showGameMessage(title, sub) {
        this.uiMessage.style.display = 'block';
        document.getElementById('msg-title').innerText = this.translateGameText(title);
        document.getElementById('msg-sub').innerText = this.translateGameText(sub);
    }

    hideGameMessage() {
        this.uiMessage.style.display = 'none';
    }

    pollGamepad() {
        if (!navigator.getGamepads) return;
        const pad = Array.from(navigator.getGamepads()).find(p => p);
        if (!pad) return;
        const prev = this.gamepadPrev || {};
        const next = {};
        const buttons = { 12: 'ArrowUp', 13: 'ArrowDown', 14: 'ArrowLeft', 15: 'ArrowRight', 0: ' ' };
        for (const [index, key] of Object.entries(buttons)) {
            const down = !!pad.buttons[Number(index)]?.pressed;
            const id = 'btn' + index;
            if (down && !prev[id]) this.input.press(key);
            if (!down && prev[id]) this.input.release(key);
            next[id] = down;
        }
        const ax = pad.axes[0] || 0;
        const ay = pad.axes[1] || 0;
        const axes = { ArrowLeft: ax < -0.5, ArrowRight: ax > 0.5, ArrowUp: ay < -0.5, ArrowDown: ay > 0.5 };
        for (const [key, down] of Object.entries(axes)) {
            const id = 'axis' + key;
            if (down && !prev[id]) this.input.press(key);
            if (!down && prev[id]) this.input.release(key);
            next[id] = down;
        }
        const start = !!pad.buttons[9]?.pressed;
        if (start && !prev.start && this.currentGame) this.togglePause();
        next.start = start;
        const hold = !!pad.buttons[1]?.pressed;
        if (hold && !prev.hold && this.currentGameKey === 'TETRIS') this.input.press('c');
        if (!hold && prev.hold) this.input.release('c');
        next.hold = hold;
        if (this.currentGameKey === 'PONG' && this.currentGame && !this.currentGame.twoPlayer) this.input.y = (ay + 1) / 2 * this.canvas.height;
        if (this.currentGameKey === 'BREAKOUT') this.input.x = (ax + 1) / 2 * this.canvas.width;
        this.gamepadPrev = next;
    }

    updateDebug() {
        if (!this.debugMode || !this.uiDebug) return;
        this.fpsFrames++;
        const now = performance.now();
        if (now - this.fpsLast >= 500) {
            this.fps = Math.round(this.fpsFrames * 1000 / (now - this.fpsLast));
            this.fpsFrames = 0;
            this.fpsLast = now;
        }
        const game = this.currentGame;
        const score = game ? (game.score ?? game.p1?.score ?? '') : '';
        this.uiDebug.textContent = `FPS ${this.fps} // ${game ? game.constructor.name : 'MENU'} // ${game ? game.state : ''} // ${score}`;
    }

    updateMenu() {
        // Effet Matrix/Pluie verte subtile
        if(!REDUCED_MOTION && Math.random() < 0.1) {
            this.menuParticles.push(new Particle(Math.random()*this.canvas.width, 0, CONSTANTS.COLOR_FG));
        }
        this.menuParticles.forEach(p => {
            p.y += 5;
            p.life -= 0.005;
        });
        this.menuParticles = this.menuParticles.filter(p => p.life > 0);

        if (REDUCED_MOTION) return;

        // Démo Pong en fond
        const d = this.attract;
        if (!d) return;
        const w = this.canvas.width, h = this.canvas.height;
        d.p1 += ((d.ball.y - 60) - d.p1) * 0.06;
        d.p2 += ((d.ball.y - 60) - d.p2) * 0.06;
        d.p1 = Math.max(0, Math.min(h - 120, d.p1));
        d.p2 = Math.max(0, Math.min(h - 120, d.p2));
        d.ball.x += d.ball.vx;
        d.ball.y += d.ball.vy;
        if (d.ball.y <= 0 || d.ball.y + 16 >= h) d.ball.vy *= -1;
        if (d.ball.x <= 70 && d.ball.y + 16 > d.p1 && d.ball.y < d.p1 + 120) { d.ball.x = 70; d.ball.vx = Math.abs(d.ball.vx); }
        if (d.ball.x >= w - 86 && d.ball.y + 16 > d.p2 && d.ball.y < d.p2 + 120) { d.ball.x = w - 86; d.ball.vx = -Math.abs(d.ball.vx); }
        if (d.ball.x < -30 || d.ball.x > w + 30) {
            d.ball.x = w / 2; d.ball.y = h / 2;
            d.ball.vx = (Math.random() < 0.5 ? 1 : -1) * (4 + Math.random() * 2);
            d.ball.vy = (Math.random() - 0.5) * 5;
        }
    }

    drawMenu() {
        this.ctx.fillStyle = CONSTANTS.COLOR_BG;
        this.ctx.fillRect(0,0, this.canvas.width, this.canvas.height);

        const d = this.attract;
        if (d) {
            this.ctx.save();
            this.ctx.globalAlpha = 0.2;
            this.ctx.fillStyle = CONSTANTS.COLOR_FG;
            this.ctx.fillRect(50, d.p1, 20, 120);
            this.ctx.fillRect(this.canvas.width - 70, d.p2, 20, 120);
            this.ctx.fillStyle = CONSTANTS.COLOR_HARD;
            this.ctx.fillRect(d.ball.x, d.ball.y, 16, 16);
            this.ctx.strokeStyle = '#111';
            this.ctx.lineWidth = 8;
            this.ctx.beginPath();
            this.ctx.moveTo(this.canvas.width / 2, 0);
            this.ctx.lineTo(this.canvas.width / 2, this.canvas.height);
            this.ctx.stroke();
            this.ctx.restore();
        }

        this.menuParticles.forEach(p => p.draw(this.ctx));
    }

    loop(now) {
        if (now === undefined) now = performance.now();

        if (this.paused) {
            this.lastTime = now;
            this.accumulator = 0;
            requestAnimationFrame(this.loop);
            return;
        }

        // Update à pas fixe (60 Hz) : indépendant de la fréquence de l'écran.
        const elapsed = Math.min(Math.max(now - this.lastTime, 0), 100);
        this.lastTime = now;
        this.accumulator += elapsed;

        let steps = 0;
        while (this.accumulator >= this.step && steps < 5) {
            if (this.currentGame) this.currentGame.update();
            else this.updateMenu();
            this.accumulator -= this.step;
            steps++;
        }
        // Si on a pris trop de retard (onglet en arrière-plan), on jette le surplus.
        if (this.accumulator > this.step * 5) this.accumulator = 0;

        if (this.currentGame) this.currentGame.draw();
        else this.drawMenu();

        this.pollGamepad();
        this.updateDebug();
        requestAnimationFrame(this.loop);
    }
}

// Initialisation
const app = new App();

</script>
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
    }
</script>
