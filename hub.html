<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050505">
    <title>PLAY // HUB</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta property="og:type" content="website">
    <meta property="og:title" content="PLAY // HUB">
    <meta property="og:description" content="La borne arcade PressPlay : douze jeux rétro, brutalistes et offline.">
    <meta property="og:image" content="https://lcquentin.github.io/PressPlay/og.png">
    <meta name="twitter:card" content="summary_large_image">
    <style>
        /* --- ESTHÉTIQUE GLOBALE --- */
        :root {
            --bg-color: #050505;
            --accent-color: #CCFF00; /* Vert Acide */
            --secondary-color: #FFFFFF; /* Blanc */
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
            touch-action: manipulation;
            color: var(--accent-color);
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            image-rendering: pixelated;
            touch-action: none;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 5;
            pointer-events: none;
            background: repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0.22) 0 2px, transparent 2px 4px);
        }

        button:focus-visible {
            outline: 3px solid var(--secondary-color);
            outline-offset: 3px;
        }

        /* --- UI LAYER --- */
        #ui-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* --- MENU PRINCIPAL --- */
        #main-menu {
            text-align: center;
            pointer-events: auto;
            touch-action: pan-y;
            background: rgba(5, 5, 5, 0.95);
            padding: 30px;
            border: 4px solid var(--accent-color);
            box-shadow: 15px 15px 0px var(--secondary-color);
            max-height: 90vh;
            overflow-y: auto;
        }

        h1.title {
            font-size: 4rem;
            margin: 0 0 20px 0;
            text-transform: uppercase;
            letter-spacing: -5px;
            color: var(--accent-color);
            text-shadow: 4px 4px 0px #000;
        }

        .grid-menu {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 15px;
        }

        .menu-btn {
            background: transparent;
            border: 2px solid var(--accent-color);
            color: var(--accent-color);
            font-family: inherit;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 15px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.1s;
            width: 100%;
        }

        .menu-btn:hover {
            background: var(--accent-color);
            color: #000;
            transform: translate(-3px, -3px);
            box-shadow: 3px 3px 0px var(--secondary-color);
        }

        .menu-hi {
            display: block;
            margin-top: 6px;
            font-size: 0.7rem;
            letter-spacing: 0;
            font-weight: normal;
            opacity: 0.75;
            pointer-events: none;
        }

        .menu-controls {
            display: block;
            margin-top: 4px;
            font-size: 0.58rem;
            letter-spacing: 0;
            font-weight: normal;
            opacity: 0.5;
            pointer-events: none;
        }

        /* --- BOUTONS NAV --- */
        #back-btn, #mute-btn, #pause-btn {
            position: absolute;
            top: 20px;
            z-index: 20;
            background: #000;
            border: 2px solid var(--secondary-color);
            color: var(--secondary-color);
            padding: 10px 20px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
        }
        #back-btn { left: 20px; display: none; }
        #mute-btn { right: 20px; pointer-events: auto;}
        #pause-btn { right: 150px; display: none; }

        #back-btn:hover, #mute-btn:hover, #pause-btn:hover {
            background: var(--secondary-color);
            color: #000;
        }

        #pause-overlay {
            position: fixed;
            inset: 0;
            z-index: 15;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(5, 5, 5, 0.82);
            pointer-events: none;
        }

        #touch-controls {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 18;
            display: none;
            justify-content: space-between;
            align-items: flex-end;
            padding: 12px 18px;
            pointer-events: none;
        }

        #touch-dpad {
            position: relative;
            width: 150px;
            height: 150px;
            pointer-events: none;
        }

        .touch-btn {
            position: absolute;
            width: 48px;
            height: 48px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid var(--accent-color);
            color: var(--accent-color);
            font-family: inherit;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            touch-action: none;
            pointer-events: auto;
        }

        .touch-btn:active, .touch-btn.pressed {
            background: var(--accent-color);
            color: #000;
        }

        .touch-up { left: 51px; top: 0; }
        .touch-left { left: 0; top: 51px; }
        .touch-down { left: 51px; top: 102px; }
        .touch-right { left: 102px; top: 51px; }

        #touch-action-wrap {
            position: relative;
            width: 160px;
            height: 86px;
            pointer-events: none;
        }

        #touch-action {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 76px;
            height: 76px;
            border-radius: 50%;
            font-size: 0.85rem;
        }

        #touch-hold {
            position: absolute;
            right: 84px;
            bottom: 8px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            font-size: 0.7rem;
            display: none;
        }

        /* --- OVERLAYS JEU --- */
        #game-message {
            display: none;
            text-align: center;
        }
        .big-msg {
            font-size: 4rem;
            background: #000;
            padding: 20px;
            border: 2px solid var(--accent-color);
            margin-bottom: 20px;
        }
        .sub-msg {
            font-size: 1.5rem;
            background: var(--accent-color);
            color: #000;
            padding: 5px 10px;
            display: inline-block;
        }

        @media (max-width: 900px) {
            .grid-menu { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
        @media (max-width: 560px) {
            .grid-menu { grid-template-columns: 1fr; }
        }
        @media (prefers-reduced-motion: reduce) {
            .menu-btn { transition: none; }
            button:active { transform: none !important; }
        }

        .menu-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .menu-action {
            background: transparent;
            border: 2px solid var(--accent-color);
            color: var(--accent-color);
            font-family: inherit;
            font-weight: bold;
            font-size: 0.85rem;
            padding: 8px 12px;
            cursor: pointer;
        }
        .menu-action:hover, .menu-action:focus-visible { background: var(--accent-color); color: #000; }

        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 40;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(5, 5, 5, 0.88);
            pointer-events: auto;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            width: min(720px, 100%);
            max-height: 88vh;
            overflow-y: auto;
            background: #050505;
            border: 4px solid var(--accent-color);
            box-shadow: 12px 12px 0 var(--secondary-color);
            padding: 20px;
        }
        .modal.small { width: min(420px, 100%); }
        .modal-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            font-size: 1.5rem;
            font-weight: bold;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
            margin-bottom: 16px;
        }
        .modal-head button, .modal-body button {
            background: transparent;
            border: 2px solid var(--accent-color);
            color: var(--accent-color);
            font-family: inherit;
            font-weight: bold;
            padding: 8px 12px;
            cursor: pointer;
        }
        .modal-head button:hover, .modal-body button:hover { background: var(--accent-color); color: #000; }
        .modal-body { font-size: 0.9rem; line-height: 1.45; }
        .record-game { margin-bottom: 16px; }
        .record-game h3 { margin: 0 0 6px; font-size: 1rem; color: var(--secondary-color); }
        .record-row { display: flex; gap: 10px; align-items: baseline; font-size: 0.95rem; }
        .record-row .pos { width: 2ch; opacity: 0.6; }
        .record-row .initials { width: 5ch; font-weight: bold; }
        .record-row .score { margin-left: auto; font-weight: bold; }
        .record-row .date { opacity: 0.5; font-size: 0.75rem; }
        .stats-line { border: 2px solid #333; padding: 10px; margin-bottom: 16px; color: var(--secondary-color); }
        .ach-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .ach { border: 2px solid #333; padding: 8px; opacity: 0.45; }
        .ach.unlocked { opacity: 1; border-color: var(--accent-color); }
        .ach strong { display: block; font-size: 0.85rem; }
        .ach small { color: #aaa; }
        .setting { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid #222; }
        .setting input[type="range"] { width: 180px; accent-color: var(--accent-color); }
        .setting input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--accent-color); }
        .setting select, .modal-body input[type="text"] {
            background: #050505;
            color: var(--accent-color);
            border: 2px solid var(--accent-color);
            font-family: inherit;
            font-size: 1rem;
            padding: 6px 8px;
        }
        #initials-input { width: 100%; text-transform: uppercase; letter-spacing: 0.4em; font-size: 2rem; text-align: center; margin: 16px 0; }
        #initials-score { text-align: center; font-size: 1.2rem; color: var(--secondary-color); }
        #toast {
            position: fixed;
            left: 50%;
            bottom: 190px;
            transform: translateX(-50%) translateY(20px);
            z-index: 35;
            background: var(--accent-color);
            color: #000;
            font-weight: bold;
            padding: 10px 16px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s, transform 0.2s;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        #daily-badge {
            position: fixed;
            top: 26px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 19;
            background: var(--accent-color);
            color: #000;
            font-weight: bold;
            font-size: 0.8rem;
            padding: 6px 10px;
            display: none;
        }
        body.touch-small #touch-dpad { transform: scale(0.85); transform-origin: left bottom; }
        body.touch-small #touch-action-wrap { transform: scale(0.85); transform-origin: right bottom; }
        body.touch-large #touch-dpad { transform: scale(1.12); transform-origin: left bottom; }
        body.touch-large #touch-action-wrap { transform: scale(1.12); transform-origin: right bottom; }
        body.no-scanlines::after { display: none !important; }

        #debug-overlay {
            position: fixed;
            left: 12px;
            bottom: 12px;
            z-index: 60;
            display: none;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            font-family: 'Courier New', monospace;
            font-size: 11px;
            padding: 6px 8px;
            pointer-events: none;
            white-space: pre;
        }

        .choice-row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
        .choice {
            flex: 1;
            min-width: 90px;
            background: transparent;
            border: 2px solid #333;
            color: var(--accent-color);
            font-family: inherit;
            font-weight: bold;
            padding: 10px;
            cursor: pointer;
        }
        .choice:hover, .choice.selected { border-color: var(--accent-color); background: var(--accent-color); color: #000; }
        .start-btn {
            width: 100%;
            margin-top: 8px;
            background: var(--accent-color);
            border: none;
            color: #000;
            font-family: inherit;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 12px;
            cursor: pointer;
        }
        #pong-overlay.hide-difficulty #pong-difficulty-row { display: none; }
        @media (prefers-reduced-motion: reduce) { .choice, .start-btn, .menu-action { transition: none; } }
        body.reduced-motion .menu-btn, body.reduced-motion .menu-action, body.reduced-motion .touch-btn { transition: none; }
    </style>
</head>
<body>

    <!-- NAV UI -->
    <button id="back-btn" onclick="app.loadMenu()" data-i18n="terminal">← TERMINAL</button>
    <button id="pause-btn" onclick="app.togglePause()" aria-pressed="false">PAUSE</button>
    <button id="mute-btn" onclick="audio.toggleMute()" aria-pressed="false">AUDIO: ON</button>

    <!-- UI LAYER -->
    <div id="ui-layer">
        
        <!-- MENU PRINCIPAL -->
        <div id="main-menu">
            <h1 class="title">PLAY</h1>
            <div class="grid-menu">
                <button class="menu-btn" onmouseenter="audio.play('UI_HOVER')" onclick="app.openPongOptions()">PONG<span class="menu-hi" data-i18n="firstTo5">FIRST TO 5</span><span class="menu-controls" data-i18n="ctrl_pong">MOUSE / 2P KEYS</span></button>
                <button class="menu-btn" onmouseenter="audio.play('UI_HOVER')" onclick="app.launch('BREAKOUT')">BREAKOUT<span class="menu-hi" data-hi="BREAKOUT">HI 0</span><span class="menu-controls" data-i18n="ctrl_breakout">MOUSE + CLICK</span></button>
                <button class="menu-btn" onmouseenter="audio.play('UI_HOVER')" onclick="app.launch('SNAKE')">SNAKE<span class="menu-hi" data-hi="SNAKE">HI 0</span><span class="menu-controls" data-i18n="ctrl_snake">ARROWS / D-PAD</span></button>
                <button class="menu-btn" onmouseenter="audio.play('UI_HOVER')" onclick="app.launch('INVADERS')">INVADERS<span class="menu-hi" data-hi="INVADERS">HI 0</span><span class="menu-controls" data-i18n="ctrl_invaders">ARROWS + SPACE</span></button>
                <button class="menu-btn" onmouseenter="audio.play('UI_HOVER')" onclick="app.launch('TETRIS')">TETRIS<span class="menu-hi" data-hi="TETRIS">HI 0</span><span class="menu-controls" data-i18n="ctrl_tetris">ARROWS + SPACE + C</span></button>
                <button class="menu-btn" onmouseenter="audio.play('UI_HOVER')" onclick="app.launch('ASTEROIDS')">ASTEROIDS<span class="menu-hi" data-hi="ASTEROIDS">HI 0</span><span class="menu-controls" data-i18n="ctrl_asteroids">ARROWS + SPACE</span></button>
                <button class="menu-btn" onmouseenter="audio.play('UI_HOVER')" onclick="app.launch('MAZE')">NEON MAZE<span class="menu-hi" data-hi="MAZE">HI 0</span><span class="menu-controls" data-i18n="ctrl_maze">ARROWS / D-PAD</span></button>
                <button class="menu-btn" onmouseenter="audio.play('UI_HOVER')" onclick="app.launch('TRON')">TRON<span class="menu-hi" data-hi="TRON">HI 0</span><span class="menu-controls" data-i18n="ctrl_tron">A/D + LEFT/RIGHT</span></button>
                <button class="menu-btn" onmouseenter="audio.play('UI_HOVER')" onclick="app.launch('LUNAR')">LUNAR<span class="menu-hi" data-hi="LUNAR">HI 0</span><span class="menu-controls" data-i18n="ctrl_lunar">ARROWS + THRUST</span></button>
                <button class="menu-btn" onmouseenter="audio.play('UI_HOVER')" onclick="app.launch('ECHO')">ECHO<span class="menu-hi" data-hi="ECHO">HI 0</span><span class="menu-controls" data-i18n="ctrl_echo">TAP PADS / 1-4</span></button>
                <button class="menu-btn" onmouseenter="audio.play('UI_HOVER')" onclick="app.launch('DEFCON')">DEFCON<span class="menu-hi" data-hi="DEFCON">HI 0</span><span class="menu-controls" data-i18n="ctrl_defcon">CLICK TO INTERCEPT</span></button>
                <button class="menu-btn" onmouseenter="audio.play('UI_HOVER')" onclick="app.launch('HOPPER')">HOPPER<span class="menu-hi" data-hi="HOPPER">HI 0</span><span class="menu-controls" data-i18n="ctrl_hopper">ARROWS TO HOP</span></button>
            </div>
            <div class="menu-actions">
                <button class="menu-action" id="daily-btn" onclick="app.launchDaily()">DAILY</button>
                <button class="menu-action" onclick="app.openRecords()" data-i18n="records">RECORDS</button>
                <button class="menu-action" onclick="app.openSettings()" data-i18n="settings">SETTINGS</button>
            </div>
        </div>

        <!-- MESSAGES IN-GAME (Pause / Game Over) -->
        <div id="game-message" role="status" aria-live="polite">
            <div id="msg-title" class="big-msg">SYSTEM READY</div>
            <div id="msg-sub" class="sub-msg">CLICK TO START</div>
        </div>

        <div id="pause-overlay" role="dialog" aria-modal="true" aria-label="Pause">
            <div class="big-msg">PAUSED</div>
            <div class="sub-msg">PRESS P OR CLICK RESUME</div>
        </div>

        <div id="records-overlay" class="modal-overlay" role="dialog" aria-modal="true" aria-label="Records">
            <div class="modal">
                <div class="modal-head"><span data-i18n="records">RECORDS</span><button onclick="app.closeModal()" data-i18n="close">CLOSE</button></div>
                <div id="records-content" class="modal-body"></div>
            </div>
        </div>

        <div id="settings-overlay" class="modal-overlay" role="dialog" aria-modal="true" aria-label="Réglages">
            <div class="modal">
                <div class="modal-head"><span data-i18n="settings">SETTINGS</span><button onclick="app.closeModal()" data-i18n="close">CLOSE</button></div>
                <div class="modal-body">
                    <label class="setting"><span data-i18n="volume">VOLUME</span><input id="set-volume" type="range" min="0" max="100" step="5"></label>
                    <label class="setting"><span data-i18n="scanlines">SCANLINES</span><input id="set-scanlines" type="checkbox"></label>
                    <label class="setting"><span data-i18n="music">MUSIC</span><input id="set-music" type="checkbox"></label>
                    <label class="setting"><span data-i18n="haptics">HAPTICS</span><input id="set-haptics" type="checkbox"></label>
                    <label class="setting"><span data-i18n="reduced">REDUCED MOTION</span><input id="set-reduced" type="checkbox"></label>
                    <label class="setting"><span data-i18n="touchSize">TOUCH SIZE</span>
                        <select id="set-touch"><option value="sm" data-i18n="small">SMALL</option><option value="md" data-i18n="medium">MEDIUM</option><option value="lg" data-i18n="large">LARGE</option></select>
                    </label>
                    <label class="setting"><span data-i18n="language">LANGUAGE</span>
                        <select id="set-lang"><option value="en" data-i18n="english">EN</option><option value="fr" data-i18n="french">FR</option></select>
                    </label>
                </div>
            </div>
        </div>

        <div id="pong-overlay" class="modal-overlay" role="dialog" aria-modal="true" aria-label="Pong">
            <div class="modal small">
                <div class="modal-head"><span>PONG</span><button onclick="app.closeModal()" data-i18n="close">CLOSE</button></div>
                <div class="modal-body">
                    <div class="choice-row">
                        <button class="choice selected" data-pong-mode="1" onclick="app.setPongMode(1)" data-i18n="onePlayer">1 PLAYER</button>
                        <button class="choice" data-pong-mode="2" onclick="app.setPongMode(2)" data-i18n="twoPlayers">2 PLAYERS</button>
                    </div>
                    <div class="choice-row" id="pong-difficulty-row">
                        <button class="choice" data-pong-diff="easy" onclick="app.setPongDifficulty('easy')" data-i18n="easy">EASY</button>
                        <button class="choice selected" data-pong-diff="normal" onclick="app.setPongDifficulty('normal')" data-i18n="normal">NORMAL</button>
                        <button class="choice" data-pong-diff="hard" onclick="app.setPongDifficulty('hard')" data-i18n="hard">HARD</button>
                    </div>
                    <button class="start-btn" onclick="app.startPong()" data-i18n="start">START</button>
                </div>
            </div>
        </div>

        <div id="initials-overlay" class="modal-overlay" role="dialog" aria-modal="true" aria-label="Nouveau record">
            <div class="modal small">
                <div class="modal-head"><span id="initials-title">NEW RECORD</span><button onclick="app.closeModal()" data-i18n="close">CLOSE</button></div>
                <div class="modal-body">
                    <div id="initials-score"></div>
                    <input id="initials-input" type="text" maxlength="3" autocomplete="off" spellcheck="false" aria-label="Initiales 3 lettres" placeholder="AAA">
                    <button onclick="app.saveInitials()" data-i18n="save">SAVE</button>
                </div>
            </div>
        </div>

        <div id="toast" role="status" aria-live="polite"></div>
        <div id="daily-badge">DAILY</div>

    </div>

    <div id="touch-controls">
        <div id="touch-dpad">
            <button class="touch-btn touch-up" data-key="ArrowUp" aria-label="Haut">▲</button>
            <button class="touch-btn touch-left" data-key="ArrowLeft" aria-label="Gauche">◀</button>
            <button class="touch-btn touch-down" data-key="ArrowDown" aria-label="Bas">▼</button>
            <button class="touch-btn touch-right" data-key="ArrowRight" aria-label="Droite">▶</button>
        </div>
        <div id="touch-action-wrap">
            <button id="touch-hold" class="touch-btn" data-key="c" aria-label="Hold">HOLD</button>
            <button id="touch-action" class="touch-btn" data-key=" " aria-label="Action">FIRE</button>
        </div>
    </div>

    <div id="debug-overlay" aria-hidden="true"></div>

    <canvas id="gameCanvas" aria-label="Zone de jeu de la borne arcade">Votre navigateur ne supporte pas canvas.</canvas>

<script>
/**
 * PLAY // UNIFIED HUB v4
 * Engines: PONG, BREAKOUT, SNAKE, INVADERS, TETRIS, ASTEROIDS
 * Features: High Score, Procedural Audio
 */

const CONSTANTS = {
    COLOR_BG: '#050505',
    COLOR_FG: '#CCFF00', 
    COLOR_HARD: '#FFFFFF',
    SHAKE_DECAY: 0.9,
    GLITCH_CHANCE: 0.015
};

let REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// --- SYSTÈME AUDIO PROCÉDURAL ---
class AudioController {
    constructor() {
        this.ctx = null;
        this.muted = false;
        this.masterGain = null;
        this.volume = 0.3;
        this.musicOn = true;
        this.musicTimer = null;
        this.musicStep = 0;
        try { this.muted = localStorage.getItem('PLAY_MUTED') === '1'; } catch (e) {}
        try { this.musicOn = localStorage.getItem('PLAY_MUSIC') !== '0'; } catch (e) {}
        const btn = document.getElementById('mute-btn');
        if (btn) {
            btn.innerText = this.muted ? 'AUDIO: OFF' : 'AUDIO: ON';
            btn.setAttribute('aria-pressed', String(this.muted));
        }
    }

    init() {
        if (!this.ctx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioContext();
            this.masterGain = this.ctx.createGain();
            this.masterGain.gain.value = this.volume;
            this.masterGain.connect(this.ctx.destination);
        }
        if (this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
        this.startMusic();
    }

    setVolume(value) {
        this.volume = Math.max(0, Math.min(1, Number(value) || 0));
        if (this.masterGain) this.masterGain.gain.value = this.volume;
    }

    setMusic(on) {
        this.musicOn = !!on;
        try { localStorage.setItem('PLAY_MUSIC', this.musicOn ? '1' : '0'); } catch (e) {}
        if (this.musicOn) this.startMusic();
        else this.stopMusic();
    }

    startMusic() {
        if (!this.ctx || this.musicTimer || !this.musicOn) return;
        this.musicTimer = setInterval(() => this.playMusicStep(), 300);
    }

    stopMusic() {
        if (this.musicTimer) clearInterval(this.musicTimer);
        this.musicTimer = null;
    }

    playMusicStep() {
        if (!this.ctx || this.muted || !this.musicOn) return;
        const bass = [110, 0, 130.81, 0, 98, 0, 87.31, 0, 110, 0, 146.83, 0, 130.81, 0, 98, 0];
        const note = bass[this.musicStep++ % bass.length];
        if (!note) return;
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(note, t);
        gain.gain.setValueAtTime(0.03, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start(t);
        osc.stop(t + 0.3);
    }

    tone(freq, duration = 0.22, type = 'sine') {
        if (this.muted || !this.ctx) return;
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(0.09, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start(t);
        osc.stop(t + duration);
    }

    toggleMute() {
        this.muted = !this.muted;
        try { localStorage.setItem('PLAY_MUTED', this.muted ? '1' : '0'); } catch (e) {}
        if (window.app) window.app.updateMuteLabel();
        if(this.ctx) {
            if(this.muted) this.masterGain.disconnect();
            else this.masterGain.connect(this.ctx.destination);
        }
    }

    // Générateur de sons synthétiques
    play(type) {
        if (this.muted || !this.ctx) return;
        this.init(); // Ensure context is ready

        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.masterGain);

        switch (type) {
            case 'UI_HOVER':
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(880, t);
                osc.frequency.exponentialRampToValueAtTime(1760, t + 0.05);
                gain.gain.setValueAtTime(0.05, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
                osc.start(t);
                osc.stop(t + 0.05);
                break;

            case 'UI_CLICK':
                osc.type = 'square';
                osc.frequency.setValueAtTime(440, t);
                osc.frequency.exponentialRampToValueAtTime(110, t + 0.1);
                gain.gain.setValueAtTime(0.1, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
                osc.start(t);
                osc.stop(t + 0.1);
                break;

            case 'SHOOT': // Laser rapide
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(880, t);
                osc.frequency.exponentialRampToValueAtTime(110, t + 0.2);
                gain.gain.setValueAtTime(0.1, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
                osc.start(t);
                osc.stop(t + 0.2);
                break;

            case 'HIT': // Rebond sec
                osc.type = 'square';
                osc.frequency.setValueAtTime(220, t);
                osc.frequency.linearRampToValueAtTime(100, t + 0.05);
                gain.gain.setValueAtTime(0.1, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
                osc.start(t);
                osc.stop(t + 0.05);
                break;
            
            case 'WALL': // Rebond mur (plus haut)
                osc.type = 'square';
                osc.frequency.setValueAtTime(440, t);
                gain.gain.setValueAtTime(0.05, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
                osc.start(t);
                osc.stop(t + 0.05);
                break;

            case 'POWERUP': // Arpège montant
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, t);
                osc.frequency.setValueAtTime(554, t + 0.1);
                osc.frequency.setValueAtTime(659, t + 0.2);
                gain.gain.setValueAtTime(0.1, t);
                gain.gain.linearRampToValueAtTime(0, t + 0.4);
                osc.start(t);
                osc.stop(t + 0.4);
                break;

            case 'SCORE': // Gain de point / ligne
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, t);
                osc.frequency.setValueAtTime(1760, t + 0.1);
                gain.gain.setValueAtTime(0.1, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
                osc.start(t);
                osc.stop(t + 0.3);
                break;
            
            case 'GAMEOVER': // Descente triste
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, t);
                osc.frequency.linearRampToValueAtTime(55, t + 1);
                gain.gain.setValueAtTime(0.2, t);
                gain.gain.linearRampToValueAtTime(0, t + 1);
                osc.start(t);
                osc.stop(t + 1);
                break;

            case 'BAD': // Malus
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(160, t);
                osc.frequency.exponentialRampToValueAtTime(60, t + 0.25);
                gain.gain.setValueAtTime(0.15, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
                osc.start(t);
                osc.stop(t + 0.25);
                break;

            default:
                osc.disconnect();
                gain.disconnect();
                return;
        }
    }

    // Générateur de Bruit (Explosions)
    playNoise(duration = 0.2, volume = 0.2) {
        if (this.muted || !this.ctx) return;
        this.init();

        const bufferSize = this.ctx.sampleRate * duration;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }

        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        
        // Filtre Lowpass pour assourdir l'explosion
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 1000;

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(volume, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
        
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.masterGain);
        noise.start();
    }
}

// --- SYSTÈME D'INPUT GLOBAL ---
class InputSystem {
    constructor() {
        this.x = window.innerWidth / 2;
        this.y = window.innerHeight / 2;
        this.lastArrow = null; 
        this.keys = {}; 
        this.pressed = {};
        
        document.addEventListener('mousemove', (e) => {
            this.x = e.clientX;
            this.y = e.clientY;
        });
        document.addEventListener('touchmove', (e) => {
            this.x = e.touches[0].clientX;
            this.y = e.touches[0].clientY;
            if (app.currentGame && !app.paused) e.preventDefault();
        }, { passive: false });

        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
            if (app.modalOpen) {
                if (!e.repeat && e.key === 'Escape') { e.preventDefault(); app.closeModal(); }
                return;
            }
            if (!e.repeat && (e.key === 'p' || e.key === 'P' || e.key === 'Escape') && app.currentGame) {
                e.preventDefault();
                app.togglePause();
                return;
            }
            if (!this.keys[e.key]) this.pressed[e.key] = performance.now();
            this.keys[e.key] = true;
            if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight', ' '].includes(e.key)) {
                this.lastArrow = e.key;
            }
        });
        document.addEventListener('keyup', (e) => {
            this.keys[e.key] = false;
        });

        // Relâcher les touches si la fenêtre perd le focus (évite les touches "collées")
        const releaseKeys = () => this.reset();
        window.addEventListener('blur', releaseKeys);
        document.addEventListener('visibilitychange', () => { if (document.hidden) releaseKeys(); });

        document.addEventListener('click', (e) => {
            // Initialisation audio sur première interaction utilisateur
            audio.init(); 
            
            if(e.target.closest && e.target.closest('button')) return;
            if (app.modalOpen || app.paused) return;
            this.x = e.clientX;
            this.y = e.clientY;
            if (app.currentGame && app.currentGame.handleClick) {
                app.currentGame.handleClick();
            }
        });
    }

    reset() {
        this.keys = {};
        this.lastArrow = null;
        this.pressed = {};
    }

    press(key) {
        if (!this.keys[key]) this.pressed[key] = performance.now();
        this.keys[key] = true;
        if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(key)) this.lastArrow = key;
    }

    release(key) {
        this.keys[key] = false;
    }

    consumeArrow() {
        const k = this.lastArrow;
        this.lastArrow = null;
        return k;
    }

    // Consomme un appui bref même s'il a eu lieu entre deux frames.
    consumePressed(key) {
        const t = this.pressed[key];
        delete this.pressed[key];
        return t !== undefined && (performance.now() - t) < 200;
    }

    consumeAny(keys) {
        let hit = false;
        for (const key of keys) {
            if (this.consumePressed(key)) hit = true;
        }
        return hit;
    }
}

// --- SYSTÈME DE PARTICULES PARTAGÉ ---
class Particle {
    constructor(x, y, color, speedScale = 1) {
        this.x = x;
        this.y = y;
        this.size = Math.random() * 6 + 2; 
        const angle = Math.random() * Math.PI * 2;
        const speed = (Math.random() * 4 + 1) * speedScale;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.life = 1.0;
        this.decay = Math.random() * 0.03 + 0.01;
        this.color = color;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= this.decay;
    }
    draw(ctx) {
        ctx.save();
        ctx.fillStyle = this.color;
        ctx.globalAlpha = this.life;
        ctx.fillRect(this.x, this.y, this.size, this.size);
        ctx.restore();
    }
}

function spawnCellBurst(engine, cx, cy, color, count = 8) {
    const cell = engine.cell || 20;
    const ox = engine.offsetX || 0;
    const oy = engine.offsetY || 0;
    for (let i = 0; i < count; i++) {
        engine.particles.push(new Particle(ox + (cx + 0.5) * cell, oy + (cy + 0.5) * cell, color));
    }
}

function canvasPoint(canvas) {
    const rect = canvas.getBoundingClientRect();
    return {
        x: (app.input.x - rect.left) / rect.width * canvas.width,
        y: (app.input.y - rect.top) / rect.height * canvas.height
    };
}

function applyShake(ctx, engine) {
    if (engine.shake <= 0 || REDUCED_MOTION) return;
    const t = performance.now();
    ctx.translate(Math.sin(t / 18) * engine.shake, Math.cos(t / 23) * engine.shake);
}

function hudFont(width, max = 24) {
    return Math.max(13, Math.min(max, Math.round(width * 0.027)));
}

// ==========================================
// ENGINE 1: PONG
// ==========================================
class PongEngine {
    constructor(canvas, ctx, options = {}) {
        this.canvas = canvas;
        this.ctx = ctx;
        this.active = false;
        this.paddleH = 120;
        this.paddleW = 20;
        this.ballSize = 16;
        this.twoPlayer = !!options.twoPlayer;
        this.difficulty = options.difficulty || 'normal';
        const ai = { easy: { max: 6, blunder: 0.16 }, normal: { max: 9, blunder: 0.08 }, hard: { max: 12, blunder: 0.03 } }[this.difficulty] || { max: 9, blunder: 0.08 };
        this.aiMaxSpeed = ai.max;
        this.aiBlunderBase = ai.blunder;
        this.paddleSpeed = 9;
        this.aiError = 0;
        this.reset();
    }

    reset() {
        this.p1 = { y: this.canvas.height/2, score: 0 };
        this.ai = { y: this.canvas.height/2, score: 0 };
        this.ball = { x: this.canvas.width/2, y: this.canvas.height/2, vx: 0, vy: 0, speed: 0 };
        this.resetBall();
        this.particles = [];
        this.shake = 0;
        this.state = 'WAITING';
        this.winner = null;
        app.showGameMessage(this.twoPlayer ? "PONG // 2P" : "PONG", this.twoPlayer ? "P1: W/S // P2: ARROWS" : "CLICK TO START");
    }

    resetBall() {
        this.ball.x = this.canvas.width / 2;
        this.ball.y = this.canvas.height / 2;
        this.ball.speed = 8;
        const angle = (Math.random() * Math.PI / 4) - (Math.PI / 8); 
        const dirX = Math.random() < 0.5 ? 1 : -1;
        this.ball.vx = Math.cos(angle) * this.ball.speed * dirX;
        this.ball.vy = Math.sin(angle) * this.ball.speed;
        this.ball.edgeTimer = 0;
        this.aiError = 0;
    }

    onResize(oldW, oldH, newW, newH) {
        const sx = newW / oldW, sy = newH / oldH;
        this.p1.y *= sy;
        this.ai.y *= sy;
        this.ball.x *= sx;
        this.ball.y *= sy;
        this.ball.edgeTimer = 0;
        [this.p1, this.ai].forEach(p => p.y = Math.max(0, Math.min(newH - this.paddleH, p.y)));
        this.ball.y = Math.max(0, Math.min(newH - this.ballSize, this.ball.y));
    }

    handleClick() {
        if (this.state === 'WAITING') {
            this.state = 'PLAYING';
            app.hideGameMessage();
            audio.play('UI_CLICK');
        } else if (this.state === 'END') {
            this.reset();
        }
    }

    update() {
        // Les FX continuent de vivre même en pause ou après la fin de partie.
        this.particles.forEach(p => p.update());
        this.particles = this.particles.filter(p => p.life > 0);
        if(this.shake > 0) this.shake *= 0.9;
        if (this.state !== 'PLAYING') return;
        const keys = app.input.keys;
        if (this.twoPlayer) {
            const s = this.paddleSpeed;
            this.p1.y += ((keys['w'] || keys['W']) ? -s : 0) + ((keys['s'] || keys['S']) ? s : 0);
            this.ai.y += (keys['ArrowUp'] ? -s : 0) + (keys['ArrowDown'] ? s : 0);
        } else {
            this.p1.y = app.input.y - this.paddleH/2;
            let target = this.ball.y - this.paddleH/2;
            if (Math.abs(this.ball.x - (this.canvas.width - 50)) > this.canvas.width * 0.6) {
                target = this.canvas.height / 2;
            } else {
                target += this.aiError;
            }
            let aiDelta = (target - this.ai.y) * 0.08;
            aiDelta = Math.max(-this.aiMaxSpeed, Math.min(this.aiMaxSpeed, aiDelta));
            this.ai.y += aiDelta;
        }
        [this.p1, this.ai].forEach(p => {
            if(p.y < 0) p.y = 0;
            if(p.y + this.paddleH > this.canvas.height) p.y = this.canvas.height - this.paddleH;
        });
        this.ball.x += this.ball.vx;
        this.ball.y += this.ball.vy;
        if (this.ball.y <= 0) {
            this.ball.y = 0;
            if (this.ball.vy < 0) {
                this.ball.vy *= -1;
                this.shake = 10;
                audio.play('WALL');
            }
        } else if (this.ball.y + this.ballSize >= this.canvas.height) {
            this.ball.y = this.canvas.height - this.ballSize;
            if (this.ball.vy > 0) {
                this.ball.vy *= -1;
                this.shake = 10;
                audio.play('WALL');
            }
        }
        if (this.ball.y <= 2 || this.ball.y + this.ballSize >= this.canvas.height - 2) {
            this.ball.edgeTimer = (this.ball.edgeTimer || 0) + 1;
            if (this.ball.edgeTimer > 90) {
                if (this.ball.y <= 2 && Math.abs(this.ball.vy) < 1) this.ball.vy = 2;
                if (this.ball.y + this.ballSize >= this.canvas.height - 2 && Math.abs(this.ball.vy) < 1) this.ball.vy = -2;
                this.ball.edgeTimer = 0;
            }
        } else {
            this.ball.edgeTimer = 0;
        }
        const checkPaddle = (p, x) => {
            return (this.ball.y + this.ballSize > p.y && this.ball.y < p.y + this.paddleH && Math.abs(this.ball.x - x) < this.paddleW + 10);
        };
        if (this.ball.vx < 0 && this.ball.x < 50 + this.paddleW && checkPaddle(this.p1, 50)) {
            if (!this.twoPlayer) {
                this.aiError = (Math.random() - 0.5) * (16 + this.ball.speed * 2.5);
                const blunderChance = this.aiBlunderBase + Math.max(0, this.ball.speed - 8) * 0.006;
                if (Math.random() < blunderChance) {
                    this.aiError += (Math.random() < 0.5 ? -1 : 1) * (this.paddleH * 0.9 + Math.random() * this.paddleH * 0.8);
                }
            }
            this.bounceBall(this.p1, 1);
            this.shake = 15; this.spawnParticles(this.ball.x, this.ball.y, CONSTANTS.COLOR_FG);
            app.vibrate(6);
            audio.play('HIT');
        }
        if (this.ball.vx > 0 && this.ball.x > this.canvas.width - 50 - this.paddleW && checkPaddle(this.ai, this.canvas.width - 50 - this.paddleW)) {
            this.bounceBall(this.ai, -1);
            this.shake = 15; this.spawnParticles(this.ball.x, this.ball.y, CONSTANTS.COLOR_HARD);
            audio.play('HIT');
        }
        if (this.ball.x < 0) { this.ai.score++; this.checkWin(); this.resetBall(); this.shake = 30; app.vibrate(25); audio.playNoise(0.4, 0.25); }
        else if (this.ball.x > this.canvas.width) { this.p1.score++; this.checkWin(); this.resetBall(); this.shake = 30; app.vibrate(25); audio.play('SCORE'); }
    }

    bounceBall(paddle, dirX) {
        let hit = (this.ball.y + this.ballSize/2) - (paddle.y + this.paddleH/2);
        let norm = Math.max(-1, Math.min(1, hit / (this.paddleH/2)));
        if(Math.abs(norm) < 0.15) norm = (Math.random() < 0.5 ? -1 : 1) * (0.15 + Math.random() * 0.2);
        const angle = norm * (Math.PI/4);
        this.ball.speed = Math.min(this.ball.speed + 0.5, 20);
        this.ball.vx = dirX * this.ball.speed * Math.cos(angle);
        this.ball.vy = this.ball.speed * Math.sin(angle);
    }

    checkWin() {
        if (this.p1.score >= 5 || this.ai.score >= 5) {
            this.state = 'END';
            this.winner = this.p1.score >= 5 ? (this.twoPlayer ? 'P1' : 'PLAYER') : (this.twoPlayer ? 'P2' : 'CPU');
            if (this.p1.score >= 5) app.recordPongWin();
            app.showGameMessage(this.winner + " WINS", "CLICK TO RESET");
            audio.play('GAMEOVER');
        }
    }

    spawnParticles(x, y, c) { for(let i=0; i<10; i++) this.particles.push(new Particle(x, y, c)); }

    draw() {
        this.ctx.fillStyle = CONSTANTS.COLOR_BG;
        this.ctx.fillRect(0,0, this.canvas.width, this.canvas.height);
        this.ctx.save();
        if(this.shake > 0 && !REDUCED_MOTION) { this.ctx.translate((Math.random()-0.5)*this.shake, (Math.random()-0.5)*this.shake); }
        this.ctx.font = "bold 30vh 'Courier New'";
        this.ctx.textAlign = 'center';
        this.ctx.textBaseline = 'middle';
        this.ctx.fillStyle = '#111';
        this.ctx.fillText(this.p1.score, this.canvas.width*0.25, this.canvas.height/2);
        this.ctx.fillText(this.ai.score, this.canvas.width*0.75, this.canvas.height/2);
        this.ctx.strokeStyle = '#111';
        this.ctx.lineWidth = 10;
        this.ctx.beginPath(); this.ctx.moveTo(this.canvas.width/2, 0); this.ctx.lineTo(this.canvas.width/2, this.canvas.height); this.ctx.stroke();
        this.ctx.fillStyle = CONSTANTS.COLOR_FG;
        this.ctx.fillRect(50, this.p1.y, this.paddleW, this.paddleH);
        this.ctx.fillStyle = CONSTANTS.COLOR_HARD;
        this.ctx.fillRect(this.canvas.width - 50 - this.paddleW, this.ai.y, this.paddleW, this.paddleH);
        this.ctx.fillStyle = CONSTANTS.COLOR_FG;
        this.ctx.fillRect(this.ball.x, this.ball.y, this.ballSize, this.ballSize);
        this.particles.forEach(p => p.draw(this.ctx));
        this.ctx.restore();
    }
}

function mulberry32(seed) {
    let a = seed >>> 0;
    return function() {
        a = (a + 0x6D2B79F5) >>> 0;
        let t = a;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
}

class BreakoutEngine {
    constructor(canvas, ctx) {
        this.canvas = canvas;
        this.ctx = ctx;
        this.paddleH = 20;
        this.ballSize = 16;
        this.powerupW = 64;
        this.powerupH = 24;
        this.maxLives = 5;
        this.resetGame();
    }

    resetGame() {
        this.score = 0;
        this.lives = 3;
        this.particles = [];
        this.shake = 0;
        this.clearTimer = 0;
        this.startLevel(1);
    }

    levelConfig(level) {
        if (level <= BREAKOUT_LEVELS.length) return BREAKOUT_LEVELS[level - 1];
        const extra = level - BREAKOUT_LEVELS.length;
        const patterns = ['checker', 'pyramid', 'columns', 'diamond', 'full'];
        return {
            rows: 4,
            cols: Math.min(16, 12 + (extra % 3)),
            hard: Math.min(0.72, 0.48 + extra * 0.03),
            ball: Math.min(13, 10.6 + extra * 0.15),
            maxBall: Math.min(18, 16.2 + extra * 0.2),
            paddle: Math.max(90, 128 - extra * 3),
            power: 0.14,
            pattern: patterns[extra % patterns.length]
        };
    }

    isPatternGap(pattern, r, c) {
        const mid = (this.cols - 1) / 2;
        if (pattern === 'checker') return (r + c) % 2 === 1;
        if (pattern === 'pyramid') return Math.abs(c - mid) > (r + 1) * this.cols / (this.rows * 2);
        if (pattern === 'columns') return c % 4 === 1;
        if (pattern === 'diamond') {
            const midRow = (this.rows - 1) / 2;
            return Math.abs(c - mid) / (this.cols * 0.55) + Math.abs(r - midRow) / (this.rows * 0.75) > 1;
        }
        return false;
    }

    startLevel(level) {
        this.level = level;
        const cfg = this.levelConfig(level);
        this.rows = cfg.rows;
        this.cols = Math.max(8, Math.min(cfg.cols, Math.floor(this.canvas.width / 64)));
        this.hardChance = cfg.hard;
        this.ballSpeed = cfg.ball;
        this.maxBallSpeed = cfg.maxBall;
        this.speedFactor = 1;
        this.basePaddleW = Math.max(40, Math.min(cfg.paddle, this.canvas.width - 32));
        this.paddleW = this.basePaddleW;
        this.powerupChance = cfg.power;
        this.brickScore = 10 + (level - 1) * 5;
        this.bricksDestroyed = 0;
        this.finishBoost = false;
        this.growTimer = 0;
        this.shrinkTimer = 0;
        this.fastTimer = 0;
        this.slowTimer = 0;
        this.rockets = 0;
        this.projectiles = [];
        this.fireballs = [];
        this.bricks = [];
        this.balls = [];
        this.powerups = [];
        this.shake = 0;
        this.clearTimer = 0;
        this.state = 'WAITING';
        this.paddle = { x: this.canvas.width/2 - this.paddleW/2, y: this.canvas.height - 60 };

        const gap = 4;
        const w = (this.canvas.width - (this.cols + 1) * gap) / this.cols;
        for (let r = 0; r < this.rows; r++) {
            for (let c = 0; c < this.cols; c++) {
                if (this.isPatternGap(cfg.pattern, r, c)) continue;
                const isHard = Math.random() < this.hardChance;
                this.bricks.push({ x: gap + c * (w + gap), y: 108 + r * 34, w: w, h: 30, hp: isHard ? 2 : 1, maxHp: isHard ? 2 : 1, active: true });
            }
        }
        const bonusLabel = level > BREAKOUT_LEVELS.length ? "ENDLESS " + (level - BREAKOUT_LEVELS.length) : "LEVEL " + level;
        app.showGameMessage(bonusLabel, level === 2 ? "CLICK TO LAUNCH // WHITE = 2 HITS" : "CLICK TO LAUNCH");
    }

    onResize(oldW, oldH, newW, newH) {
        const sx = newW / oldW, sy = newH / oldH;
        this.bricks.forEach(b => { b.x *= sx; b.w *= sx; });
        this.balls.forEach(b => { b.x *= sx; b.y *= sy; b.stuckTimer = 0; b.edgeTimer = 0; });
        this.powerups.forEach(p => { p.x *= sx; p.y *= sy; });
        this.projectiles.forEach(p => { p.x *= sx; p.y *= sy; });
        this.fireballs.forEach(f => { f.x *= sx; f.y *= sy; });
        this.paddle.x *= sx;
        this.basePaddleW = Math.max(40, Math.min(this.basePaddleW, newW - 32));
        this.applyPaddleWidth();
        this.paddle.y = newH - 60;
        this.paddle.x = Math.max(0, Math.min(newW - this.paddleW, this.paddle.x));
    }

    spawnBall() {
        const a = (Math.random() - 0.5) * (Math.PI / 4);
        const speed = this.ballSpeed * this.speedFactor;
        this.balls.push({ x: this.paddle.x + this.paddleW/2, y: this.paddle.y - 40, vx: Math.sin(a) * speed, vy: -Math.cos(a) * speed, active: true });
        audio.play('SHOOT');
    }

    addBall(angle) {
        const speed = this.ballSpeed * this.speedFactor;
        this.balls.push({ x: this.paddle.x + this.paddleW/2, y: this.paddle.y - 40, vx: Math.sin(angle) * speed, vy: -Math.cos(angle) * speed, active: true });
    }

    handleClick() {
        if (this.state === 'WAITING') {
            this.state = 'PLAYING';
            this.spawnBall();
            app.hideGameMessage();
        } else if (this.state === 'PLAYING') {
            this.fireRocket();
        } else if (this.state === 'LEVEL_CLEAR') {
            this.advanceLevel();
        } else if (this.state === 'GAMEOVER' || this.state === 'VICTORY') {
            this.resetGame();
        }
    }

    levelClear() {
        this.state = 'LEVEL_CLEAR';
        this.balls = [];
        this.powerups = [];
        this.projectiles = [];
        this.fireballs = [];
        this.shake = 10;
        const bonus = 100 * this.level;
        this.score += bonus;
        this.clearTimer = 90;
        app.showGameMessage("LEVEL " + this.level + " CLEAR", "BONUS +" + bonus);
        app.vibrate(30);
        audio.play('POWERUP');
    }

    advanceLevel() {
        if (this.level === BREAKOUT_LEVELS.length) app.unlock('BREAKOUT_CLEAR');
        this.startLevel(this.level + 1);
    }

    pickPowerupType() {
        const table = this.level >= 2 ? BREAKOUT_DROPS.concat(BREAKOUT_MALUSES) : BREAKOUT_DROPS;
        const total = table.reduce((sum, [, weight]) => sum + weight, 0);
        let roll = Math.random() * total;
        for (const [type, weight] of table) {
            roll -= weight;
            if (roll <= 0) return (type === 'LIFE' && this.lives >= this.maxLives) ? 'MULTI' : type;
        }
        return 'MULTI';
    }

    applyPaddleWidth() {
        const mod = (this.growTimer > 0 ? 1.4 : 1) * (this.shrinkTimer > 0 ? 0.7 : 1);
        this.paddleW = Math.max(70, Math.min(this.canvas.width - 20, this.basePaddleW * mod));
    }

    applySpeedFactor() {
        const target = (this.fastTimer > 0 ? 1.3 : 1) * (this.slowTimer > 0 ? 0.65 : 1);
        if (Math.abs(target - this.speedFactor) < 0.001) return;
        const ratio = target / this.speedFactor;
        this.balls.forEach(ball => { ball.vx *= ratio; ball.vy *= ratio; });
        this.speedFactor = target;
    }

    fireRocket() {
        if (this.rockets <= 0) return;
        this.rockets--;
        this.projectiles.push({ x: this.paddle.x + this.paddleW/2, y: this.paddle.y - 12, vy: -14 });
        audio.play('SHOOT');
    }

    launchFireball() {
        this.fireballs.push({ x: this.paddle.x + this.paddleW/2, y: this.paddle.y - 16, vy: -16, r: 14 });
        audio.play('SHOOT');
    }

    destroyBrick(brick, allowDrop = true) {
        if(!brick.active) return;
        brick.active = false;
        brick.hp = 0;
        this.score += this.brickScore;
        this.bricksDestroyed++;
        if(allowDrop) {
            let dropType = null;
            if(this.level === 1 && this.bricksDestroyed === 3) dropType = 'MULTI';
            else if(Math.random() < this.powerupChance) dropType = this.pickPowerupType();
            if(dropType) {
                const px = Math.max(4, Math.min(this.canvas.width - this.powerupW - 4, brick.x + brick.w/2 - this.powerupW/2));
                this.powerups.push({ x: px, y: brick.y, type: dropType, active: true });
                audio.play('UI_HOVER');
            }
        }
    }

    hitBrick(brick) {
        brick.hp--;
        if(brick.hp <= 0) {
            this.destroyBrick(brick);
            audio.play('HIT');
        } else {
            audio.play('WALL');
        }
        this.shake = 5;
        this.spawnParticles(brick.x + brick.w/2, brick.y + brick.h/2, brick.hp > 0 ? CONSTANTS.COLOR_HARD : CONSTANTS.COLOR_FG);
    }

    explodeRocket(x, y) {
        const radius = 75;
        for(const brick of this.bricks) {
            if(!brick.active) continue;
            const cx = brick.x + brick.w/2, cy = brick.y + brick.h/2;
            if(Math.hypot(cx - x, cy - y) < radius + Math.max(brick.w, brick.h) / 2) {
                this.destroyBrick(brick, false);
            }
        }
        this.spawnParticles(x, y, '#FFD400');
        this.shake = 20;
        audio.playNoise(0.3, 0.25);
    }

    update() {
        this.particles.forEach(p => p.update()); this.particles = this.particles.filter(p => p.life > 0);
        if(this.shake > 0) this.shake *= 0.9;

        if (this.state === 'LEVEL_CLEAR') {
            if (--this.clearTimer <= 0) this.advanceLevel();
            return;
        }

        if (this.state === 'WAITING' || this.state === 'PLAYING') {
            let targetX = app.input.x - this.paddleW/2;
            this.paddle.x += (targetX - this.paddle.x) * 0.6;
            if(this.paddle.x < 0) this.paddle.x = 0;
            if(this.paddle.x + this.paddleW > this.canvas.width) this.paddle.x = this.canvas.width - this.paddleW;
        }
        if (this.state !== 'PLAYING') return;

        if(this.growTimer > 0 && --this.growTimer === 0) this.applyPaddleWidth();
        if(this.shrinkTimer > 0 && --this.shrinkTimer === 0) this.applyPaddleWidth();
        if(this.fastTimer > 0) this.fastTimer--;
        if(this.slowTimer > 0) this.slowTimer--;
        this.applySpeedFactor();

        for(let i=this.balls.length-1; i>=0; i--) {
            let b = this.balls[i];
            b.x += b.vx; b.y += b.vy;
            if(b.x <= 0) {
                b.x = 0;
                if(b.vx < 0) { b.vx *= -1; audio.play('WALL'); }
            } else if(b.x + this.ballSize >= this.canvas.width) {
                b.x = this.canvas.width - this.ballSize;
                if(b.vx > 0) { b.vx *= -1; audio.play('WALL'); }
            }
            if(b.y <= 0) {
                b.y = 0;
                if(b.vy < 0) { b.vy *= -1; audio.play('WALL'); }
            }
            if(b.y > this.canvas.height) { this.balls.splice(i, 1); continue; }
            if(b.y+this.ballSize >= this.paddle.y && b.y <= this.paddle.y+this.paddleH && b.x+this.ballSize >= this.paddle.x && b.x <= this.paddle.x+this.paddleW && b.vy > 0) {
                let hit = (b.x + this.ballSize/2) - (this.paddle.x + this.paddleW/2);
                let angle = (hit / (this.paddleW/2)) * (Math.PI/3);
                if(Math.abs(angle) < 0.18) angle = (Math.random() < 0.5 ? -1 : 1) * 0.18;
                let speed = Math.hypot(b.vx, b.vy);
                speed = Math.min(speed + 0.2, this.maxBallSpeed * this.speedFactor);
                b.vx = speed * Math.sin(angle); b.vy = -speed * Math.cos(angle);
                this.shake = 10;
                audio.play('HIT');
            }
            for(let brick of this.bricks) {
                if(!brick.active) continue;
                if(b.x < brick.x + brick.w && b.x + this.ballSize > brick.x && b.y < brick.y + brick.h && b.y + this.ballSize > brick.y) {
                    this.hitBrick(brick);
                    if(b.x - b.vx + this.ballSize <= brick.x || b.x - b.vx >= brick.x + brick.w) b.vx *= -1; else b.vy *= -1;
                    break;
                }
            }
            if(Math.abs(b.vx) < 0.8) {
                b.stuckTimer = (b.stuckTimer || 0) + 1;
                if(b.stuckTimer > 120) {
                    const s = Math.hypot(b.vx, b.vy) || this.ballSpeed * this.speedFactor;
                    const dir = b.x < this.canvas.width / 2 ? 1 : -1;
                    b.vx = dir * Math.max(1.5, s * 0.35);
                    b.vy = (b.vy < 0 ? -1 : 1) * Math.sqrt(Math.max(s * s - b.vx * b.vx, 0));
                    b.stuckTimer = 0;
                }
            } else {
                b.stuckTimer = 0;
            }
            if(b.x <= 2 || b.x + this.ballSize >= this.canvas.width - 2 || b.y <= 2) {
                b.edgeTimer = (b.edgeTimer || 0) + 1;
                if(b.edgeTimer > 90) {
                    if(b.y <= 2 && Math.abs(b.vy) < 1) b.vy = 2;
                    if(b.x <= 2 && Math.abs(b.vx) < 1) b.vx = 2;
                    if(b.x + this.ballSize >= this.canvas.width - 2 && Math.abs(b.vx) < 1) b.vx = -2;
                    b.edgeTimer = 0;
                }
            } else {
                b.edgeTimer = 0;
            }
        }

        for(let i=this.powerups.length-1; i>=0; i--) {
            let p = this.powerups[i];
            p.y += 4;
            if(p.y > this.canvas.height) p.active = false;
            if(p.active && p.y+this.powerupH >= this.paddle.y && p.y <= this.paddle.y+this.paddleH && p.x+this.powerupW >= this.paddle.x && p.x <= this.paddle.x+this.paddleW) {
                p.active = false;
                if(p.type === 'LIFE') {
                    this.lives = Math.min(this.lives + 1, this.maxLives);
                    audio.play('POWERUP');
                } else if(p.type === 'MULTI') {
                    const slots = Math.max(0, 5 - this.balls.length);
                    const extra = Math.min(2, slots);
                    for(let k=0; k<extra; k++) this.addBall((k === 0 ? -0.35 : 0.35) + (Math.random()-0.5)*0.2);
                    if(extra === 0) this.score += 50;
                    audio.play('SCORE');
                } else if(p.type === 'GROW') {
                    this.growTimer = 600;
                    this.applyPaddleWidth();
                    audio.play('POWERUP');
                } else if(p.type === 'SHRINK') {
                    this.shrinkTimer = 480;
                    this.applyPaddleWidth();
                    audio.play('BAD');
                } else if(p.type === 'FAST') {
                    this.fastTimer = 480;
                    this.applySpeedFactor();
                    audio.play('BAD');
                } else if(p.type === 'SLOW') {
                    this.slowTimer = 480;
                    this.applySpeedFactor();
                    audio.play('POWERUP');
                } else if(p.type === 'ROCKET') {
                    this.rockets = Math.min(9, this.rockets + 3);
                    audio.play('POWERUP');
                } else if(p.type === 'FIRE') {
                    this.launchFireball();
                    audio.play('POWERUP');
                }
            }
            if(!p.active) this.powerups.splice(i, 1);
        }

        for(let i=this.projectiles.length-1; i>=0; i--) {
            const p = this.projectiles[i];
            p.y += p.vy;
            let hit = false;
            for(const brick of this.bricks) {
                if(!brick.active) continue;
                if(p.x > brick.x && p.x < brick.x + brick.w && p.y < brick.y + brick.h && p.y > brick.y - 8) { hit = true; break; }
            }
            if(hit || p.y < 10) {
                this.explodeRocket(p.x, Math.max(p.y, 10));
                this.projectiles.splice(i, 1);
            }
        }

        for(let i=this.fireballs.length-1; i>=0; i--) {
            const f = this.fireballs[i];
            f.y += f.vy;
            for(const brick of this.bricks) {
                if(!brick.active) continue;
                if(f.x + f.r > brick.x && f.x - f.r < brick.x + brick.w && f.y + f.r > brick.y && f.y - f.r < brick.y + brick.h) {
                    this.destroyBrick(brick, false);
                    this.spawnParticles(brick.x + brick.w/2, brick.y + brick.h/2, '#FF5A00');
                }
            }
            if(f.y < -30) this.fireballs.splice(i, 1);
        }

        const remaining = this.bricks.filter(b => b.active).length;
        if(!this.finishBoost && remaining > 0 && remaining <= 3) {
            this.finishBoost = true;
            this.maxBallSpeed += 2;
            const cap = this.maxBallSpeed * this.speedFactor;
            this.balls.forEach(ball => {
                const s = Math.hypot(ball.vx, ball.vy);
                if(s > 0) {
                    const target = Math.min(cap, s + 2);
                    ball.vx *= target / s; ball.vy *= target / s;
                }
            });
        }

        if(remaining === 0) { this.levelClear(); return; }

        if(this.balls.length === 0) {
            this.lives--; this.shake = 20;
            audio.playNoise(0.4, 0.25);
            if(this.lives <= 0) { 
                this.state = 'GAMEOVER'; 
                const isRecord = app.saveHighScore('BREAKOUT', this.score);
                app.showGameMessage(isRecord ? "NEW RECORD" : "SYSTEM FAILURE", "SCORE: " + this.score + " // LVL: " + this.level + "/" + BREAKOUT_LEVELS.length);
                audio.play('GAMEOVER');
            }
            else { this.state = 'WAITING'; app.showGameMessage("SIGNAL LOST", "CLICK TO RESUME // LVL: " + this.level + "/" + BREAKOUT_LEVELS.length); }
        }
    }

    spawnParticles(x, y, c) { for(let i=0; i<8; i++) this.particles.push(new Particle(x, y, c)); }

    draw() {
        this.ctx.fillStyle = CONSTANTS.COLOR_BG;
        this.ctx.fillRect(0,0, this.canvas.width, this.canvas.height);
        this.ctx.save();
        if(this.shake > 0 && !REDUCED_MOTION) this.ctx.translate((Math.random()-0.5)*this.shake, (Math.random()-0.5)*this.shake);
        this.ctx.font = "bold 30vh 'Courier New'"; this.ctx.textAlign = 'center'; this.ctx.textBaseline = 'middle'; this.ctx.fillStyle = '#111';
        this.ctx.fillText(this.score, this.canvas.width/2, this.canvas.height/2);
        
        // UI
        this.ctx.font = "bold 24px 'Courier New'"; 
        this.ctx.textAlign = 'left'; this.ctx.fillStyle = CONSTANTS.COLOR_FG;
        let livesStr = app.t('lives') + ": "; for(let i=0; i<this.lives; i++) livesStr += "♥ "; this.ctx.fillText(livesStr + " " + app.t('lvl') + ": " + (this.level > BREAKOUT_LEVELS.length ? this.level + "+" : this.level + "/" + BREAKOUT_LEVELS.length), 20, 84);
        // HI SCORE
        this.ctx.textAlign = 'right';
        this.ctx.fillText(app.t('hi') + ": " + app.getHighScore('BREAKOUT'), this.canvas.width - 20, 84);

        this.ctx.fillStyle = CONSTANTS.COLOR_FG; this.ctx.fillRect(this.paddle.x, this.paddle.y, this.paddleW, this.paddleH);
        this.bricks.forEach(b => {
            if(!b.active) return;
            const hard = b.maxHp > 1;
            this.ctx.fillStyle = hard && b.hp === b.maxHp ? CONSTANTS.COLOR_HARD : CONSTANTS.COLOR_FG;
            this.ctx.fillRect(b.x, b.y, b.w, b.h);
            if(hard && b.hp < b.maxHp) {
                this.ctx.strokeStyle = '#000'; this.ctx.lineWidth = 2;
                this.ctx.beginPath(); this.ctx.moveTo(b.x + 6, b.y + 6); this.ctx.lineTo(b.x + b.w - 6, b.y + b.h - 6); this.ctx.stroke();
            }
        });
        this.ctx.fillStyle = '#FFF'; this.balls.forEach(b => this.ctx.fillRect(b.x, b.y, this.ballSize, this.ballSize));
        this.powerups.forEach(p => {
            const style = BREAKOUT_POWERUPS[p.type] || BREAKOUT_POWERUPS.MULTI;
            const W = this.powerupW, H = this.powerupH;
            const pulse = 0.55 + 0.45 * Math.sin(performance.now() / 160 + p.x * 0.05);
            this.ctx.globalAlpha = pulse;
            this.ctx.fillStyle = style.color;
            this.ctx.fillRect(p.x - 4, p.y - 4, W + 8, H + 8);
            this.ctx.globalAlpha = 1;
            this.ctx.fillStyle = style.color;
            this.ctx.fillRect(p.x, p.y, W, H);
            this.ctx.strokeStyle = '#FFF'; this.ctx.lineWidth = 2;
            this.ctx.strokeRect(p.x, p.y, W, H);
            this.ctx.fillStyle = style.text;
            this.ctx.textAlign = 'left'; this.ctx.textBaseline = 'middle';
            this.ctx.font = "bold 13px 'Courier New'";
            this.ctx.fillText(style.icon, p.x + 6, p.y + H/2 + 1);
            this.ctx.font = "bold 11px 'Courier New'";
            this.ctx.fillText(app.t('p_' + p.type.toLowerCase()), p.x + 22, p.y + H/2 + 1);
        });
        this.projectiles.forEach(p => {
            this.ctx.fillStyle = '#FFD400';
            this.ctx.fillRect(p.x - 3, p.y - 10, 6, 16);
            this.ctx.fillStyle = '#FF5A00';
            this.ctx.fillRect(p.x - 2, p.y + 6, 4, 8);
        });
        this.fireballs.forEach(f => {
            this.ctx.globalAlpha = 0.35;
            this.ctx.fillStyle = '#FF5A00';
            this.ctx.beginPath(); this.ctx.arc(f.x, f.y, f.r + 6, 0, Math.PI * 2); this.ctx.fill();
            this.ctx.globalAlpha = 1;
            this.ctx.fillStyle = '#FF5A00';
            this.ctx.beginPath(); this.ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); this.ctx.fill();
            this.ctx.fillStyle = '#FFE066';
            this.ctx.beginPath(); this.ctx.arc(f.x, f.y, f.r * 0.5, 0, Math.PI * 2); this.ctx.fill();
        });
        this.particles.forEach(p => p.draw(this.ctx));

        const ly = this.canvas.height - 24;
        this.ctx.globalAlpha = 0.85;
        this.ctx.font = "bold 13px 'Courier New'";
        this.ctx.textAlign = 'left'; this.ctx.textBaseline = 'middle';
        const items = [];
        if(this.rockets > 0) items.push([app.t('rockets') + ' ' + this.rockets + ' — ' + app.t('click'), '#FFD400']);
        if(this.fastTimer > 0) items.push([app.t('fast') + ' ' + Math.ceil(this.fastTimer/60) + 's', '#FF8C00']);
        if(this.slowTimer > 0) items.push([app.t('slow') + ' ' + Math.ceil(this.slowTimer/60) + 's', '#4D7CFF']);
        if(this.growTimer > 0) items.push([app.t('grow') + ' ' + Math.ceil(this.growTimer/60) + 's', '#00FF88']);
        if(this.shrinkTimer > 0) items.push([app.t('shrink') + ' ' + Math.ceil(this.shrinkTimer/60) + 's', '#FF2D2D']);
        let sx = 20;
        items.forEach(([text, color]) => {
            this.ctx.fillStyle = color;
            this.ctx.fillText(text, sx, ly + 1);
            sx += this.ctx.measureText(text).width + 18;
        });
        this.ctx.globalAlpha = 1;
        this.ctx.restore();
    }
}

// ==========================================
// ENGINE 3: SNAKE
// ==========================================
class SnakeEngine {
    constructor(canvas, ctx) {
        this.canvas = canvas;
        this.ctx = ctx;
        this.grid = 20;
        this.playTop = 100;
        this.reset();
    }

    gridCols() { return Math.floor(this.canvas.width / this.grid); }
    gridRows() { return Math.floor((this.canvas.height - this.playTop - (app.touchVisible ? 170 : 0)) / this.grid); }

    makeObstacles() {
        this.obstacles = [];
        if (this.level < 2) return;
        const cols = this.gridCols();
        const rows = this.gridRows();
        const count = Math.min(12, (this.level - 1) * 3);
        let guard = 0;
        while (this.obstacles.length < count && guard++ < 200) {
            const cell = { x: Math.floor(Math.random() * cols), y: Math.floor(Math.random() * rows) };
            if (this.snake.some(s => s.x === cell.x && s.y === cell.y)) continue;
            if (this.food && this.food.x === cell.x && this.food.y === cell.y) continue;
            if (this.obstacles.some(o => o.x === cell.x && o.y === cell.y)) continue;
            this.obstacles.push(cell);
        }
    }

    reset() {
        const cx = Math.floor(this.gridCols() / 2);
        const cy = Math.floor(this.gridRows() / 2);
        this.snake = [{x: cx, y: cy}, {x: cx-1, y: cy}, {x: cx-2, y: cy}];
        this.dir = {x: 1, y: 0}; this.nextDir = {x: 1, y: 0};
        this.score = 0; this.level = 1; this.speed = 8; this.frameCount = 0; this.shake = 0; this.particles = []; this.state = 'WAITING';
        this.obstacles = [];
        this.spawnFood();
        app.showGameMessage("SNAKE", "PRESS ARROWS TO START");
    }

    spawnFood() {
        const cols = this.gridCols();
        const rows = this.gridRows();
        let valid = false;
        while(!valid) {
            this.food = { x: Math.floor(Math.random() * cols), y: Math.floor(Math.random() * rows) };
            const onSnake = this.snake.some(s => s.x === this.food.x && s.y === this.food.y);
            const onObstacle = this.obstacles.some(o => o.x === this.food.x && o.y === this.food.y);
            valid = !onSnake && !onObstacle;
        }
    }

    handleClick() {
        if (this.state === 'GAMEOVER') this.reset();
    }

    onResize(oldW, oldH, newW, newH) {
        const oldCols = Math.max(1, Math.floor(oldW / this.grid));
        const oldRows = Math.max(1, Math.floor((oldH - this.playTop - (app.touchVisible ? 170 : 0)) / this.grid));
        const cols = this.gridCols(), rows = this.gridRows();
        const sx = cols / oldCols, sy = rows / oldRows;
        this.snake.forEach(cell => {
            cell.x = Math.max(0, Math.min(cols - 1, Math.round(cell.x * sx)));
            cell.y = Math.max(0, Math.min(rows - 1, Math.round(cell.y * sy)));
        });
        if (this.food) {
            this.food.x = Math.max(0, Math.min(cols - 1, Math.round(this.food.x * sx)));
            this.food.y = Math.max(0, Math.min(rows - 1, Math.round(this.food.y * sy)));
        }
        this.obstacles.forEach(cell => {
            cell.x = Math.max(0, Math.min(cols - 1, Math.round(cell.x * sx)));
            cell.y = Math.max(0, Math.min(rows - 1, Math.round(cell.y * sy)));
        });
    }

    update() {
        this.updateParticles();
        const key = app.input.consumeArrow();
        if (key) {
            if (this.state === 'WAITING') { this.state = 'PLAYING'; app.hideGameMessage(); audio.play('UI_CLICK'); }
            if (key === 'ArrowUp' && this.dir.y === 0) this.nextDir = {x: 0, y: -1};
            if (key === 'ArrowDown' && this.dir.y === 0) this.nextDir = {x: 0, y: 1};
            if (key === 'ArrowLeft' && this.dir.x === 0) this.nextDir = {x: -1, y: 0};
            if (key === 'ArrowRight' && this.dir.x === 0) this.nextDir = {x: 1, y: 0};
        }
        if (this.state !== 'PLAYING') return;
        this.frameCount++;
        if (this.frameCount < this.speed) return;
        this.frameCount = 0; this.dir = this.nextDir;
        const head = {x: this.snake[0].x + this.dir.x, y: this.snake[0].y + this.dir.y};
        const cols = this.gridCols();
        const rows = this.gridRows();
        const eats = head.x === this.food.x && head.y === this.food.y;
        const hitObstacle = this.obstacles.some(o => o.x === head.x && o.y === head.y);
        if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows || hitObstacle || this.checkSelfCollision(head, !eats)) {
            this.state = 'GAMEOVER'; this.shake = 30; app.vibrate(40); this.spawnParticles(this.snake[0].x * this.grid, this.snake[0].y * this.grid, CONSTANTS.COLOR_FG);
            if (this.score >= 100) app.unlock('SNAKE_100');
            const isRecord = app.saveHighScore('SNAKE', this.score);
            app.showGameMessage(isRecord ? "NEW RECORD" : "SYSTEM FAILURE", "SCORE: " + this.score); 
            audio.playNoise(0.5);
            return;
        }
        this.snake.unshift(head);
        if (eats) {
            const previousLevel = this.level;
            this.score += 10; this.level = 1 + Math.floor(this.score / 100);
            if (this.level !== previousLevel) { this.makeObstacles(); app.toast(app.t('level') + ' ' + this.level); }
            app.vibrate(5);
            this.spawnFood(); this.shake = 5; this.spawnParticles(head.x * this.grid, head.y * this.grid, CONSTANTS.COLOR_HARD);
            audio.play('SCORE');
            if (this.speed > 3 && this.score % 50 === 0) this.speed--;
        } else { this.snake.pop(); }
    }

    // La queue libère sa case au même tick : on l'ignore si le serpent ne grandit pas.
    checkSelfCollision(head, tailMoves = true) {
        const body = tailMoves ? this.snake.slice(0, -1) : this.snake;
        return body.some(s => s.x === head.x && s.y === head.y);
    }
    updateParticles() { this.particles.forEach(p => p.update()); this.particles = this.particles.filter(p => p.life > 0); if (this.shake > 0) this.shake *= 0.8; }
    spawnParticles(x, y, c) { for(let i=0; i<8; i++) this.particles.push(new Particle(x + this.grid/2, this.playTop + y + this.grid/2, c)); }

    draw() {
        this.ctx.fillStyle = CONSTANTS.COLOR_BG; this.ctx.fillRect(0,0, this.canvas.width, this.canvas.height);
        this.ctx.save();
        if(this.shake > 0 && !REDUCED_MOTION) this.ctx.translate((Math.random()-0.5)*this.shake, (Math.random()-0.5)*this.shake);
        this.ctx.font = "bold 30vh 'Courier New'"; this.ctx.textAlign = 'center'; this.ctx.textBaseline = 'middle'; this.ctx.fillStyle = '#111';
        this.ctx.fillText(this.score, this.canvas.width/2, this.canvas.height/2);
        
        // HUD
        this.ctx.font = "bold 24px 'Courier New'";
        this.ctx.textAlign = 'left'; this.ctx.fillStyle = CONSTANTS.COLOR_FG;
        this.ctx.fillText(app.t('lvl') + ': ' + this.level, 20, 84);
        this.ctx.textAlign = 'right';
        this.ctx.fillText(app.t('hi') + ': ' + app.getHighScore('SNAKE'), this.canvas.width - 20, 84);

        const playHeight = this.canvas.height - (app.touchVisible ? 170 : 0);
        this.ctx.strokeStyle = '#0a0a0a'; this.ctx.lineWidth = 1;
        for (let x = 0; x < this.canvas.width; x += this.grid) { this.ctx.beginPath(); this.ctx.moveTo(x, this.playTop); this.ctx.lineTo(x, playHeight); this.ctx.stroke(); }
        for (let y = this.playTop; y < playHeight; y += this.grid) { this.ctx.beginPath(); this.ctx.moveTo(0, y); this.ctx.lineTo(this.canvas.width, y); this.ctx.stroke(); }
        this.ctx.fillStyle = '#2a2a2a';
        this.obstacles.forEach(o => { this.ctx.fillRect(o.x * this.grid + 1, this.playTop + o.y * this.grid + 1, this.grid - 2, this.grid - 2); });
        this.ctx.strokeStyle = '#777';
        this.obstacles.forEach(o => { this.ctx.strokeRect(o.x * this.grid + 1, this.playTop + o.y * this.grid + 1, this.grid - 2, this.grid - 2); });
        this.ctx.fillStyle = CONSTANTS.COLOR_FG;
        this.snake.forEach((s) => { this.ctx.fillRect(s.x * this.grid + 1, this.playTop + s.y * this.grid + 1, this.grid - 2, this.grid - 2); });
        this.ctx.fillStyle = CONSTANTS.COLOR_HARD; this.ctx.fillRect(this.food.x * this.grid, this.playTop + this.food.y * this.grid, this.grid, this.grid);
        this.particles.forEach(p => p.draw(this.ctx));
        this.ctx.restore();
    }
}

// ==========================================
// ENGINE 4: SPACE INVADERS
// ==========================================
class SpaceInvadersEngine {
    constructor(canvas, ctx) {
        this.canvas = canvas;
        this.ctx = ctx;
        this.reset();
    }

    reset() {
        this.score = 0;
        this.lives = 3;
        this.wave = 1;
        this.maxWaves = 3;
        this.particles = [];
        this.shake = 0;
        this.player = { x: this.canvas.width / 2 - 20, y: 0, w: 40, h: 20, speed: 6, cooldown: 0 };
        this.buildWave();
    }

    buildWave() {
        const bottomLift = app.touchVisible ? 140 : 0;
        this.player.x = this.canvas.width / 2 - this.player.w / 2;
        this.player.y = this.canvas.height - 50 - bottomLift;
        this.player.cooldown = 0;
        this.aliens = []; this.bullets = []; this.enemyBullets = []; this.bunkers = [];

        const rows = this.wave === 1 ? 4 : (this.wave === 2 ? 4 : 5);
        const cols = this.wave === 1 ? 8 : 10;
        const alienW = 30; const alienH = 20; const gap = 15;
        const startY = this.wave === this.maxWaves ? 170 : 130;
        const startX = (this.canvas.width - (cols * (alienW + gap))) / 2;
        for(let r=0; r<rows; r++) { for(let c=0; c<cols; c++) { this.aliens.push({ x: startX + c * (alienW + gap), y: startY + r * (alienH + gap), w: alienW, h: alienH, active: true }); } }
        if (this.wave === this.maxWaves) {
            this.aliens.push({ x: this.canvas.width/2 - 45, y: 110, w: 90, h: 45, active: true, hp: 12, maxHp: 12, boss: true });
        }
        this.alienDir = 1;
        this.alienSpeed = 1 + (this.wave - 1) * 0.25;
        this.ufo = null;
        this.ufoTimer = 900 + Math.random() * 600;
